<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>LEGACY 크리스탈 등급색·초월 즉시 이펙트 QA · 390×844</title>
<style>
  html,body{margin:0;background:#0b0b0d;color:#d8d2c4;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  #fr{position:absolute;left:0;top:0;width:390px;height:844px;border:0;background:#000;display:block}
  #bar{position:absolute;left:400px;top:0;width:320px;padding:6px;display:flex;flex-direction:column;gap:6px}
  #bar button{padding:7px 9px;border-radius:8px;border:1px solid #3a3f4a;background:#161a20;color:#e6dcc2;font:12px/1 inherit;text-align:left}
  #out{white-space:pre-wrap;font:11px/1.45 ui-monospace,monospace;color:#9fd2ff}
</style></head>
<body>
<iframe id="fr" scrolling="no" title="LEGACY mobile 390x844" src="../../legacy/index.html?vip=hs2026&amp;v=f2039"></iframe>
<div id="bar">
  <div>390×844 · <span id="qaV">…</span></div>
  <button id="bRare">rare (초록) 1단계에서 정지</button>
  <button id="bLegend">legend (노랑) 5단계에서 정지</button>
  <button id="bTrans">transcendent 자동오픈 측정</button>
  <button id="bAll">8등급 색·소리 전수</button>
  <button id="bClear">정리</button>
  <button id="bHoldTrans">초월 연출 순간 고정</button>
  <div id="out">ready</div>
</div>
<script>
(function () {
  var fr = document.getElementById('fr');
  var out = document.getElementById('out');
  document.getElementById('qaV').textContent = new Date().toISOString().slice(11, 19);
  var QA = window.QA = { errs: [], win: function () { return fr.contentWindow; }, doc: function () { return fr.contentDocument; },
    wait: function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); } };
  function log(o) { out.textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 1); }
  QA.log = log;
  function hook() {
    var w = fr.contentWindow;
    if (!w || w.__qaHooked) return;
    w.__qaHooked = true;
    w.addEventListener('error', function (e) { QA.errs.push('onerror: ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
    w.addEventListener('unhandledrejection', function (e) { QA.errs.push('rejection: ' + e.reason); });
    var ce = w.console.error;
    w.console.error = function () {
      QA.errs.push('console.error: ' + Array.prototype.map.call(arguments, function (x) { return String(x); }).join(' '));
      return ce.apply(w.console, arguments);
    };
  }
  fr.addEventListener('load', hook); hook();

  function zero() { var s = QA.win().LegacyPullSnd; if (s) { s.step = 0; s.burst = 0; s.trans = 0; s.crack = 0; } }
  function snap() { var s = QA.win().LegacyPullSnd || {}; return { step: s.step, burst: s.burst, trans: s.trans, crack: s.crack }; }
  function el() { return QA.doc().getElementById('pullFx'); }
  function tapFx() {
    var w = QA.win(), e = el();
    if (!e || e.hidden) return false;
    e.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerType: 'touch' }));
    return true;
  }
  QA.state = function () {
    var e = el();
    return {
      hidden: e ? e.hidden : null, g: e && e.getAttribute('data-g'), cls: e && e.className,
      pi: e && e.style.getPropertyValue('--pi'), tr: !!(e && e.querySelector('.pf-trans.on')),
      gradeName: (function () { var n = QA.doc().getElementById('pfGradeName'); return n ? n.textContent : ''; })(),
      snd: snap(), errs: QA.errs.slice(0, 6)
    };
  };
  /* target 단계까지 탭해서 도달한 뒤 멈춘다 */
  QA.reach = async function (grade, taps, settle) {
    zero();
    QA.win().LegacyPullFx({ f: { grade: grade } }, function () { QA.done = true; });
    await QA.wait(260);
    for (var i = 0; i < taps; i++) { tapFx(); await QA.wait(150); }
    await QA.wait(settle == null ? 220 : settle);
    return QA.state();
  };
  /* 초월 자동 오픈: 7번째 탭(도달) 시각부터 오버레이가 닫힐 때까지 */
  QA.transAuto = async function () {
    zero(); QA.done = false;
    QA.win().LegacyPullFx({ f: { grade: 'transcendent' } }, function () { QA.done = true; });
    await QA.wait(260);
    for (var i = 0; i < 7; i++) { tapFx(); await QA.wait(150); }
    var t0 = performance.now(), arrived = QA.state();
    var tClose = null, tOpenCls = null;
    while (performance.now() - t0 < 3000) {
      var s = QA.state();
      if (!tOpenCls && /pf-final/.test(s.cls || '')) tOpenCls = Math.round(performance.now() - t0);
      if (s.hidden) { tClose = Math.round(performance.now() - t0); break; }
      await QA.wait(25);
    }
    return { arrived: arrived, openAfterMs: tOpenCls, closeAfterMs: tClose, done: QA.done, snd: snap(), errs: QA.errs.slice(0, 6) };
  };
  QA.runAll = async function () {
    var gs = ['basic', 'rare', 'special', 'heroic', 'mythic', 'legend', 'legendary', 'transcendent'], res = [];
    for (var i = 0; i < gs.length; i++) {
      var st = await QA.reach(gs[i], i, 260);
      res.push({ g: gs[i], dataG: st.g, pi: st.pi, name: st.gradeName, snd: st.snd });
      /* 오버레이 닫기 */
      var e = el();
      if (e && !e.hidden) { tapFx(); await QA.wait(150); tapFx(); await QA.wait(500); }
    }
    return { grades: res, errs: QA.errs.slice(0, 8) };
  };
  /* 프레임을 잡아 두는 촬영용 — 앱의 JS 타이머만 8배 늦춰 초월 연출 순간을 유지한다 */
  QA.holdTrans = async function () {
    var w = QA.win(), d = QA.doc();
    QA.clear();
    var origST = w.setTimeout;
    w.setTimeout = function (fn, ms) {
      var rest = [].slice.call(arguments, 2);
      return origST.apply(w, [fn, (ms || 0) * 8].concat(rest));
    };
    QA.win().LegacyPullFx({ f: { grade: 'transcendent' } }, function () {});
    await QA.wait(260);
    for (var i = 0; i < 7; i++) { tapFx(); await QA.wait(150); }
    await QA.wait(120);
    d.getAnimations().forEach(function (a) { try { a.pause(); a.currentTime = 340; } catch (e) {} });
    w.setTimeout = origST;
    return QA.state();
  };
  QA.holdGrade = async function (grade, taps, at) {
    QA.clear();
    await QA.reach(grade, taps, 60);
    var d = QA.doc();
    d.getAnimations().forEach(function (a) { try { a.pause(); a.currentTime = at == null ? 300 : at; } catch (e) {} });
    return QA.state();
  };
  QA.clear = function () {
    var d = QA.doc();
    d.getAnimations().forEach(function (a) { try { a.play(); } catch (e) {} });
    var e = el(); if (e) { e.hidden = true; e.className = 'pullfx'; }
  };
  document.getElementById('bRare').onclick = function () { QA.reach('rare', 1).then(log); };
  document.getElementById('bLegend').onclick = function () { QA.reach('legend', 5).then(log); };
  document.getElementById('bTrans').onclick = function () { QA.transAuto().then(log); };
  document.getElementById('bAll').onclick = function () { QA.runAll().then(log); };
  document.getElementById('bHoldTrans').onclick = function () { QA.holdTrans().then(log); };
  document.getElementById('bClear').onclick = function () { QA.clear(); log('cleared'); };
})();
</script>
</body></html>
