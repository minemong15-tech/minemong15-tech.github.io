<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>LEGACY 뽑기 터치 QA · 390×844</title>
<style>
  html,body{margin:0;background:#0b0b0d;color:#d8d2c4;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:18px;padding:14px}
  #fr{width:390px;height:844px;border:1px solid #333;border-radius:14px;background:#000}
  #qa{padding-top:6px}
  #qa b{color:#f0d9a4}
  #qaErr{font-size:16px;color:#7ee787}
  #qaErr.bad{color:#ff7b72}
  #qaMsgs{max-width:640px;font-size:12px;color:#ffa198;word-break:break-all}
</style></head>
<body>
<div class="wrap">
  <iframe id="fr" src="/legacy/?vip=hs2026&amp;v=tapqa1" title="LEGACY mobile"></iframe>
  <div id="qa">
    <div><b>viewport</b> <span id="qaSize">…</span></div>
    <div id="qaErr">errors: 0</div>
    <div id="qaMsgs"></div>
  </div>
</div>
<script>
(function () {
  var fr = document.getElementById('fr');
  var n = 0, msgs = [];
  function upd() {
    var e = document.getElementById('qaErr');
    e.textContent = 'errors: ' + n + (n ? ' (bad)' : '');
    e.className = n ? 'bad' : '';
    document.getElementById('qaMsgs').textContent = msgs.slice(0, 6).join(' || ');
  }
  fr.addEventListener('load', function () {
    try {
      var w = fr.contentWindow;
      document.getElementById('qaSize').textContent = w.innerWidth + 'x' + w.innerHeight + ' dpr' + w.devicePixelRatio;
      w.addEventListener('error', function (ev) {
        n++; msgs.push((ev.message || 'error') + ' @' + String(ev.filename || '').split('/').pop() + ':' + ev.lineno); upd();
      });
      w.addEventListener('unhandledrejection', function (ev) {
        n++; msgs.push('promise:' + ((ev.reason && ev.reason.message) || ev.reason)); upd();
      });
      var ce = w.console.error;
      w.console.error = function () {
        n++; msgs.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); upd();
        if (ce) ce.apply(w.console, arguments);
      };
      upd();
    } catch (err) { msgs.push('hook failed: ' + err.message); upd(); }
  });
  upd();
})();
</script>
</body></html>
