<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>LEGACY 초월 이펙트 QA · 390×844</title>
<style>
  html,body{margin:0;background:#0b0b0d;color:#d8d2c4;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:14px;padding:10px}
  #fr{width:390px;height:844px;border:1px solid #333;border-radius:14px;background:#000;flex:0 0 auto}
  #panel{width:520px;padding-top:2px}
  #panel b{color:#f0d9a4}
  #qaErr{font-size:16px;color:#7ee787;margin:4px 0}
  #qaErr.bad{color:#ff7b72}
  #qaMsgs{font-size:11px;color:#ffa198;word-break:break-all;max-height:90px;overflow:auto;margin-bottom:8px}
  button{margin:3px 4px 3px 0;padding:6px 10px;border-radius:8px;border:1px solid #3a3f4a;background:#161a20;color:#e6dcc2;font:12px/1 inherit;cursor:pointer}
  button:hover{background:#1f2530}
  #out{margin-top:8px;font-size:11px;line-height:1.5;color:#9fd2ff;white-space:pre-wrap;max-height:470px;overflow:auto}
</style></head>
<body>
<div class="wrap">
  <iframe id="fr" title="LEGACY mobile"></iframe>
  <div id="panel">
    <div><b>viewport</b> <span id="qaSize">…</span></div>
    <div id="qaErr">errors: 0</div>
    <div id="qaMsgs"></div>
    <button data-act="open">1 뽑기 열기</button>
    <button data-act="pull5">2 5회 뽑기</button>
    <button data-act="taps">3 8번 탭(문구 기록)</button>
    <button data-act="skipfx">4 팡까지</button>
    <button data-act="holdgap">5 카드 간격 멈춤</button>
    <button data-act="all">6 전부 보기</button>
    <button data-act="pause">⏸ 애니 정지</button>
    <button data-act="resume">▶ 재생</button>
    <button data-act="state">상태</button>
    <button data-act="txt">화면 문구 수집</button>
    <button data-act="flow">🔄 초월 준비(재로딩·5회)</button>
    <button data-act="transrun">🌟 초월 풀 시나리오</button>
    <button data-act="shot1">📸 초월 터치 정지</button>
    <button data-act="shot2">📸 초월 카드 정지</button>
    <button data-act="resume">▶ 재생</button>
    <div id="out"></div>
  </div>
</div>
<script>
(function () {
  var fr = document.getElementById('fr');
  var errN = 0, msgs = [];
  var out = document.getElementById('out');
  function log(s) { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function upd() {
    var e = document.getElementById('qaErr');
    e.textContent = 'errors: ' + errN + (errN ? ' (bad)' : '');
    e.className = errN ? 'bad' : '';
    document.getElementById('qaMsgs').textContent = msgs.slice(-4).join(' || ');
  }
  function hook() {
    try {
      var w = fr.contentWindow;
      document.getElementById('qaSize').textContent = w.innerWidth + 'x' + w.innerHeight + ' dpr' + w.devicePixelRatio;
      w.addEventListener('error', function (ev) { errN++; msgs.push((ev.message || 'error') + ' @' + String(ev.filename || '').split('/').pop() + ':' + ev.lineno); upd(); });
      w.addEventListener('unhandledrejection', function (ev) { errN++; msgs.push('promise:' + ((ev.reason && ev.reason.message) || ev.reason)); upd(); });
      var ce = w.console.error;
      w.console.error = function () { errN++; msgs.push('console.error: ' + Array.prototype.join.call(arguments, ' ')); upd(); if (ce) ce.apply(w.console, arguments); };
      upd();
    } catch (e) { msgs.push('hook failed: ' + e.message); upd(); }
  }
  fr.addEventListener('load', hook);

  function W() { return fr.contentWindow; }
  function D() { return fr.contentWindow.document; }
  function q(sel) { return D().querySelector(sel); }
  function txt(el) { return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : '-'; }
  function pfSnap() {
    var el = q('#pullFx');
    var gr = q('#pfGradeName');
    var grBox = gr ? gr.closest('.pf-grade') : null;
    return {
      tip: txt(q('#pfTip')),
      grade: txt(q('#pfGradeName')),
      kick: txt(q('#pfGradeKicker')),
      dg: el ? el.getAttribute('data-g') : '-',
      tr: el ? el.classList.contains('pf-tr') : false,
      tipShown: !!(q('#pfTip') && q('#pfTip').offsetParent !== null),
      gradeShown: !!(grBox && grBox.offsetParent !== null)
    };
  }
  function tapFx() {
    var el = q('#pullFx');
    el.dispatchEvent(new (W().PointerEvent)('pointerdown', { bubbles: true, cancelable: true }));
  }

  var acts = {
    open: function () {
      var b = q('#sdPack'); if (b) b.click(); else q('#pkOpen') && q('#pkOpen').click();
      log('pack modal open');
    },
    pull5: async function () {
      var b = q('#pull5'); if (b) b.click();
      await sleep(220);
      log('pull5 · fx=' + (q('#pullFx') && !q('#pullFx').hidden) + ' · ' + JSON.stringify(pfSnap()));
    },
    taps: async function () {
      for (var i = 0; i < 9; i++) {
        tapFx();
        await sleep(170);
        var s = pfSnap();
        log('tap' + (i + 1) + ' · tip="' + s.tip + '" · grade="' + s.grade + '" · kick="' + s.kick + '" · g=' + s.dg + ' · tr=' + s.tr);
        if (!s.tipShown && !s.gradeShown) log('   (텍스트 숨김 상태)');
        if (q('#pullFx').classList.contains('pf-final')) { log('   → openFinal'); break; }
      }
    },
    skipfx: async function () {
      var sk = q('#pfSkip'); if (sk) sk.click();
      await sleep(900);
      log('skip → cards=' + D().querySelectorAll('#reveal .pcard').length + ' · bar=' + (q('#seqBar') && !q('#seqBar').hidden));
    },
    holdgap: function () {
      var w = W();
      if (!w.__origST) {
        w.__origST = w.setTimeout;
        w.setTimeout = function (fn, ms) {
          var a = [].slice.call(arguments, 2), r = w.__qaRanges || [];
          for (var i = 0; i < r.length; i++) { if (ms >= r[i][0] && ms <= r[i][1]) return 0; }
          return w.__origST.apply(w, [fn, ms].concat(a));
        };
      }
      w.__qaRanges = [[400, 960]];
      log('card gap timers blocked');
    },
    all: function () { var b = q('#seqAll'); if (b) b.click(); log('skip all'); },
    pause: function () {
      var n = 0;
      D().getAnimations().forEach(function (a) { try { a.pause(); n++; } catch (e) {} });
      log('animations paused: ' + n);
    },
    resume: function () {
      var n = 0;
      D().getAnimations().forEach(function (a) { try { a.play(); n++; } catch (e) {} });
      log('animations resumed: ' + n);
    },
    state: function () {
      var cards = D().querySelectorAll('#reveal .pcard');
      log('· counter=' + (q('#seqCount') ? q('#seqCount').textContent : '-') +
        ' · shown=' + D().querySelectorAll('#reveal .pcard.sq-in').length + '/' + cards.length +
        ' · seqTrans=' + (q('#seqTrans') && q('#seqTrans').className) +
        ' · plaque=' + (q('#seqPlaque') && q('#seqPlaque').className) +
        ' · newfx=' + (q('#newFx') && !q('#newFx').hidden) +
        ' · lock=' + (q('#mPack') && q('#mPack').classList.contains('seq-lock')));
      var tr = q('#seqTrans');
      if (tr) {
        var rays = tr.querySelector('.st-halo');
        var anim = rays && rays.getAnimations ? rays.getAnimations().length : '?';
        log('· seqTrans halo animations=' + anim + ' · ' + JSON.stringify(pfSnap()));
      }
      var pi = q('.pf-trans .pt-rays');
      if (pi) log('· pf-trans rays animations=' + (pi.getAnimations ? pi.getAnimations().length : '?'));
    },
    txt: function () {
      var el = q('#pullFx');
      var s = pfSnap();
      log('PF :: ' + JSON.stringify(s));
      var all = D().body.innerText.replace(/\s+/g, ' ');
      log('화면에 "남음" 포함: ' + /남음/.test(all) + ' / "/ 8" 포함: ' + /\/\s*8/.test(all));
    },
    /* 초월 준비 — 천장까지 1회 남기고 새로 열어 5회 뽑기까지 */
    flow: async function () {
      var st = { v: 1, userName: '테스터', userAge: 20, pity: 49, att: [], log: [] };
      W().localStorage.setItem('legacy.vip.state.v1', JSON.stringify(st));
      fr.src = '/legacy/?vip=hs2026&v=f2036&qa=' + Date.now() + 'f';
      await sleep(2400);
      log('reload · err=' + errN);
      var b = q('#sdPack'); if (b) b.click(); else if (q('#pkOpen')) q('#pkOpen').click();
      await sleep(350);
      var p5 = q('#pull5'); if (!p5) { log('pull5 없음'); return; }
      p5.click();
      await sleep(280);
      log('pull5 · ' + JSON.stringify(pfSnap()));
    },
    transrun: async function () {
      log('=== 초월 풀 시나리오 ===');
      var st = { v: 1, userName: '테스터', userAge: 20, pity: 49, att: [], log: [] };
      W().localStorage.setItem('legacy.vip.state.v1', JSON.stringify(st));
      fr.src = '/legacy/?vip=hs2026&v=f2036&qa=' + Date.now() + 'r';
      await sleep(2200);
      log('reload done · err=' + errN);
      var b = q('#sdPack'); if (b) b.click(); else if (q('#pkOpen')) q('#pkOpen').click();
      await sleep(320);
      var p5 = q('#pull5'); if (!p5) { log('pull5 없음'); return; }
      p5.click();
      await sleep(260);
      log('pull5 · ' + JSON.stringify(pfSnap()));
      var seenTr = false, log2 = [];
      for (var i = 0; i < 9; i++) {
        tapFx();
        await sleep(180);
        var s = pfSnap();
        log2.push('tap' + (i + 1) + ' g=' + s.dg + ' grade="' + s.grade + '" tip="' + s.tip + '" tr=' + s.tr + ' tipShown=' + s.tipShown + ' gradeShown=' + s.gradeShown);
        if (s.tr && !seenTr) {
          seenTr = true;
          log('★ 초월 도달 — 텍스트 숨김=' + (!s.tipShown && !s.gradeShown) + ' · 팁="' + s.tip + '"');
        }
        if (q('#pullFx') && q('#pullFx').classList.contains('pf-final')) { log('openFinal 진입 · 팁="' + txt(q('#pfTip')) + '"'); break; }
      }
      log2.forEach(function (x) { log('  ' + x); });
      await sleep(700);
      log('seq 시작 · ' + D().querySelectorAll('#reveal .pcard').length + '장 · seqTrans=' + (q('#seqTrans') && q('#seqTrans').className));
      var trc = D().querySelector('#reveal .pcard.tr');
      log('초월 카드 tr 클래스: ' + !!trc + ' · seqTrans.on=' + !!(q('#seqTrans') && q('#seqTrans').classList.contains('on')));
      log('errors: ' + errN);
    },
    /* 초월 터치 단계에서 애니 정지 */
    shot1: async function () {
      for (var i = 0; i < 9; i++) {
        tapFx();
        await sleep(150);
        if (pfSnap().tr) break;
      }
      await sleep(130);
      var n = 0;
      D().getAnimations().forEach(function (a) { try { a.pause(); n++; } catch (e) {} });
      log('paused@tr · anims=' + n + ' · ' + JSON.stringify(pfSnap()));
    },
    /* 초월 오픈 → 카드 공개 중 초월 카드에서 애니 정지 */
    shot2: async function () {
      D().getAnimations().forEach(function (a) { try { a.play(); } catch (e) {} });
      await sleep(300);
      tapFx();
      await sleep(760);
      var found = false;
      for (var k = 0; k < 120; k++) {
        if (q('#reveal .pcard.tr')) { found = true; break; }
        await sleep(50);
      }
      await sleep(170);
      var n = 0;
      D().getAnimations().forEach(function (a) { try { a.pause(); n++; } catch (e) {} });
      log('paused@seq · tr card=' + found + ' · anims=' + n +
        ' · seqTrans=' + (q('#seqTrans') && q('#seqTrans').className) +
        ' · plaque=' + (q('#seqPlaque') && q('#seqPlaque').className) +
        ' · count=' + (q('#seqCount') && q('#seqCount').textContent));
    },
  };

  document.querySelectorAll('button[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var f = acts[b.getAttribute('data-act')];
      if (f) { try { f(); } catch (e) { log('ERR ' + e.message); } }
    });
  });
  window.__qa = { acts: acts, log: log };
  fr.src = '/legacy/?vip=hs2026&v=f2036&qa=' + Date.now();
})();
</script>
</body></html>
