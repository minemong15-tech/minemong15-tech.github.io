<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>LEGACY 룬 코어 크리스탈 QA · 390×844</title>
<style>
  html,body{margin:0;background:#0b0b0d;color:#d8d2c4;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  .wrap{padding:8px}
  #fr{display:block;width:390px;height:844px;border:1px solid #333;border-radius:14px;background:#000}
  #qaNote{color:#8f9aa8;margin:4px 0 6px}
</style></head>
<body>
<div class="wrap">
  <div id="qaNote">LEGACY · 모바일 390×844 · 리로드 <span id="qaV">…</span></div>
  <iframe id="fr" title="LEGACY mobile" src="../../legacy/index.html?vip=hs2026&amp;v=q2"></iframe>
</div>
<script>
(function () {
  var fr = document.getElementById('fr');
  document.getElementById('qaV').textContent = new Date().toISOString().slice(11, 19);
  var QA = window.QA = {
    errs: [], warns: [],
    win: function () { return fr.contentWindow; },
    doc: function () { return fr.contentDocument; },
    wait: function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  };
  function hook() {
    var w = fr.contentWindow;
    if (!w || w.__qaHooked) return;
    w.__qaHooked = true;
    w.addEventListener('error', function (e) {
      QA.errs.push('onerror: ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    w.addEventListener('unhandledrejection', function (e) { QA.errs.push('rejection: ' + e.reason); });
    var ce = w.console.error;
    w.console.error = function () {
      QA.errs.push('console.error: ' + Array.prototype.map.call(arguments, function (x) { return String(x); }).join(' '));
      return ce.apply(w.console, arguments);
    };
  }
  fr.addEventListener('load', hook);
  hook();

  function zero() {
    var s = QA.win().LegacyPullSnd;
    if (!s) return null;
    s.step = 0; s.burst = 0; s.trans = 0; s.crack = 0;
    return s;
  }
  function snap() {
    var s = QA.win().LegacyPullSnd || {};
    return { step: s.step, burst: s.burst, trans: s.trans, crack: s.crack };
  }
  function tapFx() {
    var w = QA.win(), el = QA.doc().getElementById('pullFx');
    if (!el) return false;
    el.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerType: 'touch' }));
    return true;
  }
  QA.tapUntilDone = async function (maxTaps) {
    var el = QA.doc().getElementById('pullFx'), n = 0;
    while (!el.hidden && n < (maxTaps || 26)) { tapFx(); n++; await QA.wait(140); }
    await QA.wait(500);
    return { taps: n, hidden: el.hidden };
  };
  /* 등급별 연출 1회 — 확정음(burst/trans)이 정확히 1회인지 */
  QA.testGrade = async function (grade, taps) {
    var w = QA.win();
    zero();
    var done = false;
    w.LegacyPullFx({ f: { grade: grade } }, function () { done = true; });
    await QA.wait(260);
    var first = snap();
    if (taps) { tapFx(); await QA.wait(200); tapFx(); }
    var res = await QA.tapUntilDone(26);
    var after = snap();
    return { grade: grade, first: first, after: after, taps: res.taps, hidden: res.hidden, done: done };
  };
  QA.runAll = async function () {
    var out = [];
    var grades = ['basic', 'rare', 'special', 'heroic', 'mythic', 'legend', 'legendary', 'transcendent'];
    for (var i = 0; i < grades.length; i++) { out.push(await QA.testGrade(grades[i], false)); }
    return { grades: out, errs: QA.errs.slice(0, 8) };
  };
  /* 실제 뽑기 버튼 경로 — 카드팩 모달 → 뽑기권 1회 */
  QA.realPull = async function () {
    var d = QA.doc();
    zero();
    d.getElementById('packBtn').click();
    await QA.wait(500);
    var t = d.getElementById('pullTicket');
    t.click();
    await QA.wait(700);
    var el = d.getElementById('pullFx');
    var vis = !el.hidden;
    var res = await QA.tapUntilDone(26);
    await QA.wait(600);
    var after = snap();
    return { overlayShown: vis, taps: res.taps, hidden: res.hidden, after: after, errs: QA.errs.slice(0, 8) };
  };
  QA.state = function () {
    var el = QA.doc().getElementById('pullFx');
    var s = el ? el.querySelector('.pf-crystal') : null;
    var capLeft = QA.doc().querySelectorAll('.pf-cap, .pf-band, .pf-shine, .pf-tint, .pf-edge').length;
    return {
      hidden: el ? el.hidden : null,
      dataG: el && el.getAttribute('data-g'),
      cls: el && el.className,
      crystal: !!s,
      capNodes: capLeft,
      snd: snap(),
      errs: QA.errs.slice(0, 8)
    };
  };
})();
</script>
</body></html>
