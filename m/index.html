<style>
:root{
  --bg:#060b18;--bg2:#0a1226;--card:#0e1830;--card2:#12203c;--line:#1c2c4e;
  --txt:#e8eefc;--sub:#8fa3c8;--dim:#5a6c8f;
  --blue:#1e6ef5;--cyan:#37c6ff;--green:#2fd67b;--red:#ff5a5a;--amber:#ffb020;
  --radius:18px;--nav-h:64px;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--font);
  font-feature-settings:'ss01' on,'tnum' 1;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  letter-spacing:-.1px;
  overscroll-behavior:none;touch-action:manipulation;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(30,110,245,.20),transparent 60%),
                   radial-gradient(80% 50% at 100% 0%,rgba(55,198,255,.10),transparent 60%);
  background-attachment:fixed;
}
#app{max-width:520px;margin:0 auto;position:relative;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--txt)}

/* ---------- entry ---------- */
.entry{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.entry-glow{position:absolute;top:-120px;left:50%;width:460px;height:460px;margin-left:-230px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,110,245,.30),transparent 72%);filter:blur(14px);pointer-events:none}
.entry-top{text-align:center;margin-bottom:26px;position:relative}
.entry-logo{width:104px;height:104px;filter:drop-shadow(0 12px 26px rgba(30,110,245,.55));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.entry h1{font-size:54px;font-weight:900;letter-spacing:5px;line-height:1.02;margin-top:10px;
  background:linear-gradient(135deg,#ffffff,var(--cyan) 55%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.entry-tag{color:var(--sub);font-size:13.5px;letter-spacing:.1px;margin-top:4px;word-break:keep-all}
.card{background:linear-gradient(180deg,rgba(18,32,60,.92),rgba(10,18,38,.92));border:1px solid var(--line);border-radius:var(--radius)}
.entry-card{width:100%;max-width:370px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -24px rgba(0,0,0,.9)}
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:12px;color:var(--sub);letter-spacing:.3px;padding-left:2px}
.field input,.mini{background:#0a1428;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;width:100%;transition:border-color .18s,box-shadow .18s}
.field input:focus,.mini:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,110,245,.18)}
.field input::placeholder,.mini::placeholder{color:var(--dim)}
.roomrow{display:flex;gap:8px}
.roomrow input{letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
.ghost{background:#141f3a;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--txt);transition:.16s}
.ghost:active{transform:scale(.98);background:#1a2949}
.primary{background:linear-gradient(135deg,var(--blue),#0d8ae6 60%,var(--cyan));border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;box-shadow:0 10px 24px -10px rgba(30,110,245,.9);letter-spacing:.5px;transition:.16s}
.primary:active{transform:scale(.985);filter:brightness(1.06)}
.hint{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
.entry-foot{margin-top:22px;color:var(--dim);font-size:12px;letter-spacing:2px}

/* ---------- header ---------- */
#main{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;flex:none;
  background:linear-gradient(180deg,rgba(6,11,24,.98),rgba(6,11,24,.86));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.hlogo{width:28px;height:28px;border-radius:8px;display:block;box-shadow:0 4px 14px -4px rgba(30,110,245,.8)}
.brand{font-size:20px;font-weight:900;letter-spacing:1.5px;line-height:1;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:#101d36;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--cyan);display:flex;align-items:center;gap:5px}
.chip:active{background:#16274a}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.people{font-size:11.5px;color:var(--sub);background:#0f1b32;border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);transition:.2s}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.ing{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.netbanner{flex:none;font-size:12px;color:#ffd9a8;background:rgba(255,176,32,.12);border-bottom:1px solid rgba(255,176,32,.28);padding:7px 14px;display:flex;align-items:center;gap:8px}
.netbanner button{margin-left:auto;color:var(--amber);font-weight:700;font-size:12px;text-decoration:underline}

/* ---------- layout ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.view{padding:14px 14px 0;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.view-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.view-h h2{font-size:18.5px;font-weight:800;letter-spacing:-.35px;word-break:keep-all}
.muted{font-size:11.5px;color:var(--dim)}
.pill{background:linear-gradient(135deg,var(--blue),#0f7fd8);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:800;color:#fff;box-shadow:0 8px 18px -10px rgba(30,110,245,.9)}
.pill:active{transform:scale(.97)}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:46px 10px;line-height:1.7}
.empty-ico{font-size:34px;margin-bottom:8px;opacity:.85}

/* ---------- chat ---------- */
.chat-list{padding-bottom:150px;display:flex;flex-direction:column;gap:12px}
.sys{text-align:center;font-size:11.5px;color:var(--dim);padding:2px 0}
.sys span{background:#0c1730;border:1px solid var(--line);border-radius:999px;padding:4px 11px;display:inline-block}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#06101f;
  background:linear-gradient(135deg,hsl(var(--h),85%,66%),hsl(calc(var(--h) + 40),90%,72%))}
.bwrap{max-width:76%;display:flex;flex-direction:column;gap:3px}
.row.me .bwrap{align-items:flex-end}
.nick{font-size:11px;color:var(--sub);padding-left:3px}
.bubble{padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;letter-spacing:-.15px;word-break:break-word;position:relative;transition:.15s}
.bubble.ob{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.mb{background:linear-gradient(135deg,var(--blue),#1288e0);border-bottom-right-radius:5px;box-shadow:0 8px 20px -12px rgba(30,110,245,1);color:#fff}
.bubble a{color:inherit;text-decoration:underline;opacity:.9}
.meta{font-size:10px;color:var(--dim);padding:0 4px}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rxc{background:#122044;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 7px;color:var(--sub)}
.rxbar{display:none;gap:2px;background:#101d36;border:1px solid var(--line);border-radius:999px;padding:3px 5px;margin-top:2px;box-shadow:0 8px 20px -12px #000}
.rxbar button{font-size:16px;padding:2px 5px;border-radius:999px;line-height:1}
.rxbar button:active{background:#1b2c4f}
.row.open .rxbar{display:flex}
/* 읽음 표시 (DM 스타일) */
.readbar{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:0 6px;margin-top:-6px}
.readbar .ravs{display:flex;align-items:center}
.rmin{width:15px;height:15px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:800;color:#06101f;border:1.5px solid var(--bg,#060b18);margin-left:-5px;
  background:linear-gradient(135deg,hsl(var(--h),85%,66%),hsl(calc(var(--h) + 40),90%,72%));font-style:normal}
.rmin:first-child{margin-left:0}
.rmin.more{background:#1b2c4f;color:var(--sub);font-size:8px}
.readbar .rlabel{font-size:10.5px;color:var(--dim);letter-spacing:-.1px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:8px 12px 10px;
  background:linear-gradient(180deg,rgba(6,11,24,0),rgba(6,11,24,.94) 30%);backdrop-filter:blur(6px);z-index:6}
.emojis{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.emojis::-webkit-scrollbar{display:none}
.emojis button{font-size:17px;background:#101d36;border:1px solid var(--line);border-radius:999px;padding:4px 9px;flex:none}
.emojis button:active{background:#1a2c4d;transform:scale(.95)}
.cbox{display:flex;gap:8px;align-items:center}
.cbox input{flex:1;background:#0c1830;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:14.5px;outline:none}
.cbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,110,245,.15)}
.send{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:19px;font-weight:900;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(30,110,245,1)}
.send:active{transform:scale(.94)}

/* ---------- vote ---------- */
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:26px}
.poll{padding:15px}
.poll-h{display:flex;gap:8px;align-items:flex-start}
.q{font-size:15px;font-weight:700;flex:1;line-height:1.42;letter-spacing:-.2px;word-break:keep-all}
.del{color:var(--dim);font-size:13px;padding:2px 4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;overflow:hidden;text-align:left;background:#0a1428;border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:8px;font-size:13.5px;transition:.2s}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(30,110,245,.5),rgba(55,198,255,.36));transition:width .45s cubic-bezier(.4,0,.2,1);z-index:0}
.opt .ol{position:relative;z-index:1;flex:1;font-weight:600}
.opt .oc{position:relative;z-index:1;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700}
.opt.sel{border-color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(55,198,255,.5)}
.opt.sel .fill{background:linear-gradient(90deg,rgba(30,110,245,.75),rgba(55,198,255,.55))}
.opt:active{transform:scale(.995)}
.poll-f{margin-top:10px;font-size:11.5px;color:var(--dim)}

/* ---------- game ---------- */
.seg{display:flex;gap:6px;background:#0b1529;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg-b{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub);transition:.18s}
.seg-b.active{background:linear-gradient(135deg,var(--blue),#0f7fd8);color:#fff;box-shadow:0 8px 18px -12px rgba(30,110,245,1)}
.stage{border-radius:var(--radius);overflow:hidden}
.gstage{background:linear-gradient(160deg,#101d38,#0a1428);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center;position:relative;overflow:hidden}
.gstage h3{font-size:17px;font-weight:800;margin-bottom:6px}
.gstage p{font-size:12.5px;color:var(--sub);line-height:1.6}
.gico{font-size:34px;margin-bottom:6px}
.gbtn{margin-top:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:14px;padding:13px 26px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 12px 26px -14px rgba(30,110,245,1)}
.gbtn:active{transform:scale(.97)}
.gstage.wait,.gstage.go{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;user-select:none}
.gstage.wait{background:linear-gradient(160deg,#1a1f3a,#101528)}
.gstage.go{background:linear-gradient(160deg,#0f9d58,#12c46a);border-color:#12c46a;cursor:pointer}
.gstage.go h3{font-size:34px;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.3)}
.gstage.go p{color:rgba(255,255,255,.85)}
.pulse{width:22px;height:22px;border-radius:50%;background:var(--amber);margin-bottom:14px;animation:pl 1s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)}70%{box-shadow:0 0 0 18px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
.toosoon{background:linear-gradient(160deg,#5a1f2b,#2a1018)!important;border-color:#7d2b3a!important}
.gstage .times{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.gstage .times span{background:#0a1428;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.avg{font-size:40px;font-weight:900;letter-spacing:-1.6px;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.speed{min-height:280px;padding:0!important;background:linear-gradient(160deg,#0d1830,#080f1f)}
.sp-top{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.sp-top b{color:#fff;font-size:15px}
.sp-arena{position:relative;height:238px;overflow:hidden}
.target{position:absolute;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#8ef3ff,var(--cyan) 40%,#0d7ec0 100%);
  box-shadow:0 0 0 8px rgba(55,198,255,.14),0 8px 22px -8px #37c6ff;font-size:0;transition:left .06s linear,top .06s linear}
.target:active{transform:translate(-50%,-50%) scale(.9)}
.sp-idle{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center;gap:4px}
.board{margin-top:14px;padding-bottom:26px}
.board-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.board-h b{font-size:14px}
.board-list{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.brow.me{border-color:rgba(55,198,255,.55);background:linear-gradient(90deg,rgba(30,110,245,.22),rgba(55,198,255,.1))}
.brow .rk{width:22px;text-align:center;font-weight:800;color:var(--sub);font-size:13px}
.brow .bn{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bv{font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.board-empty{font-size:12.5px;color:var(--dim);text-align:center;padding:18px}

/* ---------- dday ---------- */
.dday-grid{display:flex;flex-direction:column;gap:10px;padding-bottom:26px}
.dcard{display:flex;align-items:center;gap:13px;padding:14px 15px;background:linear-gradient(135deg,#12203c,#0c1730);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
.dcard::after{content:'';position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,110,245,.35),transparent)}
.dcard.soon{border-color:rgba(255,176,32,.45)}
.dcard.today{border-color:rgba(255,90,90,.6);background:linear-gradient(135deg,#2a1420,#150b14)}
.dcard.past{opacity:.62}
.dico{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:#0a1428;border-radius:13px;border:1px solid var(--line);flex:none}
.dinfo{flex:1;min-width:0}
.dtitle{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddate{font-size:11.5px;color:var(--dim);margin-top:2px}
.dnum{font-size:19px;font-weight:900;color:var(--cyan);letter-spacing:-.5px;flex:none;font-variant-numeric:tabular-nums}
.dcard.today .dnum{color:#ff8a8a}

/* ---------- reels ---------- */
#scroller.reel-mode{overflow:hidden;padding:0;overscroll-behavior:none}
.view-reels{position:absolute;inset:0;overflow:hidden;background:#05080f}
.reel-feed{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
.reel-feed::-webkit-scrollbar{display:none}
.reel{position:relative;width:100%;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#0a0e1c;display:flex;flex-direction:column;justify-content:flex-end}
.reel-media{position:absolute;inset:0}
.reel-media img{width:100%;height:100%;object-fit:cover;display:block}
.reel-media::after{content:'';position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 16%,rgba(255,255,255,.18),transparent 62%)}
.reel-quote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:64px 30px 130px;text-align:center;white-space:pre-line;
  font-size:clamp(24px,7.4vw,31px);line-height:1.36;font-weight:900;letter-spacing:-1px;color:#fff;text-shadow:0 6px 28px rgba(0,0,0,.42);word-break:keep-all}
.reel-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,6,14,.5) 0%,transparent 20%,transparent 45%,rgba(3,6,14,.88) 100%);pointer-events:none}
.reel-top{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:7px;z-index:2;pointer-events:none}
.reel-pos{font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.9);background:rgba(6,11,24,.5);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.reel-tag{font-size:10px;font-weight:800;letter-spacing:.2px;color:#06101f;background:linear-gradient(135deg,#fff,var(--cyan));padding:3px 8px;border-radius:999px}
.reel-side{position:absolute;right:12px;bottom:104px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:3}
.rlike{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.rlike .rh{font-size:28px;line-height:1;filter:grayscale(.6) brightness(1.08);transition:transform .18s,filter .18s;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.rlike b{font-size:11.5px;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 6px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.rlike.on .rh{filter:none;animation:hb .46s ease}
@keyframes hb{0%{transform:scale(1)}35%{transform:scale(1.3)}70%{transform:scale(.94)}100%{transform:scale(1)}}
.rside{width:42px;height:42px;border-radius:50%;background:rgba(12,22,42,.6);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;font-size:20px;font-weight:800;line-height:1;display:grid;place-items:center}
.rside:active{transform:scale(.94)}
.reel-info{position:relative;z-index:2;padding:0 76px 28px 18px;display:flex;flex-direction:column;gap:9px}
.reel-who{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.reel-who i{font-style:normal;opacity:.55;font-weight:600}
.rav{width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:900;color:#06101f;
  background:linear-gradient(135deg,hsl(var(--h),85%,66%),hsl(calc(var(--h) + 40),90%,72%))}
.reel-cap{font-size:14.5px;line-height:1.5;letter-spacing:-.2px;color:rgba(255,255,255,.95);text-shadow:0 2px 12px rgba(0,0,0,.55);word-break:keep-all}
.rtime{font-size:11.5px;font-weight:600;opacity:.7}
.reel-yt .yt-thumb{filter:brightness(.9)}
.yt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;padding-left:4px;
  background:rgba(255,0,0,.92);color:#fff;font-size:23px;display:grid;place-items:center;box-shadow:0 12px 34px -10px rgba(0,0,0,.9);z-index:2}
.yt-play:active{transform:translate(-50%,-50%) scale(.94)}
.yt-frame{position:absolute;inset:0;z-index:3;background:#000}
.yt-frame iframe{width:100%;height:100%;border:0;display:block}
.reel-hud{position:absolute;top:10px;right:12px;z-index:4;display:flex;gap:8px}
.reel-add{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:24px;font-weight:800;line-height:1;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 24px -10px rgba(30,110,245,1)}
.reel-add:active{transform:scale(.94)}
.reel-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:13px;padding:30px;text-align:center;line-height:1.7}
.card-prev{height:152px;border-radius:14px;display:grid;place-items:center;padding:16px;text-align:center;white-space:pre-line;
  font-size:19px;font-weight:900;line-height:1.32;letter-spacing:-.5px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.45);overflow:hidden;word-break:keep-all}
.grad-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.gsw{height:40px;border-radius:11px;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.gsw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(55,198,255,.75)}
.reel-ta{width:100%;min-height:86px;background:#0a1428;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.5;color:var(--txt);resize:none;outline:none;transition:border-color .18s,box-shadow .18s}
.reel-ta:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,110,245,.18)}
.reel-ta::placeholder{color:var(--dim)}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;border:1.5px dashed rgba(55,198,255,.5);background:rgba(30,110,245,.09);border-radius:14px;padding:20px 14px;font-size:13.5px;font-weight:800;color:var(--cyan);text-align:center}
.upload:active{background:rgba(30,110,245,.18)}
.upload small{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:0}
.up-prev{margin-top:2px;border-radius:14px;overflow:hidden;position:relative;background:#08101f;border:1px solid var(--line)}
.up-prev img{width:100%;max-height:220px;object-fit:cover;display:block}
.up-meta{font-size:11.5px;color:var(--dim);padding:8px 11px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.yt-prev{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#08101f;aspect-ratio:16/9;position:relative}
.yt-prev img{width:100%;height:100%;object-fit:cover;display:block}
.yt-prev .yt-play{width:52px;height:52px;font-size:18px}
.seg.reel-seg{margin:0}
.seg.reel-seg .seg-b{font-size:12.5px;letter-spacing:-.2px;padding:9px 4px}

/* ---------- tabbar ---------- */
#tabs{flex:none;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(8,15,30,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);position:relative;z-index:7}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);position:relative;transition:.18s;padding:0 2px}
.tab .ti{font-size:19px;line-height:1;filter:grayscale(1) opacity(.6);transition:.18s}
.tab .tl{font-size:9.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;line-height:1.3}
.tab.active{color:var(--cyan)}
.tab.active .ti{filter:none;transform:translateY(-1px) scale(1.12)}
.tab.active::before{content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 2px 10px rgba(55,198,255,.9)}
.badge{position:absolute;top:7px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red)}
.badge.n{top:3px;right:calc(50% - 25px);width:auto;min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  font-size:10.5px;font-weight:900;font-style:normal;line-height:17px;text-align:center;color:#fff;letter-spacing:0;
  background:linear-gradient(180deg,#ff6b6b,var(--red));box-shadow:0 2px 8px rgba(255,90,90,.75);border:1.5px solid rgba(8,15,30,.95)}

/* ---------- 알림 토글 / 미니 배너 ---------- */
#btn-notify{width:29px;height:29px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:#101d36;border:1px solid var(--line);font-size:13px;line-height:1;transition:.16s;filter:grayscale(.7) opacity(.75)}
#btn-notify:active{transform:scale(.9)}
#btn-notify.on{background:linear-gradient(135deg,rgba(30,110,245,.5),rgba(55,198,255,.28));border-color:rgba(55,198,255,.7);
  filter:none;box-shadow:0 0 14px -3px rgba(55,198,255,.85)}
#noti-banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:min(calc(100% - 22px),496px);z-index:70;
  transform:translate(-50%,-160%);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,rgba(26,44,80,.99),rgba(13,23,46,.99));border:1px solid rgba(55,198,255,.38);
  box-shadow:0 20px 44px -16px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.2);
  transition:transform .28s cubic-bezier(.28,.9,.32,1),opacity .22s}
#noti-banner.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#noti-banner .nb-ico{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:16px;box-shadow:0 6px 16px -8px rgba(55,198,255,.9)}
#noti-banner .nb-body{flex:1;min-width:0}
#noti-banner .nb-nick{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:.2px}
#noti-banner .nb-text{font-size:13.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#noti-banner .nb-x{flex:none;color:var(--dim);font-size:13px;padding:4px 3px}

/* ---------- sheet & toast ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(2,5,12,.66);backdrop-filter:blur(3px);opacity:0;transition:.22s}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet{position:relative;width:100%;max-width:520px;max-height:82dvh;overflow-y:auto;background:linear-gradient(180deg,#0f1c34,#0a1428);
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;gap:12px}
.sheet-wrap.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h b{font-size:16px}
.sheet-h button{color:var(--dim);font-size:16px;padding:4px 6px}
.roomcode{font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;color:var(--cyan);padding:6px 0}
.inv{background:#0a1428;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--sub);word-break:break-all;line-height:1.5}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.sep{height:1px;background:var(--line);margin:4px 0}
.wide{width:100%}
.danger{width:100%;background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.35);color:#ff8a8a;border-radius:12px;padding:12px;font-size:14px;font-weight:700}
.mini{font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#0d1830;border-radius:999px;padding:8px 12px;font-size:12.5px;color:var(--sub);font-weight:600}
.chips button.on{border-color:var(--cyan);color:#fff;background:linear-gradient(135deg,rgba(30,110,245,.5),rgba(55,198,255,.28))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:rgba(20,34,62,.98);border:1px solid var(--line);
  color:var(--txt);font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:0 12px 30px -12px #000;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

<script>
(function(){
'use strict';
window.MERR=[];
window.addEventListener('error',function(e){window.MERR.push(String(e.message||e));});

/* ================= utils ================= */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function now(){return Date.now()}
function hhmm(ts){var d=new Date(ts||now());return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function todayMidnight(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function dayDiff(ds){var p=String(ds||'').split('-').map(Number);if(p.length!==3||isNaN(p[0]))return null;return Math.round((new Date(p[0],p[1]-1,p[2]).getTime()-todayMidnight())/86400000)}
function dLabel(n){return n===0?'D-DAY':(n>0?'D-'+n:'D+'+(-n))}
function hue(str){var h=0;str=String(str||'x');for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h}
function fmtDate(ds){var p=String(ds).split('-').map(Number);return p[1]+'월 '+p[2]+'일'}
function normRoom(v){
  var s=String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  s=s.replace(/[^A-Z0-9\-_]/g,'');
  if(!s)return '';
  if(s.indexOf('-')<0) s = (s.charAt(0)==='M') ? 'M-'+s.slice(1) : 'M-'+s;
  return s.slice(0,20);
}
function randRoom(){return 'M-'+Math.floor(1000+Math.random()*9000)}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}

var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var toastTimer=null;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2200);
}

/* ================= state ================= */
var S={
  cid:'',room:'',nick:'',tab:'chat',net:'off',
  peers:{},seenPeers:{},msgs:[],polls:{},ddays:{},scores:{react:[],speed:[]},game:'react',reels:{},reads:{}
};
var SEEN=new Set();
var MLOG=[];
function seenAdd(id){SEEN.add(id);if(SEEN.size>800){SEEN.clear();SEEN.add(id)}}

/* ================= 미니 MQTT (over WSS) ================= */
function varint(n){var b=[];do{var d=n&0x7f;n>>>=7;if(n>0)d|=0x80;b.push(d)}while(n>0);return b}
function enc(str){return new TextEncoder().encode(str)}

function MQTT(url,cid){
  this.url=url;this.cid=cid;this.ws=null;this.buf=new Uint8Array(0);
  this.conn=false;this.pid=1;this.onEvent=function(){};this.ping=null;
}
MQTT.frame=function(h,body){
  var lenb=varint(body.length),b=new Uint8Array(1+lenb.length+body.length),i=0;
  b[i++]=h;for(var k=0;k<lenb.length;k++)b[i++]=lenb[k];b.set(body,i);return b;
};
MQTT.prototype.connect=function(timeoutMs){
  var self=this;
  return new Promise(function(resolve,reject){
    var done=false;
    function ok(){if(!done){done=true;resolve()}}
    function bad(e){if(!done){done=true;reject(e||new Error('fail'))}}
    var ws;
    try{ws=new WebSocket(self.url,'mqtt')}catch(e){return bad(e)}
    self.ws=ws;ws.binaryType='arraybuffer';
    var timer=setTimeout(function(){try{ws.close()}catch(e){}bad(new Error('timeout'))},timeoutMs||8000);
    self._timer=timer;
    ws.onopen=function(){
      var cidB=enc(self.cid);
      var vh=[0,4,77,81,84,84,4,0x02,0,120]; /* MQTT v3.1.1, cleanSession, keepalive 120s */
      var body=new Uint8Array(vh.length+2+cidB.length),p=0;
      body.set(vh,0);p=vh.length;body[p++]=cidB.length>>8;body[p++]=cidB.length&255;body.set(cidB,p);
      ws.send(MQTT.frame(0x10,body));
    };
    ws.onmessage=function(ev){
      var chunk=new Uint8Array(ev.data);
      var nb=new Uint8Array(self.buf.length+chunk.length);
      nb.set(self.buf);nb.set(chunk,self.buf.length);self.buf=nb;
      while(self.buf.length>=2){
        var mult=1,len=0,i=1,complete=false;
        while(i<self.buf.length){
          var d=self.buf[i++];len+=(d&0x7f)*mult;
          if(!(d&0x80)){complete=true;break}
          mult*=128;if(mult>2097152)break;
        }
        if(!complete)break;
        var total=i+len;if(self.buf.length<total)break;
        var type=self.buf[0]>>4,flags=self.buf[0]&0x0f;
        var body=self.buf.subarray(i,total);
        self.buf=self.buf.subarray(total);
        self.handle(type,flags,body,ok,bad);
      }
    };
    ws.onerror=function(){clearTimeout(timer);bad(new Error('ws error'))};
    ws.onclose=function(e){
      clearTimeout(timer);self.conn=false;self.stopPing();
      self.onEvent({type:'close',code:e.code});
      bad(new Error('closed '+e.code));
    };
  });
};
MQTT.prototype.handle=function(type,flags,body,ok,bad){
  if(type===2){
    var rc=body[1];
    if(rc===0){clearTimeout(this._timer);this.conn=true;this.startPing();ok()}
    else{bad(new Error('connack '+rc));try{this.ws.close()}catch(e){}}
  }else if(type===3){
    var p=0,qos=(flags>>1)&3,tl=(body[0]<<8)|body[1];p=2;
    var topic=new TextDecoder().decode(body.subarray(p,p+tl));p+=tl;
    if(qos>0){
      var a=body[p],b2=body[p+1];p+=2;
      if(qos===1){try{this.ws.send(new Uint8Array([0x40,0x02,a,b2]))}catch(e){}}
    }
    var payload=new TextDecoder().decode(body.subarray(p));
    this.onEvent({type:'message',topic:topic,payload:payload});
  }
};
MQTT.prototype.subscribe=function(filter){
  if(!this.conn)return;
  var t=enc(filter),pid=(this.pid++)&0xffff;
  var body=new Uint8Array(2+2+t.length+1),p=0;
  body[p++]=pid>>8;body[p++]=pid&255;body[p++]=t.length>>8;body[p++]=t.length&255;
  body.set(t,p);body[p+t.length]=0;
  try{this.ws.send(MQTT.frame(0x82,body))}catch(e){}
};
MQTT.prototype.publish=function(topic,text,retain){
  if(!this.conn)return false;
  var t=enc(topic),pl=enc(text);
  var body=new Uint8Array(2+t.length+pl.length),p=0;
  body[p++]=t.length>>8;body[p++]=t.length&255;body.set(t,p);p+=t.length;body.set(pl,p);
  try{this.ws.send(MQTT.frame(0x30|(retain?1:0),body));return true}catch(e){return false}
};
MQTT.prototype.startPing=function(){
  var self=this;this.stopPing();
  this.ping=setInterval(function(){try{self.ws.send(new Uint8Array([0xc0,0x00]))}catch(e){}},40000);
};
MQTT.prototype.stopPing=function(){if(this.ping){clearInterval(this.ping);this.ping=null}};
MQTT.prototype.close=function(){clearTimeout(this._timer);this.stopPing();try{this.ws&&this.ws.close()}catch(e){}};

/* ================= 연결 관리 ================= */
var NET={
  servers:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'],
  idx:0,gen:0,client:null,online:false,tries:0,outbox:[],timer:null,
  start:function(){this.schedule(0)},
  stop:function(){this.gen++;clearTimeout(this.timer);if(this.client){try{this.client.close()}catch(e){}}this.client=null;this.online=false},
  schedule:function(ms){clearTimeout(this.timer);this.timer=setTimeout(this.connect.bind(this),ms)},
  connect:function(){
    var self=this,gen=++this.gen;
    var url=this.servers[this.idx%this.servers.length];
    setNet('connecting');
    var c=new MQTT(url,S.cid);this.client=c;
    c.onEvent=function(e){
      if(gen!==self.gen)return;
      if(e.type==='message')onPacket(e);
      else if(e.type==='close'){
        MLOG.push({t:now(),ev:'close',code:e.code,url:url});
        if(MLOG.length>40)MLOG.shift();
        self.online=false;self.schedule(1500);
      }
    };
    c.connect(8000).then(function(){
      if(gen!==self.gen){c.close();return}
      self.online=true;self.tries=0;setNet('online');
      c.subscribe(topicOf());
      flushOut();
      onNetUp();
    }).catch(function(){
      if(gen!==self.gen)return;
      self.online=false;self.idx++;self.tries++;
      setNet('off');
      self.schedule(Math.min(1200*Math.pow(1.5,self.tries),12000));
    });
  },
  publish:function(text,retain){
    if(this.online&&this.client&&this.client.publish(topicOf(),text,!!retain))return 'sent';
    this.outbox.push({text:text,retain:!!retain});
    if(this.outbox.length>60)this.outbox.shift();
    return 'queued';
  }
};
function flushOut(){
  while(NET.outbox.length&&NET.online){
    var m=NET.outbox.shift();
    if(!NET.client.publish(topicOf(),m.text,m.retain)){NET.outbox.unshift(m);break}
  }
}
function setNet(st){
  S.net=st;
  var dot=$('#hdr-dot');if(!dot)return;
  dot.className='dot '+(st==='online'?'':(st==='connecting'?'ing':'off'));
  dot.title=st==='online'?'실시간 연결됨':(st==='connecting'?'연결 중':'오프라인');
  var nb=$('#netbanner');
  if(nb) nb.hidden=(st==='online');
  if(nb) nb.firstChild.nodeValue = (st==='connecting'?'연결 중… 친구들과 연결하고 있어요 ':'오프라인 — 연결되면 메시지가 전송돼요 ');
}
function onNetUp(){
  presence();
  sendMsg({type:'state:req'});
  sendMsg({type:'reel:req'});
  if(S.msgs.length===0) addSys(S.room+' 방에 입장했어요');
  /* retained 내역을 받아 병합한 뒤, 내 로컬 내역까지 합친 상태를 다시 방에 남긴다 */
  setTimeout(function(){
    if(!S.room||S.net!=='online')return;
    if(S.msgs.length||Object.keys(S.reels||{}).length)publishState(true);
  },1600);
}

/* ================= 메시지 ================= */
function topicOf(){return 'm/v1/room/'+S.room}
function sendMsg(o){
  o.v=1;o.id=o.id||uid();o.cid=S.cid;o.nick=S.nick;o.ts=o.ts||now();
  seenAdd(o.id);
  var retain=!!o.__retain;delete o.__retain;
  var r=NET.publish(JSON.stringify(o),retain);
  if(r==='queued'&&o.type==='chat'){
    var mid=o.id;
    setTimeout(function(){
      for(var i=0;i<NET.outbox.length;i++){
        if(NET.outbox[i].text.indexOf(mid)>=0){toast('연결되면 바로 전송돼요');return}
      }
    },1600);
  }
  return r;
}
function onPacket(e){
  var o;
  try{o=JSON.parse(e.payload)}catch(err){return}
  if(!o||typeof o!=='object'||!o.type)return;
  if(o.id){if(SEEN.has(o.id))return;seenAdd(o.id)}
  if(o.cid===S.cid&&o.type!=='state')return;
  apply(o);
}
function apply(o){
  switch(o.type){
    case 'hi': peerHi(o); break;
    case 'chat':
      if(o.text)addMsg({id:o.id,cid:o.cid,nick:o.nick,text:String(o.text).slice(0,300),ts:o.ts||now()});
      break;
    case 'react': reactRecv(o); break;
    case 'poll:new': if(o.poll&&o.poll.id){mergePoll(o.poll);persist();renderVote();if(S.tab!=='vote')setBadge('vote',true)} break;
    case 'poll:vote': voteRecv(o.pid,o.cid,Number(o.opt)); break;
    case 'poll:del': if(o.pid&&S.polls[o.pid]){delete S.polls[o.pid];persist();renderVote()} break;
    case 'dday:new': if(o.dd&&o.dd.id){mergeDday(o.dd);persist();renderDday();if(S.tab!=='dday')setBadge('dday',true)} break;
    case 'dday:del': if(o.did&&S.ddays[o.did]){delete S.ddays[o.did];persist();renderDday()} break;
    case 'score': if(o.game&&typeof o.value==='number')mergeScore(o.game,{cid:o.cid,nick:o.nick,value:o.value,ts:o.ts||now()}); break;
    case 'state': if(o.data)mergeState(o.data); break;
    case 'state:req': publishState(false); break;
    case 'reel:req': shareReels(); break;
    case 'reel:new':
      if(o.reel&&o.reel.id){
        var rnew=mergeReel(o.reel);
        persist();renderReels();
        if(rnew&&S.tab!=='reels')setBadge('reels',true);
      }
      break;
    case 'reel:like': if(o.rid)reelLikeRecv(o.rid,o.cid,!!o.on,o.nick,o.old); break;
    case 'chat:read':
      if(o.cid&&o.cid!==S.cid){
        S.reads[o.cid]={nick:o.nick||'친구',at:Number(o.at)||0,readAt:Number(o.readAt)||now()};
        persist();applyReadsUI();
      }
      break;
  }
}

/* ================= 방 상태 ================= */
function mergePoll(p){
  if(!p||!p.id)return;
  var cur=S.polls[p.id];
  if(!cur){p.votes=p.votes||{};S.polls[p.id]=p;return}
  var k;
  if(p.votes)for(k in p.votes)if(cur.votes[k]===undefined)cur.votes[k]=p.votes[k];
  if((p.ts||0)>(cur.ts||0)){cur.q=p.q;cur.opts=p.opts;cur.ts=p.ts;cur.by=p.by;cur.byCid=p.byCid}
}
function mergeDday(d){
  if(!d||!d.id)return;
  var cur=S.ddays[d.id];
  if(!cur){S.ddays[d.id]=d;return}
  if((d.ts||0)>(cur.ts||0))S.ddays[d.id]=d;
}
function mergeScore(game,entry,silent){
  if(game!=='react'&&game!=='speed')return;
  var arr=S.scores[game]||(S.scores[game]=[]);
  var i=-1,k;
  for(k=0;k<arr.length;k++)if(arr[k].cid===entry.cid){i=k;break}
  if(i<0)arr.push(entry);
  else{
    var cur=arr[i];
    var better=game==='react'?entry.value<cur.value:entry.value>cur.value;
    if(better)arr[i]={cid:cur.cid,nick:entry.nick||cur.nick,value:entry.value,ts:entry.ts||cur.ts};
    else if(entry.nick)cur.nick=entry.nick;
  }
  if(!silent){persist();renderBoard()}
}
/* ---------- 이전 내역 병합 (로컬 + 서버 retained) ---------- */
function decodeReacts(rx){
  var out={},e,c,v;
  if(!rx||typeof rx!=='object')return out;
  for(e in rx){
    v=rx[e];out[e]={};
    if(Array.isArray(v)){for(c=0;c<v.length;c++)if(v[c])out[e][v[c]]=1}
    else if(v&&typeof v==='object'){for(c in v)if(v[c])out[e][c]=1}
  }
  return out;
}
function encodeReacts(rx){
  var out={},e,c,arr;
  if(!rx)return out;
  for(e in rx){
    arr=Object.keys(rx[e]||{});
    if(arr.length)out[e]=arr;
  }
  return out;
}
function mergeChats(incoming){
  if(!Array.isArray(incoming)||!incoming.length)return false;
  var known={},i,changed=false;
  for(i=0;i<S.msgs.length;i++)known[S.msgs[i].id]=S.msgs[i];
  incoming.forEach(function(m){
    if(!m||!m.id)return;
    var cur=known[m.id],rx=decodeReacts(m.reacts),e,c;
    if(cur){
      for(e in rx){
        cur.reacts=cur.reacts||{};cur.reacts[e]=cur.reacts[e]||{};
        for(c in rx[e])if(!cur.reacts[e][c]){cur.reacts[e][c]=1;changed=true}
      }
    }else{
      if(!m.text)return;
      var nm={id:m.id,cid:m.cid||'guest',nick:m.nick||'익명',text:String(m.text).slice(0,300),ts:m.ts||now(),reacts:rx};
      if(m.kind==='sys')nm.kind='sys';
      S.msgs.push(nm);known[m.id]=nm;changed=true;seenAdd(m.id);
    }
  });
  if(changed){
    S.msgs.sort(function(a,b){return (a.ts||0)-(b.ts||0)});
    if(S.msgs.length>200)S.msgs=S.msgs.slice(-160);
  }
  return changed;
}
function decodeReel(r){
  if(!r||!r.id)return null;
  var o={id:r.id,type:r.type||'text',cid:r.cid||'guest',nick:r.nick||'익명',ts:r.ts||0,likes:{}},k;
  if(r.text!==undefined)o.text=r.text;
  if(r.grad)o.grad=r.grad;
  if(r.yt)o.yt=r.yt;
  if(r.img)o.img=r.img;
  if(Array.isArray(r.likes)){for(k=0;k<r.likes.length;k++)if(r.likes[k])o.likes[r.likes[k]]=1}
  else if(r.likes&&typeof r.likes==='object'){for(k in r.likes)if(r.likes[k])o.likes[k]=(typeof r.likes[k]==='string'?r.likes[k]:1)}
  return o;
}
function mergeReads(d){
  if(!d||typeof d!=='object')return false;
  var k,r,cur,ch=false;
  for(k in d){
    if(k===S.cid)continue;
    r=d[k];if(!r||typeof r!=='object')continue;
    cur=S.reads[k];
    if(!cur){S.reads[k]={nick:r.nick||'친구',at:Number(r.at)||0,readAt:Number(r.readAt)||0};ch=true;continue}
    if((Number(r.at)||0)>(cur.at||0)){cur.at=Number(r.at)||0;ch=true}
    if((Number(r.readAt)||0)>(cur.readAt||0))cur.readAt=Number(r.readAt)||0;
    if(r.nick&&r.nick!==cur.nick)cur.nick=r.nick;
  }
  return ch;
}
function readsOut(){
  var out={},k,r;
  for(k in S.reads){
    if(k===S.cid)continue;
    r=S.reads[k];if(!r)continue;
    out[k]={nick:r.nick||'친구',at:r.at||0,readAt:r.readAt||0};
  }
  return out;
}
function mergeState(d){
  if(!d)return;
  var chatsChanged=false,reelsChanged=false,r;
  if(Array.isArray(d.polls))d.polls.forEach(mergePoll);
  if(Array.isArray(d.ddays))d.ddays.forEach(mergeDday);
  if(d.scores){
    (d.scores.react||[]).forEach(function(e){mergeScore('react',e,true)});
    (d.scores.speed||[]).forEach(function(e){mergeScore('speed',e,true)});
  }
  if(Array.isArray(d.chats))chatsChanged=mergeChats(d.chats);
  var readsChanged=mergeReads(d.reads);
  if(Array.isArray(d.reels))d.reels.forEach(function(raw){
    r=decodeReel(raw);if(!r)return;
    if(mergeReel(r))reelsChanged=true;
  });
  persist();renderVote();renderDday();renderBoard();
  if(readsChanged)applyReadsUI();
  if(chatsChanged){renderChat();if(S.tab==='chat'&&document.visibilityState!=='hidden'){scrollChat();markRead()}}
  if(reelsChanged)renderReels();
}
var stateTimer=null;
function stateBytes(o){try{return new TextEncoder().encode(JSON.stringify(o)).length}catch(e){try{return JSON.stringify(o).length}catch(e2){return 0}}}
function buildState(){
  var polls=Object.keys(S.polls).map(function(k){return S.polls[k]}).sort(function(a,b){return b.ts-a.ts}).slice(0,15);
  var ddays=Object.keys(S.ddays).map(function(k){return S.ddays[k]}).slice(0,30);
  var chats=S.msgs.filter(function(m){return m.kind!=='sys'&&m.text}).slice(-40).map(function(m){
    var o={id:m.id,cid:m.cid,nick:m.nick,text:m.text,ts:m.ts};
    var rx=encodeReacts(m.reacts);
    if(Object.keys(rx).length)o.reacts=rx;
    return o;
  });
  var reels=reelList().filter(function(r){return !r.demo}).slice(0,10).map(function(r){
    var o={id:r.id,type:r.type,cid:r.cid,nick:r.nick,ts:r.ts,likes:reelLikesOut(r)};
    if(r.text!==undefined&&r.text!=='')o.text=r.text;
    if(r.grad)o.grad=r.grad;
    if(r.yt)o.yt=r.yt;
    if(r.img)o.img=r.img;
    return o;
  });
  return {polls:polls,ddays:ddays,scores:{react:(S.scores.react||[]).slice(0,10),speed:(S.scores.speed||[]).slice(0,10)},chats:chats,reels:reels,reads:readsOut()};
}
function capState(data){
  var MAX=350000,size=stateBytes(data),i,idx,sz,guard=0;
  if(size<=MAX)return data;
  /* 1) 가장 오래된 사진 릴스부터 제거 */
  while(size>MAX&&data.reels.length&&guard++<40){
    idx=-1;
    for(i=data.reels.length-1;i>=0;i--){if(data.reels[i].img){idx=i;break}}
    if(idx<0)break;
    sz=stateBytes(data.reels[idx]);
    data.reels.splice(idx,1);size-=sz+1;
  }
  /* 2) 그다음 오래된 릴스 제거 */
  while(size>MAX&&data.reels.length&&guard++<80){
    sz=stateBytes(data.reels[data.reels.length-1]);
    data.reels.pop();size-=sz+1;
  }
  /* 3) 그래도 크면 오래된 채팅부터 줄이기 */
  while(size>MAX&&data.chats.length>6&&guard++<120){
    var n=Math.max(1,Math.floor(data.chats.length/3));
    data.chats.slice(0,n).forEach(function(m){size-=stateBytes(m)+1});
    data.chats=data.chats.slice(n);
  }
  guard=0;
  while(stateBytes(data)>MAX&&data.reels.length&&guard++<30)data.reels.pop();
  return data;
}
function publishState(retain){
  clearTimeout(stateTimer);
  stateTimer=setTimeout(function(){
    var data=capState(buildState());
    sendMsg({type:'state',data:data,__retain:!!retain});
  },retain?140:60);
}
function persist(){
  if(!S.room)return;
  var keep={},arr=[],k;
  for(k in S.reels)arr.push(S.reels[k]);
  arr.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  arr.slice(0,16).forEach(function(r){keep[r.id]=r});
  LS.set('M.room.'+S.room,{msgs:S.msgs.slice(-100),polls:S.polls,ddays:S.ddays,scores:S.scores,reels:keep,reads:S.reads});
}
function loadRoom(){
  var d=LS.get('M.room.'+S.room,null)||{};
  S.msgs=Array.isArray(d.msgs)?d.msgs:[];
  S.polls=(d.polls&&typeof d.polls==='object')?d.polls:{};
  S.ddays=(d.ddays&&typeof d.ddays==='object')?d.ddays:{};
  S.scores={react:(d.scores&&d.scores.react)||[],speed:(d.scores&&d.scores.speed)||[]};
  S.reels=(d.reels&&typeof d.reels==='object')?d.reels:{};
  S.reads=(d.reads&&typeof d.reads==='object')?d.reads:{};
  if(!Object.keys(S.reels).length)seedReels();
}

/* ================= 참여자 ================= */
function presence(){sendMsg({type:'hi'})}
function peerHi(o){
  if(!o.cid||o.cid===S.cid)return;
  var first=!S.peers[o.cid];
  var lastSeen=S.seenPeers[o.cid]||0;
  S.peers[o.cid]={nick:o.nick||'친구',ts:now()};
  S.seenPeers[o.cid]=now();
  if(first&&o.nick&&now()-lastSeen>600000)addSys(o.nick+' 님이 들어왔어요');
  renderPeople();
}
function prunePeers(){
  var t=now(),changed=false,k;
  for(k in S.peers){if(t-S.peers[k].ts>65000){delete S.peers[k];changed=true}}
  if(changed)renderPeople();
}
function renderPeople(){
  var n=1+Object.keys(S.peers).length;
  var el=$('#hdr-people');if(el)el.textContent='👥 '+n;
}

/* ================= 채팅 ================= */
function addMsg(m){
  S.msgs.push(m);
  if(S.msgs.length>120)S.msgs=S.msgs.slice(-100);
  persist();
  if(S.tab==='chat'||location.hash==='#chat'){renderChat();scrollChat()}
  else{renderChat()}
  if(m.cid!==S.cid&&m.kind!=='sys'){
    notiChat(m);
    markRead();
  }
}
function addSys(text){addMsg({id:uid(),cid:'sys',kind:'sys',text:text,ts:now()})}
function scrollChat(){
  var sc=$('#scroller');if(!sc)return;
  requestAnimationFrame(function(){sc.scrollTop=sc.scrollHeight+400});
}
function renderChat(){
  var list=$('#chat-list');if(!list)return;
  if(!S.msgs.length){
    list.innerHTML='<div class="empty"><div class="empty-ico">💬</div>아직 대화가 없어요.<br>먼저 말을 걸어보세요!</div>';
    return;
  }
  var lastMine=lastOwnMsg(),lastMineId=lastMine?lastMine.id:'';
  list.innerHTML=S.msgs.map(function(m){
    if(m.kind==='sys')return '<div class="sys"><span>'+esc(m.text)+'</span></div>';
    var mine=m.cid===S.cid;
    var rx='';
    if(m.reacts){
      rx=Object.keys(m.reacts).filter(function(e){return Object.keys(m.reacts[e]).length}).map(function(e){
        return '<span class="rxc">'+e+' '+Object.keys(m.reacts[e]).length+'</span>';
      }).join('');
    }
    var body='<div class="row '+(mine?'me':'you')+'" data-mid="'+esc(m.id)+'">';
    if(!mine)body+='<div class="av" style="--h:'+hue(m.nick||'x')+'">'+esc((m.nick||'?').charAt(0))+'</div>';
    body+='<div class="bwrap">';
    if(!mine)body+='<div class="nick">'+esc(m.nick||'익명')+'</div>';
    body+='<div class="bubble '+(mine?'mb':'ob')+'">'+linkify(esc(m.text))+'</div>';
    body+='<div class="meta">'+hhmm(m.ts)+'</div>';
    if(rx)body+='<div class="rx">'+rx+'</div>';
    body+='<div class="rxbar">'+['👍','🔥','😂','❤️','🎉'].map(function(e){
      return '<button data-rx="'+e+'" data-mid="'+esc(m.id)+'">'+e+'</button>';
    }).join('')+'</div>';
    body+='</div></div>';
    if(m.id===lastMineId)body+=readBarHTML(m);
    return body;
  }).join('');
}

/* ---------- 읽음 표시 ---------- */
var READ={at:0,ts:0};
function readLabelText(readAt){return (now()-(readAt||0))<60000?'방금 읽음':'읽음'}
function lastOwnMsg(){
  for(var i=S.msgs.length-1;i>=0;i--){
    var m=S.msgs[i];
    if(m&&m.cid===S.cid&&m.kind!=='sys')return m;
  }
  return null;
}
function readersOf(m){
  var arr=[],k,r;
  if(!m)return arr;
  for(k in S.reads){
    if(k===S.cid)continue;
    r=S.reads[k];if(!r)continue;
    if((r.at||0)>=(m.ts||0))arr.push({cid:k,nick:r.nick||'친구',readAt:r.readAt||0});
  }
  arr.sort(function(a,b){return (b.readAt||0)-(a.readAt||0)});
  return arr;
}
function readBarHTML(m){
  var arr=readersOf(m);if(!arr.length)return '';
  var show=arr.slice(0,3).map(function(p){
    return '<i class="rmin" style="--h:'+hue(p.nick||'x')+'" title="'+esc(p.nick||'')+'">'+esc((p.nick||'?').charAt(0))+'</i>';
  }).join('');
  if(arr.length>3)show+='<i class="rmin more">+'+(arr.length-3)+'</i>';
  var latest=arr[0].readAt||0;
  return '<div class="readbar"><span class="ravs">'+show+'</span><span class="rlabel" id="read-label" data-at="'+latest+'">'+readLabelText(latest)+'</span></div>';
}
function applyReadsUI(){
  var list=$('#chat-list');if(!list||S.tab!=='chat')return;
  var old=list.querySelector('.readbar'),lastMine=lastOwnMsg(),html=lastMine?readBarHTML(lastMine):'';
  if(old){
    if(!html){old.remove();return}
    var box=document.createElement('div');box.innerHTML=html;
    old.parentNode.replaceChild(box.firstChild,old);
    return;
  }
  if(html)renderChat();
}
function refreshReadLabels(){
  var el=$('#read-label');if(!el)return;
  var txt=readLabelText(Number(el.getAttribute('data-at'))||0);
  if(el.textContent!==txt)el.textContent=txt;
}
function markRead(){
  if(!S.room||S.tab!=='chat')return;
  if(document.visibilityState==='hidden')return;
  var last=0,i,m;
  for(i=0;i<S.msgs.length;i++){
    m=S.msgs[i];
    if(m.cid!==S.cid&&m.cid!=='sys'&&(m.ts||0)>last)last=m.ts;
  }
  if(!last)return;
  var t=now();
  if(READ.at===last&&t-READ.ts<20000)return;
  READ.at=last;READ.ts=t;
  sendMsg({type:'chat:read',at:last,readAt:t});
}
function sendChat(){
  var inp=$('#in-msg'),text=inp.value.replace(/\s+$/,'');
  if(!text)return;
  inp.value='';
  var m={id:uid(),cid:S.cid,nick:S.nick,type:'chat',text:text.slice(0,300),ts:now()};
  seenAdd(m.id);
  addMsg({id:m.id,cid:m.cid,nick:m.nick,text:m.text,ts:m.ts});
  sendMsg(m);
  publishState(true);
}
function doReact(mid,emoji){
  var m=null,k;
  for(k=0;k<S.msgs.length;k++)if(S.msgs[k].id===mid){m=S.msgs[k];break}
  if(!m)return;
  m.reacts=m.reacts||{};
  m.reacts[emoji]=m.reacts[emoji]||{};
  var on=!!m.reacts[emoji][S.cid];
  if(on)delete m.reacts[emoji][S.cid];else m.reacts[emoji][S.cid]=1;
  sendMsg({type:'react',mid:mid,emoji:emoji,off:on});
  persist();renderChat();publishState(true);
}
function reactRecv(o){
  if(!o.mid||!o.emoji)return;
  var m=null,k;
  for(k=0;k<S.msgs.length;k++)if(S.msgs[k].id===o.mid){m=S.msgs[k];break}
  if(!m)return;
  m.reacts=m.reacts||{};
  m.reacts[o.emoji]=m.reacts[o.emoji]||{};
  if(o.off)delete m.reacts[o.emoji][o.cid];else m.reacts[o.emoji][o.cid]=1;
  persist();renderChat();
}

var NOTI={on:false,audio:null,bannerT:null,hideT:null,unread:0};
function notiInit(){
  NOTI.on=!!LS.get('M.notify',false);
  notiPaint();
  setUnread(NOTI.unread);
}
function notiPaint(){
  var b=$('#btn-notify');if(!b)return;
  b.textContent=NOTI.on?'🔔':'🔕';
  b.classList.toggle('on',NOTI.on);
  b.setAttribute('aria-label',NOTI.on?'새 메시지 알림 켜짐':'새 메시지 알림 꺼짐');
  var t=NOTI.on?'새 메시지 알림 켜짐':'새 메시지 알림 꺼짐';
  if(NOTI.on){
    if(typeof Notification==='undefined'||!Notification) t+=' · 앱 안 알림만 (이 브라우저는 상단 알림 미지원)';
    else if(Notification.permission==='granted') t+=' · 휴대폰/브라우저 알림도 켜짐';
    else if(Notification.permission==='denied') t+=' · 브라우저에서 상단 알림이 차단돼 있어요';
    else t+=' · 알림 권한을 허용하면 상단 알림도 떠요';
  }
  b.title=t;
}
function notiToggle(){
  NOTI.on=!NOTI.on;
  LS.set('M.notify',NOTI.on);
  notiAskPermission();
  notiPaint();
  if(NOTI.on){
    notiUnlockAudio();
    setTimeout(function(){notiBeep();notiVibrate()},40);
    toast('새 메시지 알림을 켰어요');
  }else{
    notiHideBanner();
    toast('새 메시지 알림을 껐어요');
  }
}
function notiAskPermission(){
  try{
    if(typeof Notification==='undefined'||!Notification||!Notification.requestPermission)return;
    if(Notification.permission!=='default')return;
    var p=Notification.requestPermission(function(){notiPaint()});
    if(p&&p.then)p.then(function(){notiPaint()}).catch(function(){});
  }catch(e){}
}
function notiUnlockAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!NOTI.audio)NOTI.audio=new AC();
    if(NOTI.audio.state==='suspended')NOTI.audio.resume();
  }catch(e){}
}
/* 가벼운 2음 알림음 (Web Audio, 파일 없이) */
function notiBeep(){
  var ac=NOTI.audio;if(!ac)return;
  try{
    if(ac.state==='suspended')ac.resume();
    var t0=ac.currentTime+0.01;
    [[880,0],[1320,0.11]].forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.14,t0+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+0.18);
      o.connect(g);g.connect(ac.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+0.2);
    });
  }catch(e){}
}
function notiVibrate(){
  if(!navigator.vibrate)return;
  try{navigator.vibrate([120,60,120])}catch(e){}
}
function notiPush(m){
  try{
    if(typeof Notification==='undefined'||!Notification)return;
    if(Notification.permission!=='granted')return;
    var n=new Notification('M · '+(m.nick||'친구'),{
      body:String(m.text||'').slice(0,140),
      icon:APP_ICON,
      tag:'m-chat-'+S.room,
      renotify:true
    });
    n.onclick=function(){try{window.focus()}catch(e){};openChatTab();notiHideBanner();try{n.close()}catch(e2){}};
  }catch(e){}
}
function setUnread(n){
  NOTI.unread=Math.max(0,n|0);
  var el=$('#bad-chat');if(!el)return;
  if(NOTI.unread>0){
    el.textContent=NOTI.unread>9?'9+':String(NOTI.unread);
    el.classList.add('n');el.hidden=false;
  }else{
    el.textContent='';el.classList.remove('n');el.hidden=true;
  }
}
function notiShowBanner(m){
  var el=$('#noti-banner');if(!el)return;
  var nick=$('#nb-nick'),txt=$('#nb-text');
  if(nick)nick.textContent=m.nick||'친구';
  if(txt)txt.textContent=String(m.text||'');
  clearTimeout(NOTI.bannerT);clearTimeout(NOTI.hideT);
  el.hidden=false;
  requestAnimationFrame(function(){el.classList.add('on')});
  NOTI.bannerT=setTimeout(notiHideBanner,3500);
}
function notiHideBanner(){
  var el=$('#noti-banner');if(!el)return;
  clearTimeout(NOTI.bannerT);
  el.classList.remove('on');
  clearTimeout(NOTI.hideT);
  NOTI.hideT=setTimeout(function(){el.hidden=true},300);
}
function openChatTab(){
  setTab('chat');
  setUnread(0);
  notiHideBanner();
}
/* 상대 새 메시지 도착 시: 다른 탭을 보거나 앱이 가려져 있을 때만 알린다 */
function notiChat(m){
  if(!m||m.cid===S.cid||m.kind==='sys')return;
  var hidden=(document.visibilityState==='hidden')||!!document.hidden;
  var otherTab=(S.tab!=='chat');
  if(!hidden&&!otherTab)return;
  if(otherTab)setUnread(NOTI.unread+1);
  if(NOTI.on){
    notiBeep();notiVibrate();notiPush(m);
  }
  if(otherTab)notiShowBanner(m);
}

/* ================= 투표 ================= */
function myVote(pid){
  var p=S.polls[pid];
  if(p&&p.votes&&p.votes[S.cid]!==undefined)return Number(p.votes[S.cid]);
  var v=LS.get('M.vote.'+pid+'.'+S.cid,null);
  return (v===null||v===undefined)?null:Number(v);
}
function voteRecv(pid,cid,opt){
  var p=S.polls[pid];if(!p)return;
  p.votes=p.votes||{};
  if(p.votes[cid]!==undefined)return;
  p.votes[cid]=opt;
  persist();
  if(S.tab==='vote')renderVote();
}
function vote(pid,opt){
  var p=S.polls[pid];if(!p)return;
  if(myVote(pid)!==null){toast('이미 투표했어요');return}
  p.votes=p.votes||{};
  p.votes[S.cid]=opt;
  LS.set('M.vote.'+pid+'.'+S.cid,opt);
  sendMsg({type:'poll:vote',pid:pid,opt:opt});
  publishState(true);
  renderVote();
  toast('투표 완료!');
}
function renderVote(){
  var list=$('#poll-list');if(!list)return;
  var polls=Object.keys(S.polls).map(function(k){return S.polls[k]}).sort(function(a,b){return b.ts-a.ts});
  $('#poll-empty').hidden=polls.length>0;
  list.innerHTML=polls.map(function(p){
    var votes=p.votes||{},total=Object.keys(votes).length,mine=myVote(p.id);
    var opts=(p.opts||[]).map(function(label,i){
      var c=0,k;for(k in votes)if(votes[k]===i)c++;
      var pct=total?Math.round(c*100/total):0;
      return '<button class="opt '+(mine===i?'sel':'')+'" data-vote="'+esc(p.id)+'" data-opt="'+i+'">'+
        '<i class="fill" style="width:'+pct+'%"></i>'+
        '<span class="ol">'+esc(label)+'</span><span class="oc">'+pct+'%</span></button>';
    }).join('');
    return '<div class="card poll"><div class="poll-h"><div class="q">'+esc(p.q)+'</div>'+
      (p.byCid===S.cid?'<button class="del" data-del-poll="'+esc(p.id)+'">✕</button>':'')+'</div>'+
      '<div class="opts">'+opts+'</div>'+
      '<div class="poll-f">'+(mine!==null?'✓ 내 투표 완료':(total?'눌러서 투표하기':'첫 표를 던져보세요'))+' · 총 '+total+'표 · '+esc(p.by||'익명')+'</div></div>';
  }).join('');
}
function openPollSheet(){
  openSheet('새 투표',
    '<label class="field"><span>질문</span><input id="p-q" maxlength="80" placeholder="예: 오늘 뭐 먹지?"></label>'+
    '<label class="field"><span>선택지 (2개 이상)</span><input id="p-o0" maxlength="40" placeholder="선택지 1"></label>'+
    '<input id="p-o1" class="mini" maxlength="40" placeholder="선택지 2">'+
    '<input id="p-o2" class="mini" maxlength="40" placeholder="선택지 3 (선택)">'+
    '<input id="p-o3" class="mini" maxlength="40" placeholder="선택지 4 (선택)">'+
    '<button class="primary" id="p-save">투표 만들기</button>');
  setTimeout(function(){var el=$('#p-q');if(el)el.focus()},120);
  $('#p-save').onclick=function(){
    var q=($('#p-q').value||'').trim();
    var opts=[0,1,2,3].map(function(i){return ($('#p-o'+i).value||'').trim()}).filter(Boolean);
    if(!q){toast('질문을 입력해 주세요');return}
    if(opts.length<2){toast('선택지를 2개 이상 입력해 주세요');return}
    var poll={id:uid(),q:q.slice(0,80),opts:opts.slice(0,4),by:S.nick,byCid:S.cid,ts:now(),votes:{}};
    S.polls[poll.id]=poll;
    persist();renderVote();
    sendMsg({type:'poll:new',poll:poll});
    publishState(true);
    closeSheet();toast('투표를 만들었어요');
    setTab('vote');
  };
}

/* ================= D-DAY ================= */
function renderDday(){
  var list=$('#dday-list');if(!list)return;
  var items=Object.keys(S.ddays).map(function(k){
    var d=S.ddays[k];return {id:d.id,title:d.title,date:d.date,emoji:d.emoji||'📌',by:d.by,byCid:d.byCid,ts:d.ts,n:dayDiff(d.date)};
  }).filter(function(d){return d.n!==null}).sort(function(a,b){
    if(a.n>=0&&b.n<0)return -1;
    if(a.n<0&&b.n>=0)return 1;
    return a.n-b.n;
  });
  $('#dday-empty').hidden=items.length>0;
  list.innerHTML=items.map(function(d){
    var cls=d.n===0?'today':(d.n>0&&d.n<=7?'soon':(d.n<0?'past':''));
    return '<div class="dcard '+cls+'"><div class="dico">'+esc(d.emoji)+'</div>'+
      '<div class="dinfo"><div class="dtitle">'+esc(d.title)+'</div>'+
      '<div class="ddate">'+esc(fmtDate(d.date))+' · '+esc(d.by||'익명')+'</div></div>'+
      '<div class="dnum">'+dLabel(d.n)+'</div>'+
      (d.byCid===S.cid?'<button class="del" data-del-dday="'+esc(d.id)+'">✕</button>':'')+'</div>';
  }).join('');

function reelLikesOut(r){

function likeCount(r){

function compressPhoto(file,cb){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var max=640,w=img.width,h=img.height;
    var sc=Math.min(1,max/Math.max(w,h));
    w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
    var c=document.createElement('canvas'),q=0.72,data='',guard=0,ctx;
    function draw(){
      c.width=w;c.height=h;ctx=c.getContext('2d');
      ctx.fillStyle='#0b1020';ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
    }
    draw();
    data=c.toDataURL('image/jpeg',q);
    while(data.length>52000&&guard++<14){
      if(q>0.42){q=Math.max(0.38,q-0.09)}
      else{w=Math.max(80,Math.round(w*0.82));h=Math.max(80,Math.round(h*0.82));}
      draw();
      data=c.toDataURL('image/jpeg',q);
    }
    try{URL.revokeObjectURL(url)}catch(e){}
    cb(null,data,w,h);
  };
  img.onerror=function(){try{URL.revokeObjectURL(url)}catch(e){}cb(new Error('load'))};
  img.src=url;
}

    Array.prototype.forEach.call($('#rseg').querySelectorAll('[data-rmode]'),function(x){x.classList.toggle('active',x===b)});
    renderReelForm();
  };
}
function renderReelForm(){
  var box=$('#reel-form');if(!box)return;
  var html='';
  if(RD.mode==='text'){
    html='<div class="card-prev" id="rprev" style="background:'+(REEL_GRAD_CSS[RD.grad]||REEL_GRAD_CSS.violet)+'">'+esc(RD.text||'미리보기')+'</div>'+
      '<label class="field"><span>문구 (최대 120자)</span><textarea id="rt" class="reel-ta" maxlength="120" placeholder="오늘의 한 줄, 친구들에게 보여주고 싶은 말">'+esc(RD.text)+'</textarea></label>'+
      '<div class="field"><span>배경</span><div class="grad-grid" id="rg">'+
        REEL_GRADS.map(function(g){return '<button class="gsw'+(RD.grad===g?' on':'')+'" data-g="'+g+'" style="background:'+REEL_GRAD_CSS[g]+'" aria-label="'+g+'"></button>'}).join('')+
      '</div></div>'+
      '<button class="primary" id="r-post">릴스 올리기</button>';
  }else if(RD.mode==='photo'){
    html='<button class="upload" id="rpick">🖼️ 사진 선택<small>자동으로 수십 KB로 가볍게 압축돼요</small></button>'+
      '<input type="file" id="rfile" accept="image/*" hidden>'+
      '<div id="rpprev">'+(RD.photo?'<div class="up-prev"><img src="'+RD.photo+'" alt=""><div class="up-meta"><span>압축 완료</span><span>약 '+Math.round(RD.photo.length*0.75/1024)+'KB · 전송 가능</span></div></div>':'')+'</div>'+
      '<label class="field"><span>한 줄 설명 (선택)</span><input id="rt2" class="mini" maxlength="80" value="'+esc(RD.cap)+'" placeholder="사진에 붙일 짧은 글"></label>'+
      '<button class="primary" id="r-post">릴스 올리기</button>';
  }else{
    var yid=RD.ytId||'';
    html='<label class="field"><span>유튜브 / 쇼츠 링크</span><input id="ryt" class="mini" inputmode="url" autocapitalize="none" spellcheck="false" value="'+esc(RD.ytRaw||'')+'" placeholder="https://youtu.be/..."></label>'+
      '<div id="rytprev">'+(yid?'<div class="yt-prev"><img src="https://i.ytimg.com/vi/'+esc(yid)+'/hqdefault.jpg" alt=""><span class="yt-play">▶</span></div>':'')+'</div>'+
      '<label class="field"><span>한 줄 설명 (선택)</span><input id="rt2" class="mini" maxlength="80" value="'+esc(RD.cap)+'" placeholder="영상 소개"></label>'+
      '<button class="primary" id="r-post">릴스 올리기</button>';
  }
  box.innerHTML=html;
  var post=$('#r-post');if(post)post.onclick=postReel;
  if(RD.mode==='text'){
    var ta=$('#rt');
    if(ta)ta.oninput=function(){
      RD.text=ta.value;
      var pv=$('#rprev');if(pv)pv.textContent=ta.value||'미리보기';
    };
    Array.prototype.forEach.call(document.querySelectorAll('#rg [data-g]'),function(b){
      b.onclick=function(){
        RD.grad=b.getAttribute('data-g');
        Array.prototype.forEach.call(document.querySelectorAll('#rg [data-g]'),function(x){x.classList.toggle('on',x===b)});
        var pv=$('#rprev');if(pv)pv.style.background=REEL_GRAD_CSS[RD.grad];
      };
    });
    setTimeout(function(){if(ta)ta.focus()},140);
  }else if(RD.mode==='photo'){
    $('#rpick').onclick=function(){$('#rfile').click()};
    $('#rfile').onchange=function(){
      var f=this.files&&this.files[0];if(!f)return;
      var pv=$('#rpprev');
      if(pv)pv.innerHTML='<div class="up-meta" style="justify-content:center;padding:14px">사진을 가볍게 만드는 중…</div>';
      compressPhoto(f,function(err,data,w,h){
        if(err){toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요');if(pv)pv.innerHTML='';return}
        RD.photo=data;
        var kb=Math.round(data.length*0.75/1024);
        if(pv)pv.innerHTML='<div class="up-prev"><img src="'+data+'" alt=""><div class="up-meta"><span>'+w+'×'+h+'</span><span>약 '+kb+'KB · 전송 가능</span></div></div>';
      });
    };
  }else{
    var y=$('#ryt');
    if(y)y.oninput=function(){
      RD.ytRaw=y.value;
      RD.ytId=ytId(y.value);
      var pv=$('#rytprev');if(!pv)return;
      pv.innerHTML=RD.ytId?('<div class="yt-prev"><img src="https://i.ytimg.com/vi/'+esc(RD.ytId)+'/hqdefault.jpg" alt=""><span class="yt-play">▶</span></div>'):'';
    };
  }
}
function postReel(){
  var r={id:uid(),type:RD.mode,nick:S.nick,cid:S.cid,ts:now(),likes:{}};
  if(RD.mode==='text'){
    var t=(($('#rt')&&$('#rt').value)||RD.text||'').trim();
    if(!t){toast('문구를 입력해 주세요');return}
    r.text=t.slice(0,120);r.grad=RD.grad||'violet';
  }else if(RD.mode==='photo'){
    if(!RD.photo){toast('사진을 골라 주세요');return}
    r.img=RD.photo;
    r.text=(($('#rt2')&&$('#rt2').value)||'').trim().slice(0,80);
  }else{
    var id=ytId(($('#ryt')&&$('#ryt').value)||'');
    if(!id){toast('유튜브 링크를 확인해 주세요');return}
    r.yt=id;
    r.text=(($('#rt2')&&$('#rt2').value)||'').trim().slice(0,80);
  }
  if(JSON.stringify({type:'reel:new',reel:r}).length>120000){toast('사진 용량이 너무 커요. 다른 사진으로 시도해 주세요');return}
  S.reels[r.id]=r;
  persist();
  closeSheet();
  setTab('reels');
  renderReels();
  requestAnimationFrame(function(){var f=$('#reel-feed');if(f)f.scrollTop=0});
  sendMsg({type:'reel:new',reel:r});
  publishState(true);
  toast('릴스를 올렸어요');
}

/* ================= 탭 / 배지 ================= */
function setBadge(tab,on){
  var el=$('#bad-'+tab);if(el)el.hidden=!on;
}
function setTab(t){
  if(S.tab==='game'&&t!=='game')stopGames();
  S.tab=t;
  var sc=$('#scroller');if(sc)sc.classList.toggle('reel-mode',t==='reels');
  var rv=$('#view-reels');if(rv)rv.hidden=(t!=='reels');
  $$('.view').forEach(function(v){v.hidden=v.id!=='view-'+t});
  $$('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t)});
  var comp=$('#composer');if(comp)comp.hidden=(t!=='chat');
  if(t==='chat'){setBadge('chat',false);setUnread(0);notiHideBanner();renderChat();scrollChat();markRead()}
  if(t==='reels'){setBadge('reels',false);renderReels()}
  if(t==='vote'){setBadge('vote',false);renderVote()}
  if(t==='dday'){setBadge('dday',false);renderDday()}
  if(t==='game')renderStage();
  if(sc)sc.scrollTop=0;
}

/* ================= 시트 ================= */
function openSheet(title,html){
  $('#sheet-title').textContent=title;
  $('#sheet-body').innerHTML=html;
  var s=$('#sheet');s.hidden=false;
  requestAnimationFrame(function(){s.classList.add('on')});
}
function closeSheet(){
  var s=$('#sheet');s.classList.remove('on');
  setTimeout(function(){s.hidden=true},240);
}

/* ================= 초대 ================= */
function inviteUrl(){
  var base=location.origin+location.pathname;
  return base+'?room='+encodeURIComponent(S.room);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){return true}).catch(function(){return legacyCopy(t)});
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);return ok;
  }catch(e){return false}
}
function copyInvite(){
  var txt='M에서 같이 놀자! 🎉\n방 코드: '+S.room+'\n'+inviteUrl();
  copyText(txt).then(function(ok){
    toast(ok?'초대 링크를 복사했어요':'복사가 안 되면 링크를 길게 눌러 복사해 주세요');
  });
}
function shareInvite(){
  var txt='M에서 같이 놀자! 방 코드 '+S.room;
  if(navigator.share){
    navigator.share({title:'M',text:txt,url:inviteUrl()}).catch(function(){});
  }else{
    copyInvite();
  }
}
function openRoomSheet(){
  openSheet('방 설정',
    '<div class="roomcode">'+esc(S.room)+'</div>'+
    '<div class="inv" id="r-url">'+esc(inviteUrl())+'</div>'+
    '<button class="primary" id="r-copy">초대 링크 복사</button>'+
    '<div class="row2"><button class="ghost" id="r-share">공유하기</button><button class="ghost" id="r-new">새 방 만들기</button></div>'+
    '<div class="sep"></div>'+
    '<label class="field"><span>다른 방 코드로 이동</span><input id="r-in" maxlength="12" placeholder="M-0000"></label>'+
    '<button class="ghost wide" id="r-go">이 방으로 이동</button>'+
    '<button class="danger" id="r-leave">방 나가기</button>');
  $('#r-copy').onclick=copyInvite;
  $('#r-share').onclick=shareInvite;
  $('#r-new').onclick=function(){
    var r=randRoom();
    var el=$('#r-in');if(el)el.value=r;
    toast('새 방 코드 '+r);
  };
  $('#r-go').onclick=function(){
    var r=normRoom($('#r-in').value);
    if(!r){toast('방 코드를 입력해 주세요');return}
    if(r===S.room){toast('이미 이 방에 있어요');return}
    joinRoom(r);closeSheet();
  };
  $('#r-leave').onclick=function(){
    closeSheet();
    NET.stop();
    S.peers={};SEEN.clear();
    $('#main').hidden=true;
    $('#composer').hidden=true;
    $('#entry').hidden=false;
    showEntry(randRoom(),S.nick);
    LS.del('M.room');
  };
}

/* ================= 입장/방 이동 ================= */
function showEntry(room,nick){
  $('#in-room').value=room||randRoom();
  $('#in-nick').value=nick||'';
  setTimeout(function(){$('#in-nick').focus()},150);
}
function joinRoom(room){
  room=normRoom(room);
  S.room=room;
  LS.set('M.room',room);
  try{history.replaceState(null,'','?room='+encodeURIComponent(room))}catch(e){}
  S.msgs=[];S.polls={};S.ddays={};S.scores={react:[],speed:[]};S.peers={};S.reels={};S.reads={};SEEN.clear();READ.at=0;READ.ts=0;
  loadRoom();
  var code=$('#hdr-code');if(code)code.textContent=room;
  NET.stop();NET.idx=0;NET.outbox=[];NET.start();
  renderAll();
  addSys(room+' 방에 입장했어요');
}
function start(room,nick){
  S.nick=nick.slice(0,10);
  S.room=normRoom(room);
  sessionStorage.setItem('M.nick',S.nick);
  LS.set('M.nick',S.nick);
  LS.set('M.room',S.room);
  try{history.replaceState(null,'','?room='+encodeURIComponent(S.room))}catch(e){}
  $('#entry').hidden=true;
  $('#main').hidden=false;
  $('#composer').hidden=false;
  var code=$('#hdr-code');if(code)code.textContent=S.room;
  loadRoom();
  renderAll();
  setTab('chat');
  NET.start();
  renderPeople();
}
function renderAll(){renderChat();renderVote();renderDday();renderBoard();renderPeople();renderReels()}

/* ================= 이벤트 바인딩 ================= */
var EMOJIS=['👍','🔥','😂','❤️','🎉','😮','🥲','👏','🙏','😎'];
function bind(){
  $('#emoji-strip').innerHTML=EMOJIS.map(function(e){return '<button data-em="'+e+'">'+e+'</button>'}).join('');
  $('#emoji-strip').onclick=function(e){
    var b=e.target.closest('[data-em]');if(!b)return;
    var inp=$('#in-msg');inp.value=(inp.value+b.getAttribute('data-em')).slice(0,300);inp.focus();
  };
  $('#btn-send').onclick=sendChat;
  $('#in-msg').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat()}});

  $('#chat-list').addEventListener('click',function(e){
    var rx=e.target.closest('[data-rx]');
    if(rx){doReact(rx.getAttribute('data-mid'),rx.getAttribute('data-rx'));e.stopPropagation();return}
    var bub=e.target.closest('.bubble');
    if(bub&&bub.closest('.row')){
      var row=bub.closest('.row');
      row.classList.toggle('open');
      return;
    }
    var any=e.target.closest('.row');if(any)any.classList.toggle('open');
  });

  $('#poll-list').addEventListener('click',function(e){
    var del=e.target.closest('[data-del-poll]');
    if(del){
      var pid=del.getAttribute('data-del-poll');
      if(confirm('이 투표를 삭제할까요?')){delete S.polls[pid];persist();renderVote();sendMsg({type:'poll:del',pid:pid});publishState(true)}
      return;
    }
    var v=e.target.closest('[data-vote]');
    if(v)vote(v.getAttribute('data-vote'),Number(v.getAttribute('data-opt')));
  });
  $('#dday-list').addEventListener('click',function(e){
    var del=e.target.closest('[data-del-dday]');
    if(del){
      var did=del.getAttribute('data-del-dday');
      if(confirm('이 D-DAY를 삭제할까요?')){delete S.ddays[did];persist();renderDday();sendMsg({type:'dday:del',did:did});publishState(true)}
    }
  });
  $('#btn-new-poll').onclick=openPollSheet;
  $('#btn-new-dday').onclick=openDdaySheet;

  $('#game-seg').addEventListener('click',function(e){
    var b=e.target.closest('[data-game]');if(!b)return;
    var g=b.getAttribute('data-game');
    if(g===S.game)return;
    stopGames();S.game=g;
    $$('.seg-b').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-game')===g)});
    renderStage();
  });
  $('#game-stage').addEventListener('pointerdown',function(e){
    var t=e.target;
    if(S.game==='react'){
      if(t.closest('#r-start')||t.closest('#r-again')){startReact();return}
      if(R.phase==='wait'){reactTooSoon();return}
      if(R.phase==='go'){e.preventDefault();reactHit();return}
    }else{
      if(t.closest('#sp-start')||t.closest('#sp-again')){startSpeed();return}
      if(t.closest('#sp-target')&&SP.phase==='play'){e.preventDefault();speedHit();return}
    }
  });

  $$('.tab').forEach(function(b){b.onclick=function(){setTab(b.getAttribute('data-tab'))}});

  /* reels */
  var radd=$('#reel-add');if(radd)radd.onclick=openReelSheet;
  var rfeed=$('#reel-feed');
  if(rfeed){
    rfeed.addEventListener('click',function(e){
      var like=e.target.closest('[data-like]');
      if(like){e.stopPropagation();toggleLike(like.getAttribute('data-like'));return}
      var add=e.target.closest('[data-open-add]');
      if(add){openReelSheet();return}
      var play=e.target.closest('[data-play]');
      if(play){playYt(play.getAttribute('data-play'));return}
    });
  }
  window.addEventListener('resize',function(){setTimeout(sizeReels,140)});
  window.addEventListener('orientationchange',function(){setTimeout(sizeReels,220)});

  $('#hdr-room').onclick=openRoomSheet;
  /* 알림 토글 + 미니 배너 */
  var bell=$('#btn-notify');if(bell)bell.onclick=notiToggle;
  var nban=$('#noti-banner');
  if(nban)nban.addEventListener('click',function(e){
    if(e.target.closest('#nb-x')){e.stopPropagation();notiHideBanner();return}
    openChatTab();
  });
  /* 첫 탭 상호작용에서 오디오 준비 (모바일 자동재생 정책 대응) */
  document.addEventListener('pointerdown',function once(){
    document.removeEventListener('pointerdown',once);
    if(NOTI.on)notiUnlockAudio();
  });
  $('#sheet-bg').onclick=closeSheet;
  $('#sheet-x').onclick=closeSheet;
  $('#btn-reconnect').onclick=function(){NET.idx=0;NET.tries=0;NET.stop();NET.start();toast('다시 연결하고 있어요')};

  /* entry */
  $('#btn-dice').onclick=function(){$('#in-room').value=randRoom()};
  $('#btn-join').onclick=function(){
    var nick=$('#in-nick').value.trim();
    var room=normRoom($('#in-room').value);
    if(!nick){toast('닉네임을 입력해 주세요');$('#in-nick').focus();return}
    if(!room){toast('방 코드를 입력해 주세요');$('#in-room').focus();return}
    start(room,nick);
  };
  $('#in-room').addEventListener('keydown',function(e){if(e.key==='Enter'){$('#btn-join').click()}});
  $('#in-nick').addEventListener('keydown',function(e){if(e.key==='Enter'){$('#in-room').focus()}});

  /* presence heartbeat */
  setInterval(function(){
    if(S.net==='online'&&S.room)presence();
    prunePeers();
  },22000);
  /* 읽음 표시: 1분 지나면 '방금 읽음' -> '읽음' */
  setInterval(refreshReadLabels,5000);

  /* 탭 복귀 시 재연결 */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&S.room&&!NET.online)NET.start();
    if(document.visibilityState==='visible'&&S.room)markRead();
    if(document.visibilityState==='visible'&&S.tab==='chat'){setUnread(0);notiHideBanner()}
  });
  /* 탭을 닫거나 가릴 때도 마지막 내역을 방에 남긴다 */
  window.addEventListener('pagehide',function(){flushStateNow()});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')flushStateNow();
  });
}
function flushStateNow(){
  if(!S.room||!NET.online)return;
  try{
    clearTimeout(stateTimer);
    if(!(S.msgs.length||Object.keys(S.reels||{}).length))return;
    sendMsg({type:'state',data:capState(buildState()),__retain:true});
  }catch(e){}
}

/* ================= 부트 ================= */
function boot(){
  bind();
  notiInit();
  S.cid=LS.get('M.cid','')||sessionStorage.getItem('M.cid')||('m'+Math.random().toString(36).slice(2,10));
  LS.set('M.cid',S.cid);
  sessionStorage.setItem('M.cid',S.cid);
  var qs=new URLSearchParams(location.search);
  var urlRoom=normRoom(qs.get('room')||'');
  var sNick=sessionStorage.getItem('M.nick');
  var lNick=LS.get('M.nick','');
  var lastRoom=normRoom(LS.get('M.room',''));
  if(sNick&&(urlRoom||lastRoom)){
    start(urlRoom||lastRoom,sNick);
  }else{
    showEntry(urlRoom||lastRoom||randRoom(),lNick);
  }
  window.MS={S:S,NET:NET,MLOG:MLOG,start:start,joinRoom:joinRoom,setTab:setTab,sendChat:sendChat,dayDiff:dayDiff,dLabel:dLabel,renderReels:renderReels,openReelSheet:openReelSheet,postReel:postReel,toggleLike:toggleLike,reelList:reelList,NOTI:NOTI,notiToggle:notiToggle,notiChat:notiChat,setUnread:setUnread};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
