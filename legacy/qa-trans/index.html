  .pf-aura{position:absolute; inset:0; pointer-events:none; opacity:calc(var(--pi) * .52);
    background:radial-gradient(circle at 50% 47%, var(--gc) 0%, rgba(0,0,0,0) 56%);
    mix-blend-mode:screen; transition:opacity .22s, background .22s}
  .pullfx[data-g="legendary"] .pf-aura{opacity:calc(var(--pi) * .62);
    background:radial-gradient(circle at 50% 47%, #fff 0%, #fde68a 14%, #fb923c 28%, #f97316 44%, #b91c1c 62%, rgba(0,0,0,0) 78%)}
  .pullfx[data-g="transcendent"] .pf-aura{opacity:calc(var(--pi) * .92);
    background:radial-gradient(circle at 50% 47%, #ffffff 0%, #e8eaef 16%, #9aa0ab 32%, #2b2d33 50%, #09090d 66%, rgba(0,0,0,0) 84%)}
  .pf-stage{position:absolute; inset:0}
  .pf-machine{position:absolute; left:50%; top:50%; width:min(46vmin,214px); height:min(58vmin,282px); z-index:2;
    transform:translate(-50%,-50%) scale(var(--s0)); will-change:transform;
    filter:drop-shadow(0 0 calc(3px + var(--pi) * 44px) var(--gc))}

  /* ── 룬 코어 크리스탈 — 각진 다면체 보석 + 둘러싼 회전 룬 링(마법진) ──
     기본은 은빛/아이스 블루, 단계마다 등급색이 코어에 차오르고 균열이 번진다. */
  .pf-rune{position:absolute; left:50%; top:50%; width:min(70vmin,340px); height:min(70vmin,340px);
    transform:translate(-50%,-50%); pointer-events:none; color:var(--gc);
    opacity:calc(.42 + var(--pi) * .56); transition:opacity .2s}
  .pf-rune svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;
    filter:drop-shadow(0 0 5px rgba(255,255,255,.4)) drop-shadow(0 0 16px var(--gc))}
  .pf-rune .rn-a{animation:pfRuneA 26s linear infinite}
  .pf-rune .rn-b{animation:pfRuneB 15s linear infinite}
  .pf-rune .rn-g{animation:pfRuneA 40s linear infinite reverse}
  .pf-crystal{position:absolute; inset:5% 2% 3%; pointer-events:none; transform-origin:50% 64%;
    animation:pfFloat 4.2s ease-in-out infinite}
  .pf-crystal > i{position:absolute; display:block}
  .cr-glow{inset:-16%; border-radius:50%;
    background:radial-gradient(circle at 50% 56%, var(--gc) 0%, rgba(0,0,0,0) 62%);
    opacity:calc(.18 + var(--pi) * .5); mix-blend-mode:screen; filter:blur(7px)}
  /* 테두리 — 등급색 그 자체로 물든다(흰 하이라이트·아래쪽 그늘만 남긴다) */
  .cr-edge{inset:0; clip-path:polygon(50% 0%,78% 11%,100% 43%,86% 84%,50% 100%,14% 84%,0% 43%,22% 11%);
    background:linear-gradient(150deg, #ffffff 0%, var(--gc) 34%, var(--gc) 64%, rgba(0,0,0,.45) 100%);
    opacity:1; filter:blur(.4px)}
  /* 돌 본체 — 바탕은 등급색, 그 위에 유리면 하이라이트와 그늘만 얹는다 */
  .cr-body{inset:2px; clip-path:polygon(50% 0%,78% 11%,100% 43%,86% 84%,50% 100%,14% 84%,0% 43%,22% 11%);
    background:
      linear-gradient(102deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.16) 41.6%, rgba(255,255,255,0) 42%,
        rgba(0,0,0,.16) 42.4%, rgba(0,0,0,.4) 100%),
      radial-gradient(ellipse at 32% 16%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.34) 26%, rgba(255,255,255,0) 56%),
      linear-gradient(158deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.3) 100%),
      var(--gc);
    box-shadow:inset 0 0 30px rgba(255,255,255,.4)}
  .cr-facet{inset:2px; clip-path:polygon(50% 0%,61% 32%,50% 100%,39% 32%);
    background:linear-gradient(200deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.26) 52%, rgba(255,255,255,0) 100%);
    opacity:.58; mix-blend-mode:screen}
  .cr-core{inset:2px; clip-path:polygon(50% 0%,78% 11%,100% 43%,86% 84%,50% 100%,14% 84%,0% 43%,22% 11%);
    background:radial-gradient(circle at 50% 56%, #ffffff 0%, #ffffff 7%, var(--gc) 34%, rgba(0,0,0,0) 78%);
    opacity:calc(.14 + var(--pi) * .76); mix-blend-mode:screen; filter:blur(1px);
    animation:pfCorePulse 2.6s ease-in-out infinite}
  .cr-cracks{position:absolute; inset:2px; pointer-events:none;
    clip-path:polygon(50% 0%,78% 11%,100% 43%,86% 84%,50% 100%,14% 84%,0% 43%,22% 11%)}
  .cr-cracks svg{position:absolute; inset:0; width:100%; height:100%}
  .crk{fill:none; stroke:#ffffff; stroke-width:1.5; stroke-linejoin:round; vector-effect:non-scaling-stroke;
    filter:drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 5px var(--gc)); transition:opacity .2s}
  .crk.a{opacity:clamp(0, calc((var(--pi) - .06) * 3.6), .96)}
  .crk.b{opacity:clamp(0, calc((var(--pi) - .3) * 3.6), .9)}
  .crk.c{opacity:clamp(0, calc((var(--pi) - .56) * 3.6), .95)}
  /* ── 초월(8단계) — 돌 본체가 무지개 프리즘으로 물들고 천천히 색이 흘러간다 ── */
  .pullfx[data-g="transcendent"] .cr-edge{
    background:conic-gradient(from 200deg,#ff5d5d,#ffd166 14%,#7bf1a8 28%,#7ad7ff 42%,#b78aff 56%,#ff5d8f 70%,#ffd166 84%,#ff5d5d 100%)}
  .pullfx[data-g="transcendent"] .cr-body{
    background:
      linear-gradient(102deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.16) 41.6%, rgba(255,255,255,0) 42%,
        rgba(0,0,0,.14) 42.4%, rgba(0,0,0,.34) 100%),
      radial-gradient(ellipse at 32% 16%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.3) 26%, rgba(255,255,255,0) 54%),
      conic-gradient(from 200deg,#ff5d5d,#ffd166 14%,#7bf1a8 28%,#7ad7ff 42%,#b78aff 56%,#ff5d8f 70%,#ffd166 84%,#ff5d5d 100%);
    box-shadow:inset 0 0 34px rgba(255,255,255,.5)}
  .pullfx[data-g="transcendent"] .cr-core{
    background:radial-gradient(circle at 50% 56%, #fff 0%, #fff 8%, #ffd166 22%, #7bf1a8 38%, #7ad7ff 54%, #b78aff 72%, rgba(0,0,0,0) 86%);
    opacity:calc(.3 + var(--pi) * .68); filter:blur(1.5px)}
  .pullfx[data-g="transcendent"] .cr-glow{
    background:radial-gradient(circle at 50% 56%, #fff 0%, #ffd166 18%, #7bf1a8 34%, #7ad7ff 50%, #b78aff 66%, rgba(0,0,0,0) 80%)}
  .pullfx[data-g="transcendent"] .pf-crystal{animation:pfFloat 4.2s ease-in-out infinite, yinSpinSlow 9s linear infinite}
  .pullfx[data-g="transcendent"] .pf-burst{
    background:radial-gradient(circle, #fff 0%, #ffd166 14%, #7bf1a8 30%, #7ad7ff 46%, #b78aff 62%, rgba(0,0,0,0) 78%)}
  .pullfx[data-g="transcendent"] .pf-shards i{
    background:linear-gradient(160deg,#fff 0%,#ffd166 34%,#7bf1a8 62%,#7ad7ff 100%)}
  @keyframes pfPrismHue{0%,100%{filter:brightness(1)}}
  .pf-shards{position:absolute; inset:0; pointer-events:none}
  .pf-shards i{position:absolute; left:50%; top:50%; width:11px; height:17px; margin:-9px 0 0 -5.5px;
    clip-path:polygon(50% 0%,100% 64%,16% 100%); opacity:0;
    background:linear-gradient(160deg, #ffffff 0%, #ffffff 30%, var(--gc) 100%);
    filter:drop-shadow(0 0 7px var(--gc))}
  .pf-shards i:nth-child(1){--sa:8deg; --sd:0s}
  .pf-shards i:nth-child(2){--sa:52deg; --sd:.02s}
  .pf-shards i:nth-child(3){--sa:96deg; --sd:.04s}
  .pf-shards i:nth-child(4){--sa:138deg; --sd:.01s}
  .pf-shards i:nth-child(5){--sa:184deg; --sd:.05s}
  .pf-shards i:nth-child(6){--sa:228deg; --sd:.03s}
  .pf-shards i:nth-child(7){--sa:272deg; --sd:.06s}
  .pf-shards i:nth-child(8){--sa:314deg; --sd:.02s}
  .pf-ring{position:absolute; left:50%; top:50%; border-radius:50%; border:2px solid var(--gc);
    transform:translate(-50%,-50%); opacity:0}
  .pf-ring.r1{width:56%; height:24%}
  .pf-ring.r2{width:78%; height:34%}
  .pf-ring.r3{width:100%; height:44%}
  .pf-beams{position:absolute; left:50%; top:50%; width:min(120vmin,720px); height:min(120vmin,720px); z-index:1;
    transform:translate(-50%,-50%); opacity:0; pointer-events:none}
  .pf-beams i{position:absolute; left:50%; top:50%; width:5px; height:52%; margin-left:-2.5px;
    transform-origin:50% 0; background:linear-gradient(180deg, rgba(255,255,255,0), var(--gc)); filter:blur(.6px)}
  .pf-beams i:nth-child(2){transform:rotate(45deg)}
  .pf-beams i:nth-child(3){transform:rotate(90deg)}
  .pf-beams i:nth-child(4){transform:rotate(135deg)}
  .pf-beams i:nth-child(5){transform:rotate(180deg)}
  .pf-beams i:nth-child(6){transform:rotate(225deg)}
  .pf-beams i:nth-child(7){transform:rotate(270deg)}
  .pf-beams i:nth-child(8){transform:rotate(315deg)}
  .pullfx.on .pf-beams{opacity:calc(var(--pi) * .75); animation:pfSpin 9s linear infinite}
  .pf-burst{position:absolute; left:50%; top:50%; width:min(76vmin,460px); height:min(76vmin,460px);
    margin-left:calc(min(76vmin,460px) / -2); margin-top:calc(min(76vmin,460px) / -2); border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--gc) 30%, rgba(0,0,0,0) 72%);
    transform:scale(.1); opacity:0}
  .pf-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
  .pf-grade{position:absolute; left:0; right:0; top:calc(8% + env(safe-area-inset-top, 0px));
    text-align:center; pointer-events:none; z-index:2}
  .pf-grade .pf-gk{display:block; font-size:8.5px; letter-spacing:.42em; color:rgba(255,240,205,.5)}
  .pf-grade .pf-gn{display:inline-block; margin-top:7px; font-family:var(--serif);
    font-size:clamp(22px,6.2vw,38px); line-height:1.15; letter-spacing:.03em; color:var(--gc);
    text-shadow:0 0 16px var(--gc), 0 0 42px var(--gc); word-break:keep-all}
  .pf-grade .pf-gn.heroic-text{color:#c084fc; text-shadow:0 0 18px rgba(168,85,247,.95), 0 0 46px rgba(124,58,237,.85)}
  /* 레전더리 — 주황 불꽃 그라데이션 */
  .pf-grade .pf-gn.flame-text{background:linear-gradient(100deg,#facc15 0%,#fb923c 34%,#f97316 62%,#facc15 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;
    filter:drop-shadow(0 0 14px rgba(249,115,22,.9)) drop-shadow(0 0 38px rgba(234,88,12,.75))}
  .pf-grade .pf-gn.pop{animation:pfPop .34s cubic-bezier(.2,1.5,.4,1) both}
  /* 단계 점(●○○…)은 남은 단계 수를 그대로 보여줘 스포일러가 되므로 숨긴다 */
  .pf-steps{position:absolute; left:50%; bottom:calc(15% + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%); display:none; align-items:center; gap:7px; pointer-events:none; z-index:2}
  .pf-steps i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.13); transition:.22s}
  .pf-steps i.on{background:var(--pc); box-shadow:0 0 9px var(--pc), 0 0 18px var(--pc); transform:scale(1.18)}
  .pf-steps i[data-g="basic"]{--pc:#cbd5e1}
  .pf-steps i[data-g="rare"]{--pc:#22c55e}
  .pf-steps i[data-g="special"]{--pc:#38bdf8}
  .pf-steps i[data-g="heroic"]{--pc:#a855f7}
  .pf-steps i[data-g="mythic"]{--pc:#ef4444}
  .pf-steps i[data-g="legend"]{--pc:#facc15}
  .pf-steps i[data-g="legendary"]{--pc:#f97316}
  .pf-steps i[data-g="transcendent"]{--pc:#f0abfc}
  .pf-mute{position:absolute; right:14px; top:calc(12px + env(safe-area-inset-top, 0px)); z-index:4;
    width:38px; height:38px; padding:0; border-radius:50%; cursor:pointer; font-size:15px; line-height:1;
    border:1px solid rgba(255,240,205,.26); background:rgba(0,0,0,.45); color:#f6e6bd;
    -webkit-tap-highlight-color:transparent}
  .pf-tip{position:absolute; left:0; right:0; bottom:8%; text-align:center; font-size:10.5px; letter-spacing:.22em;
    color:rgba(255,240,205,.5); z-index:2; padding:0 18px; pointer-events:none}
  /* ── 터치 승격 안내 · 스킵 버튼 · 최종 팡 ── */
  .pf-tip.tap{font-size:12.5px; letter-spacing:.06em; line-height:1.6; color:#ffeec2;
    text-shadow:0 0 16px rgba(255,214,130,.6); animation:pfTapHint 1.25s ease-in-out infinite}
  .pf-tip.tap b{color:#fff; font-weight:700}
  .pf-skip{position:absolute; right:14px; bottom:calc(13.5% + env(safe-area-inset-bottom, 0px)); z-index:5;
    display:inline-flex; align-items:center; gap:4px; padding:9px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:11px; letter-spacing:.04em; color:#f6e6bd;
    border:1px solid rgba(255,240,205,.28); background:rgba(0,0,0,.55);
    -webkit-tap-highlight-color:transparent; transition:transform .12s, background .12s}
  .pf-skip:active{transform:scale(.94); background:rgba(0,0,0,.75)}
  .pullfx.pf-final{cursor:default}
  .pullfx.pf-final .pf-machine{animation:pfFinalZoom .58s cubic-bezier(.2,.9,.3,1.2) both}
  .pullfx.pf-final[data-g="transcendent"] .pf-machine{filter:drop-shadow(0 0 18px #ffd166) drop-shadow(0 0 44px #b78aff)}
  .pullfx.pf-final .pf-crystal{animation:pfShatter .5s cubic-bezier(.2,.85,.3,1) both}
  .pullfx.pf-final .pf-shards i{animation:pfShard .82s cubic-bezier(.15,.72,.3,1) both; animation-delay:var(--sd, 0s)}
  .pullfx.pf-final .pf-rune{opacity:0; transition:opacity .3s}
  .pullfx.pf-final .pf-burst{animation:pfFinalBurst .68s cubic-bezier(.15,.7,.3,1) both}
  .pullfx.pf-final .pf-flash{animation:pfFinalFlash .44s ease-out both}
  .pullfx.pf-final .pf-beams{opacity:1; animation:pfSpin 1.8s linear infinite}
  @keyframes pfTapHint{0%,100%{opacity:.74; transform:translateY(0)} 50%{opacity:1; transform:translateY(-3px)}}
  @keyframes pfFinalFlash{0%{opacity:0} 16%{opacity:1} 100%{opacity:0}}
  @keyframes pfFinalBurst{0%{opacity:.6; transform:scale(.25)} 34%{opacity:1; transform:scale(1.25)} 100%{opacity:0; transform:scale(3.4)}}
  @keyframes pfFinalZoom{0%{transform:translate(-50%,-50%) scale(var(--s0))}
    38%{transform:translate(-50%,-50%) scale(calc(var(--s0) * .88))}
    64%{transform:translate(-50%,-50%) scale(calc(var(--s0) * 1.32))}
    100%{transform:translate(-50%,-50%) scale(calc(var(--s0) * 1.7)); opacity:0}}

  .pf-machine.pf-in{animation:pfDrop .5s cubic-bezier(.2,.9,.3,1.25) both}
  .pf-machine.pf-k{animation:pfKick .36s cubic-bezier(.25,.9,.35,1.1) both}
  .pf-burst.pf-b{animation:pfBurst .6s ease-out both}
  .pf-flash.pf-f{animation:pfFlash .24s ease-out both}
  .pullfx.on .pf-ring.r1{animation:pfRing 1.5s ease-out .1s infinite}
  .pullfx.on .pf-ring.r2{animation:pfRing 1.8s ease-out .35s infinite}
  .pullfx.on .pf-ring.r3{animation:pfRing 2.1s ease-out .6s infinite}

  @keyframes pfDrop{0%{transform:translate(-50%,-62%) scale(.42); opacity:0}
    55%{transform:translate(-50%,-48%) scale(calc(var(--s0) * 1.12)); opacity:1}
    100%{transform:translate(-50%,-50%) scale(var(--s0)); opacity:1}}
  @keyframes pfKick{0%{transform:translate(-50%,-50%) scale(calc(var(--s0) * .84))}
    16%{transform:translate(-50%,-50%) scale(calc(var(--s0) * 1.16))}
    32%{transform:translate(calc(-50% - var(--shk)),-50%) rotate(-2.6deg) scale(calc(var(--s0) * 1.02))}
    48%{transform:translate(calc(-50% + var(--shk)),-50%) rotate(2.6deg) scale(calc(var(--s0) * 1.09))}
    66%{transform:translate(calc(-50% - var(--shk) * .5),-50%) rotate(-1.2deg) scale(calc(var(--s0) * 1.03))}
    100%{transform:translate(-50%,-50%) scale(var(--s0))}}
  @keyframes pfPop{0%{transform:scale(.6); opacity:0} 60%{transform:scale(1.1); opacity:1} 100%{transform:scale(1); opacity:1}}
  @keyframes pfBurst{0%{opacity:.2; transform:scale(.12)} 26%{opacity:1} 100%{opacity:0; transform:scale(2.6)}}
  @keyframes pfFlash{0%{opacity:0} 30%{opacity:.92} 100%{opacity:0}}
  @keyframes pfSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes pfRuneA{to{transform:rotate(360deg)}}
  @keyframes pfRuneB{to{transform:rotate(-360deg)}}
  @keyframes pfFloat{0%,100%{transform:translateY(0) rotate(-.6deg)} 50%{transform:translateY(-3.4%) rotate(.8deg)}}
  @keyframes pfCorePulse{0%,100%{opacity:calc(.3 + var(--pi) * .5); transform:scale(.93)}
    50%{opacity:calc(.46 + var(--pi) * .54); transform:scale(1.07)}}
  @keyframes pfShatter{0%{transform:scale(1); opacity:1} 30%{transform:scale(1.09); opacity:1}
    58%{transform:scale(1.2); opacity:.6} 100%{transform:scale(1.46); opacity:0}}
  @keyframes pfShard{0%{opacity:0; transform:rotate(var(--sa)) translateY(0) scale(.45)}

  /* ── 🖤🤍 초월 카드 등장 — 글자 명패 대신 무지개 섬광 + 빛무리 ── */
  .seqtrans{position:fixed; inset:0; z-index:212; pointer-events:none; opacity:0; overflow:hidden}

  /* ── NEW · 카드팩 모달 안쪽 크기의 큰 카드 팝업 ──
     화면 전체 덮개가 아니라 인물 카드팩 모달 내용 영역만큼의 둥근 카드로 뜬다. */
  .newfx{position:fixed; inset:0; z-index:214; display:flex; align-items:center; justify-content:center;

      linear-gradient(180deg,#0b0d13 0%,#05060a 72%,#000 100%)}
  .newfx .nf-rays{position:absolute; left:50%; top:34%; width:180%; height:180%;
    margin:-90% 0 0 -90%; opacity:.42;
    background:conic-gradient(from 0deg, rgba(255,255,255,.18) 0deg, rgba(0,0,0,0) 26deg,
      rgba(255,255,255,.13) 52deg, rgba(0,0,0,0) 78deg, rgba(255,255,255,.18) 104deg,
      rgba(0,0,0,0) 130deg, rgba(255,255,255,.12) 156deg, rgba(0,0,0,0) 182deg,
      rgba(255,255,255,.18) 208deg, rgba(0,0,0,0) 234deg, rgba(255,255,255,.13) 260deg,

  .erow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; max-width:580px; margin:26px auto 0; position:relative; z-index:2}
  .vsline{display:flex; align-items:center; justify-content:center; gap:12px; margin:10px 0; opacity:.55}

  .vsline span{font-family:var(--serif); font-size:11px; letter-spacing:.3em; color:var(--gold-dim)}
  .arow{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px; position:relative; z-index:2}
  .bu{
    position:relative; border:1px solid rgba(255,255,255,.09); border-radius:10px; padding:5px;

  }

  .bu.ally{border-color:color-mix(in srgb, var(--rc,#9ca3af) 35%, transparent)}
  .bu.ally.turn{border-color:var(--gold-hi); box-shadow:0 0 0 1px var(--gold-hi) inset, 0 0 26px -8px var(--gold-hi)}
  .bu.ally.ready{box-shadow:0 0 0 1px #f6e6bd, 0 0 30px -6px #f6e6bd}
  .bu.acting{transform:translateY(-4px) scale(1.03)}
  .bu.ulting{box-shadow:0 0 0 2px #f6e6bd, 0 0 46px -4px #f6e6bd; transform:scale(1.05)}
  .bu.dead{opacity:.45; filter:grayscale(1)}
  .bu-crown{position:absolute; right:3px; top:3px; z-index:4; font-size:6.5px; letter-spacing:.06em; padding:2px 4px; border-radius:999px; background:rgba(239,68,68,.85); color:#fff; font-weight:700}
  .bu-icon{display:grid; place-items:center; aspect-ratio:1/1; font-size:clamp(18px,3vw,30px);
    border-radius:8px; background:radial-gradient(circle at 50% 35%, rgba(239,68,68,.2), rgba(8,10,14,.9))}
  .bu-art{position:relative; display:block; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#0b0e13}
  .bu-art .ph-svg,.bu-art .ph-img{position:absolute; inset:0; width:100%; height:100%}
  .bu-art .ph-img{object-fit:cover; object-position:top center}
  .bu-star{position:absolute; left:4px; top:24px; font-size:7px; color:var(--gold-hi); text-shadow:0 1px 3px #000; z-index:3; letter-spacing:.02em}
  .bu-name{display:block; font-family:var(--serif); font-size:9.5px; color:#efe6d4; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em}
  .bu.enemy .bu-name{font-size:9px; color:#f0d8d8}
  .hpb{position:relative; display:block; height:4px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden}
  .hpf{position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:3px; background:linear-gradient(90deg,#7ecf9b,#b9e6a0); transform-origin:left center; transform:scaleX(1); transition:transform .28s cubic-bezier(.2,.8,.2,1); will-change:auto}
  .enemy .hpf{background:linear-gradient(90deg,#c0392b,#ef6a5a)}
  .bu.low .hpf{background:linear-gradient(90deg,#f0b04a,#f07a4a); animation:hpblink 1s infinite}
  @keyframes hpblink{50%{opacity:.55}}
  .bu-hp{font-size:6.5px; color:#8b93a3; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .pips{display:flex; gap:2px; justify-content:center; margin-top:1px}
  .pipn{display:block; font-size:6.5px; color:#6f7787; text-align:center; letter-spacing:.04em; margin-top:1px}
  .bu.ready .pipn{color:#f6e6bd}
  .pips i{width:100%; max-width:6px; height:3px; border-radius:1px; background:rgba(255,255,255,.13); transition:background .2s}
  .pips i.on{background:linear-gradient(90deg,#c8a86a,#f6e6bd); box-shadow:0 0 6px rgba(246,230,189,.7)}
  .ultbadge{display:none; position:absolute; right:3px; top:3px; font-size:6.5px; letter-spacing:.08em; padding:1px 4px; border-radius:4px; background:linear-gradient(90deg,#f6e6bd,#c8a86a); color:#0a0d12; font-weight:700}
  .bu.ready .ultbadge{display:block; animation:hpblink 1.2s infinite}
  .hitfx{position:absolute; inset:0; pointer-events:none; background:#fff; opacity:0}
  .shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  .shake-sm{animation:shake .26s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(4px,-2px)}
    30%,50%,70%{transform:translate(-6px,2px)} 40%,60%{transform:translate(6px,-1px)}
  }
  .floats{position:absolute; inset:0; pointer-events:none; z-index:6}
  .fdmg{
    position:absolute; transform:translate(-50%,-50%); font-family:var(--serif); font-size:15px; font-weight:700;
    color:#fff2d4; text-shadow:0 2px 8px #000, 0 0 16px rgba(0,0,0,.8); animation:fdmg 1.3s ease-out forwards;
    white-space:nowrap; letter-spacing:.01em;
  }
  .fdmg.heal{color:#9ee6b4} .fdmg.ult{font-size:22px; color:#ffe9a8} .fdmg.crit{color:#ff9d6b; font-size:19px}
  @keyframes fdmg{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)}20%{opacity:1; transform:translate(-50%,-60%) scale(1.12)}100%{opacity:0; transform:translate(-50%,-150%) scale(1)}}
  .cutin{position:absolute; inset:0; z-index:9; pointer-events:none; display:flex; align-items:center; justify-content:center; opacity:0}
  .cutin.go{animation:cutfade 1.5s ease forwards}
  @keyframes cutfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
  .cut-in{
    position:relative; min-width:min(520px,92%); text-align:center; padding:16px 28px;
    border-top:2px solid var(--rc,#ecd9a8); border-bottom:2px solid var(--rc,#ecd9a8);
    background:linear-gradient(90deg, transparent, rgba(6,8,12,.94) 18%, rgba(6,8,12,.94) 82%, transparent);
    transform:skewX(-8deg);
  }
  .cutin.go .cut-in{animation:cutslide 1.5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes cutslide{0%{transform:skewX(-8deg) translateX(-40%)}22%{transform:skewX(-8deg) translateX(0)}78%{transform:skewX(-8deg) translateX(0)}100%{transform:skewX(-8deg) translateX(40%)}}
  .cut-in .ci-k{display:block; font-size:8px; letter-spacing:.4em; color:var(--rc,#ecd9a8); transform:skewX(8deg)}
  .cut-in .ci-s{display:block; font-family:var(--serif); font-size:clamp(20px,3.4vw,30px); font-weight:700; margin-top:4px; transform:skewX(8deg);
    background:linear-gradient(90deg,#ff8a8a,#ffe08a,#8affb0,#8ad4ff,#d08aff); -webkit-background-clip:text; background-clip:text; color:transparent}
  .cut-in .ci-n{display:block; font-size:9.5px; letter-spacing:.16em; color:#d8cfbb; margin-top:4px; transform:skewX(8deg)}
  .waveban{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:8; opacity:0; text-align:center; pointer-events:none}
  .waveban.go{animation:wavefade 1.5s ease forwards}
  /* ⚡ 전투 배속 2x·3x — 이펙트·애니메이션도 함께 빨라진다 */
  .arena.spd2 .fdmg{animation-duration:.66s}
  .arena.spd3 .fdmg{animation-duration:.44s}
  .arena.spd2 .bu.acting{animation-duration:.19s}
  .arena.spd3 .bu.acting{animation-duration:.13s}
  .arena.spd2 .cutin.go,.arena.spd2 .cutin.go .cut-in{animation-duration:.75s}
  .arena.spd3 .cutin.go,.arena.spd3 .cutin.go .cut-in{animation-duration:.5s}
  .arena.spd2 .waveban.go{animation-duration:.75s}
  .arena.spd3 .waveban.go{animation-duration:.5s}
  .arena.spd2 .bu.hit-glow{animation-duration:.32s}
  .arena.spd3 .bu.hit-glow{animation-duration:.21s}
  .arena.spd2 .ultfx>*,.arena.spd3 .ultfx>*{animation-duration:.6s}
  .arena.spd3 .terr-fill,.arena.spd3 .terr-ring{animation-duration:.5s!important}
  @keyframes wavefade{0%{opacity:0; transform:translate(-50%,-50%) scale(1.3)}18%{opacity:1; transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
  .waveban .wb-k{display:block; font-size:9px; letter-spacing:.4em; color:var(--gold-dim)}
  .waveban .wb-t{display:block; font-family:var(--serif); font-size:clamp(18px,3vw,26px); color:#f7eedb; margin-top:4px; text-shadow:0 0 30px rgba(200,168,106,.6); white-space:nowrap}
  .a-log{display:flex; flex-direction:column; gap:3px; padding:10px 2px 0; min-height:56px}
  .lg{font-size:10px; line-height:1.55; color:#8b93a3; letter-spacing:.01em}
  .lg b{color:#e9e0cd; font-weight:600}
  .lg.good b{color:#b9e6a0} .lg.bad b{color:#f0a0a0} .lg.ult{color:#f6e6bd} .lg.ult b{color:#fff2d4} .lg.sys{color:#6b7280; letter-spacing:.06em}
  .a-skill{margin-top:8px; border:1px solid var(--line2); border-radius:12px; padding:11px 13px; background:rgba(255,255,255,.02); min-height:58px}
  .a-skill:not(.on){opacity:.85}
  .a-skill .sk-idle{margin:0; font-size:10.5px; color:#6f7787; line-height:1.6}
  .sk-who{display:flex; align-items:center; gap:8px}
  .sk-art{position:relative; width:26px; height:26px; border-radius:50%; overflow:hidden; border:1px solid rgba(200,168,106,.4); flex:0 0 26px}
  .sk-art .ph-svg,.sk-art .ph-img{position:absolute; inset:0; width:100%; height:100%}
  .sk-who b{font-family:var(--serif); font-size:13px; color:#f4ebd9}
  .sk-hint{font-size:9.5px; color:var(--gold-dim); letter-spacing:.06em; margin-left:auto}
  .sk-btns{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px}
  .sk-btn{
    text-align:left; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:9px 10px;
    background:linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); color:inherit; cursor:pointer;
    font-family:inherit; transition:.16s; display:flex; flex-direction:column; gap:2px;
  }
  .sk-btn:hover{border-color:rgba(200,168,106,.55); transform:translateY(-2px); background:rgba(200,168,106,.1)}
  .sk-btn.ult{border-color:rgba(200,168,106,.5); background:linear-gradient(160deg, rgba(200,168,106,.2), rgba(200,168,106,.05))}
  .sk-btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
  .sk-i{font-size:9px; color:var(--gold-dim)}
  .sk-nm{font-family:var(--serif); font-size:12px; color:#f2e9d8}
  .sk-ef{font-size:8px; letter-spacing:.08em; color:var(--gold-dim)}
  .sk-d{font-size:8.5px; color:#7f8798; line-height:1.4; margin-top:2px}

  /* ───── result ───── */
  .bres{position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:18px;
    background:rgba(4,5,8,.88); opacity:0; transition:opacity .3s}
  .bres.show{opacity:1}
  .br-box{
    width:min(430px,100%); text-align:center; border-radius:16px; padding:26px 24px;
    border:1px solid rgba(200,168,106,.4); background:linear-gradient(165deg,#141a24,#0a0d12);
    box-shadow:0 40px 80px -40px #000; transform:translateY(12px) scale(.97); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .bres.show .br-box{transform:none}
  .bres.lose .br-box{border-color:rgba(239,68,68,.4)}
  .br-k{font-size:9px; letter-spacing:.42em; color:var(--gold-dim)}
  .bres.win .br-k{color:var(--gold-hi)}
  .bres.lose .br-k{color:#e08a8a}
  .br-box h3{font-family:var(--serif); font-size:23px; font-weight:600; margin:10px 0 0; color:#f7eedb}
  .br-sub{font-size:11.5px; color:#9a9384; margin:6px 0 0}
  .br-stars{font-size:22px; letter-spacing:.16em; color:#f6e6bd; margin-top:12px; text-shadow:0 0 20px rgba(246,230,189,.6)}
  .br-stars i{font-style:normal; color:#3a4048; text-shadow:none}
  .br-rewards{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
  .br-rewards div{border:1px solid var(--line2); border-radius:10px; padding:9px 6px; background:rgba(255,255,255,.02)}
  .br-rewards span{display:block; font-size:8px; letter-spacing:.1em; color:var(--muted2)}
  .br-rewards b{display:block; font-size:11.5px; color:var(--gold-hi); margin-top:4px; font-family:var(--serif)}
  .br-tip{font-size:10.5px; color:#7f8798; line-height:1.7; margin:12px 0 0}
  .br-acts{display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap}

  @media (max-width:900px){
    .bmap{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bdeck-wrap{grid-template-columns:1fr}
    .bcards{max-height:none; grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (max-width:640px){
    .modal.battle{padding:0}
    .bsheet{height:100dvh; max-height:100dvh; border-radius:0; border-left:0; border-right:0}
    .b-top{padding:12px 14px}
    .b-body{padding:0 13px 18px}
    .bmap-head{padding:14px 0 12px}
    .bmap-txt h3{font-size:21px}
    .bmap-info div{padding:6px 9px}
    .bmap{grid-template-columns:1fr 1fr; gap:9px}
    .bstage{min-height:150px; padding:13px 11px}
    .bs-name{font-size:13px}
    .bs-no{font-size:20px}
    .bslots{grid-template-columns:repeat(3,minmax(0,1fr))}
    .bcards{grid-template-columns:repeat(3,minmax(0,1fr))}
    .erow{grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; margin-top:22px}
    .arow{grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px}
    .bu{padding:4px; border-radius:9px}
    .bu-name{font-size:8.5px}
    .field{padding:10px 8px 12px; min-height:430px}
    .sk-btns{grid-template-columns:1fr}
    .sk-d{display:none}
    .a-ctrl{width:100%; justify-content:flex-end}
    .cut-in{min-width:94%}
    .br-rewards{grid-template-columns:1fr}
  }


  /* ───── 세계지도 · 정복 현황 ───── */
  .wmap{
    display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:16px; align-items:center;
    border:1px solid rgba(200,168,106,.22); border-radius:14px; padding:12px 16px; margin-bottom:14px;
    background:
      radial-gradient(500px 200px at 20% 0%, rgba(63,174,131,.12), transparent 70%),
      linear-gradient(160deg, rgba(200,168,106,.06), rgba(255,255,255,.012));
  }
  .wmap-art{position:relative; min-width:0; border-radius:10px; overflow:hidden}
  .wmap-art .wmsvg{display:block; width:100%; height:auto; max-height:420px}
  .wm-grat path{stroke:rgba(150,205,225,.13); stroke-width:.5; fill:none; stroke-dasharray:3 5}
  .wm-gl{font-family:var(--sans,inherit); font-size:4.6px; letter-spacing:.14em; fill:rgba(160,205,225,.4)}
  .wm-gl.mid{text-anchor:middle; font-size:4.4px}
  .wm-c{fill:#3a5c6d; stroke:#a6cede; stroke-width:.34; stroke-opacity:.5; vector-effect:non-scaling-stroke;
    transition:fill .7s, stroke .7s}
  .wm-coast .wm-c{fill:none; stroke:#5fe0e8; stroke-width:1.5; stroke-opacity:.34}
  .wm-coast .wm-c.halo{fill:none; stroke:#5fe0e8; stroke-width:4; stroke-opacity:.1}
  .wm-c.own{fill:#2f9e78; stroke:#a8f0c4; stroke-width:.5; stroke-opacity:.9}
  .wm-c.tgt{fill:#b08a4a; stroke:#f6e6bd; stroke-width:.5; stroke-opacity:.75}
  .wm-pac path{fill:rgba(79,214,224,.035); stroke:rgba(127,224,182,.22); stroke-width:.5; stroke-dasharray:3 6; vector-effect:non-scaling-stroke}
  .wm-pac.own path{fill:rgba(47,158,120,.34); stroke:rgba(168,240,196,.85)}
  .wm-dot{fill:#7fe0b6; stroke:#0a1a14; stroke-width:.7; opacity:.95}
  .wm-marks .wm-dot{stroke:#bfffe0; stroke-width:.9}
  .wm-front .wm-fr-glow{fill:rgba(246,230,189,.2); animation:wpulse 2s ease-in-out infinite}
  .wm-front .wm-fr-ring{fill:none; stroke:#f6e6bd; stroke-width:.9; opacity:.8; vector-effect:non-scaling-stroke}
  .wm-front .wm-fr-dia{fill:#f6e6bd; opacity:.96; stroke:#fff8dc; stroke-width:.6}
  .wm-front .wm-fr-core{fill:#3a2a12}
  .wm-labg rect{fill:rgba(7,12,17,.8); stroke:rgba(246,230,189,.42); stroke-width:.4}
  .wm-labg .wm-lab.next{stroke:none}
  .wm-mark{font-size:11px; text-anchor:middle; dominant-baseline:middle}
  .wm-mark.next{font-size:12.5px; animation:wpulse 1.8s ease-in-out infinite}
  .wm-mark.lock{font-size:14px; fill:#39404c}
  .wm-mark.done{font-size:12px}
  .wm-lab{font-size:6.4px; fill:#a9e6c0; text-anchor:middle; letter-spacing:.02em}
  .wm-lab.next{fill:#ffeec2; font-size:6.8px; letter-spacing:.02em}
  .terr-core{fill:rgba(127,224,182,.1)}
  .ss-lb{font-size:5.4px; fill:rgba(220,225,245,.5); text-anchor:middle; letter-spacing:.06em}
  .ss-tgoal{fill:#f6d98a; opacity:.92; animation:wpulse 2.6s ease-in-out infinite}
  .ss-tgoal-halo{fill:none; stroke:#f6d98a; stroke-width:.7; opacity:.4}
  .ss-tgoal.own{fill:#3fe0a0; opacity:1; animation:none}
  .ss-tgoal-halo.own{stroke:#3fe0a0; opacity:.55}
  .fmap .ss-tgoal{fill:#ffe6a8}
  .fmap .ss-tgoal.own{fill:#5ff0b4}
  .ss-orbits .ss-orb{stroke-dasharray:1.4 5.2}
  .sp-cons{stroke:rgba(160,200,255,.3); stroke-width:.5; fill:none}
  .sp-star{fill:#fff}
  .sp-halo{fill:rgba(180,215,255,.16)}
  .sp-cn{font-size:5px; fill:rgba(180,205,255,.45); letter-spacing:.12em}
  @keyframes wpulse{0%,100%{opacity:.45}50%{opacity:1}}

  .wmap-hud .wbar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,#3fae83,#c7f5b0); transition:width .9s cubic-bezier(.2,.8,.2,1)}

    .wmap-hud .wpct{font-size:22px; margin:0}

  /* 전장 배경 세계지도 · 영토 잠식 (시인성 강화) */
  .fmap{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#0c2531}
  .fmap .wmsvg{width:100%; height:100%; display:block}
  .fmap .wm-c{fill:rgba(56,90,108,.97); stroke:rgba(150,205,225,.42); stroke-width:.4; vector-effect:non-scaling-stroke}
  .fmap .wm-grat path{fill:none; stroke:rgba(150,215,235,.17); stroke-width:.5; vector-effect:non-scaling-stroke}
  .fmap .wm-tgtlayer .wm-c{fill:none; stroke:none}
  .fmap .wm-tgtlayer .wm-c.tgt{fill:rgba(255,198,78,.20); stroke:#ffe9b0; stroke-width:1.8; stroke-opacity:1;
    vector-effect:non-scaling-stroke}
  .fmap .wm-tgtlayer{animation:tgtbreath 2.4s ease-in-out infinite}
  @keyframes tgtbreath{0%,100%{opacity:.6}50%{opacity:1}}
  .fmap .wm-ownlayer .wm-c{fill:none; stroke:none}
  .fmap .wm-ownlayer .wm-c.own{fill:rgba(46,224,148,.55); stroke:rgba(205,255,232,.9); stroke-width:1.6; stroke-opacity:.95;
    vector-effect:non-scaling-stroke}
  .fmap.fmap-solar, .fmap.fmap-space{background:#05060a}
  .fmap.fmap-space .wmsvg, .fmap.fmap-solar .wmsvg{opacity:1}
  .fmap .wm-mark{font-size:13px}

  /* 영토 잠식 링 · 파동 · 스캔 라인 */
  .terr-fill{fill:rgba(46,224,148,.09); stroke:none}
  .terr-ring{fill:none; stroke:#8effc8; stroke-width:2.2; stroke-dasharray:7 9; vector-effect:non-scaling-stroke;
    animation:terrspin 9s linear infinite}
  .terr-ring.alt{stroke:#ffe9b0; stroke-width:1.5; stroke-dasharray:3 14; opacity:.9; animation:terrspin 5s linear infinite reverse}
  @keyframes terrspin{to{stroke-dashoffset:-160}}
  .terr-scan{fill:none; stroke:rgba(200,255,230,.5); stroke-width:1; stroke-dasharray:1 22; vector-effect:non-scaling-stroke;
    animation:terrspin 3.2s linear infinite}
  .terr-fx{pointer-events:none}
  .terr-wave{fill:none; stroke:#d6fff0; stroke-width:3; vector-effect:non-scaling-stroke;
    transform-box:fill-box; transform-origin:center; animation:terrwave .95s ease-out forwards}
  @keyframes terrwave{0%{transform:scale(1); opacity:.95}100%{transform:scale(1.6); opacity:0}}
  .terr-pin{font-size:8px; text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:rgba(0,0,0,.85); stroke-width:2.4px; stroke-linejoin:round}
  .terr-flash{position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 40%, rgba(46,224,148,.5), rgba(46,224,148,.12) 38%, transparent 66%)}
  .terr-flash.go{animation:terrflash .62s ease-out}
  @keyframes terrflash{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}

  .terr-hud{position:absolute; left:14px; top:12px; z-index:6; min-width:126px; max-width:190px;
    padding:8px 12px 9px; border-radius:12px;
    background:linear-gradient(180deg,rgba(6,28,23,.86),rgba(4,14,12,.74));
    border:1px solid rgba(90,240,180,.5);
    box-shadow:0 0 24px -8px rgba(46,224,148,.85), inset 0 0 20px -12px rgba(46,224,148,.95);
    transition:transform .18s, box-shadow .18s}
  .terr-hud.bump{transform:scale(1.06); box-shadow:0 0 30px -4px rgba(46,224,148,1)}
  .terr-hud .th-top{display:flex; align-items:baseline; gap:6px}
  .terr-hud .th-k{font-size:8px; letter-spacing:.16em; color:#8fe6bb}
  .terr-hud b{font-family:var(--serif); font-size:19px; line-height:1; color:#c9ffe0;
    text-shadow:0 0 14px rgba(46,224,148,.9); font-variant-numeric:tabular-nums}
  .terr-hud .th-bar{height:4px; margin-top:6px; border-radius:3px; background:rgba(255,255,255,.16); overflow:hidden}
  .terr-hud .th-bar i{display:block; height:100%; border-radius:3px;
    background:linear-gradient(90deg,#2ee094,#ffe9b0); box-shadow:0 0 9px rgba(46,224,148,.95); transition:width .45s}
  .terr-hud .th-tgt{margin-top:5px; font-size:8.5px; letter-spacing:.02em; color:#ffe9b0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wm-flag{font-size:12px; text-anchor:middle; animation:flagpop .8s cubic-bezier(.2,1.4,.4,1)}
  @keyframes flagpop{0%{opacity:0; transform:translateY(8px) scale(.4)}60%{opacity:1; transform:translateY(0) scale(1.25)}100%{transform:scale(1)}}

  /* 출격 준비 · 목표 영토 미리보기 */
  .btarget-row{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:14px; margin:0 0 14px}
  .btarget-map{position:relative; aspect-ratio:16/9; border:1px solid rgba(246,230,189,.28); border-radius:14px;
    overflow:hidden; background:#0c2531; box-shadow:inset 0 0 46px -14px rgba(0,0,0,.9)}
  .btarget-map .wmsvg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .btarget-map .wm-grat path{fill:none; stroke:rgba(150,215,235,.15); stroke-width:.5; vector-effect:non-scaling-stroke}
  .bm-base .wm-c{fill:rgba(74,112,132,.97); stroke:rgba(158,208,228,.46); stroke-width:.4; vector-effect:non-scaling-stroke}
  .bm-own .wm-c{fill:none; stroke:none}
  .bm-own .wm-c.own{fill:rgba(46,224,148,.78); stroke:#d8ffe9; stroke-width:.9; stroke-opacity:.95;
    vector-effect:non-scaling-stroke}
  .bm-tgt .wm-c{fill:none; stroke:none}
  .bm-tgt .wm-c.tgt{fill:rgba(255,200,84,.8); stroke:#fff3c4; stroke-width:2.2; stroke-opacity:1;
    vector-effect:non-scaling-stroke}
  .bm-tgt{animation:tgtbreath 2.2s ease-in-out infinite}
  .tp-halo{fill:rgba(255,214,120,.2)}
  .tp-ring{fill:none; stroke:#ffe9b0; stroke-width:2.2; vector-effect:non-scaling-stroke; opacity:.95;
    transform-box:fill-box; transform-origin:center;
    animation:tpping 2s ease-out infinite}
  .tp-r2{animation-delay:.55s}
  @keyframes tpping{0%{transform:scale(.55); opacity:1}100%{transform:scale(1.6); opacity:0}}
  .tp-flag{text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:rgba(0,0,0,.75); stroke-width:2px}
  .btm-badge{position:absolute; left:10px; top:10px; z-index:3; display:flex; align-items:baseline; gap:5px;
    padding:5px 11px; border-radius:999px; font-size:10px; letter-spacing:.02em; color:#ffeec2;
    background:rgba(8,14,12,.82); border:1px solid rgba(246,230,189,.55);
    box-shadow:0 0 20px -6px rgba(246,230,189,.95)}
  .btm-badge b{font-family:var(--serif); font-size:11.5px; color:#fff8e4}
  .btm-legend{position:absolute; right:9px; bottom:9px; z-index:3; display:flex; gap:10px; align-items:center;
    font-size:8.5px; letter-spacing:.02em; color:#d6ded6; background:rgba(6,10,12,.72); padding:4px 10px;
    border-radius:999px; border:1px solid rgba(255,255,255,.12)}
  .btm-legend span{display:inline-flex; align-items:center; white-space:nowrap}
  .btm-legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}
  .btm-legend .l-own{background:#2ee094; box-shadow:0 0 7px rgba(46,224,148,.9)}
  .btm-legend .l-tgt{background:#e8b64e; box-shadow:0 0 7px rgba(255,214,120,.95)}
  .btm-side{border:1px solid var(--line2); border-radius:14px; padding:13px 15px; background:rgba(255,255,255,.02);
    display:flex; flex-direction:column; gap:5px; min-width:0}
  .btm-side h4{margin:2px 0 0; font-family:var(--serif); font-size:13px; font-weight:600; color:#f4ebd9}
  .btm-goal{font-family:var(--serif); font-size:19px; line-height:1.25; color:#ffe9b0;
    text-shadow:0 0 18px rgba(255,214,120,.5); overflow-wrap:anywhere}
  .btm-desc{margin:2px 0 0; font-size:10.5px; line-height:1.6; color:#8d8778}
  .btm-desc b{color:#e9e0cd}
  .btm-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
  .btm-chip{font-size:9px; padding:2px 8px; border-radius:999px; color:#ffeec2; background:rgba(232,182,78,.14);
    border:1px solid rgba(246,230,189,.42); white-space:nowrap}
  .btm-chip.own{color:#c9ffe0; background:rgba(46,224,148,.14); border-color:rgba(46,224,148,.5)}
  .btm-meter{height:5px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:auto}
  .btm-meter i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,#2ee094,#ffe9b0)}
  .btm-row{display:flex; justify-content:space-between; gap:8px; font-size:10.5px; color:#8e8a7d}
  .btm-row b{color:#e9e0cd; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  @media (max-width:820px){
    .btarget-row{grid-template-columns:1fr}
    .btm-side{padding:11px 13px}
  }

  /* ───── 궁극기 이펙트 ───── */
  .ultfx{position:absolute; inset:0; z-index:7; pointer-events:none}
  .shock{position:absolute; left:50%; top:36%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
    border:2px solid #ffe9a8; box-shadow:0 0 34px rgba(255,233,168,.85), inset 0 0 22px rgba(255,233,168,.45);
    animation:shockwave .95s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes shockwave{0%{transform:scale(.25); opacity:0}12%{opacity:1}100%{transform:scale(11); opacity:0}}
  .spark{position:absolute; left:50%; top:36%; width:5px; height:5px; border-radius:50%; background:#ffd98a;
    box-shadow:0 0 10px currentColor; animation:sparkfly .9s ease-out forwards}
  @keyframes sparkfly{0%{transform:translate(0,0) scale(1.2); opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.15); opacity:0}}
  .flash{position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 38%, #fff 0%, rgba(255,246,220,.55) 30%, transparent 68%)}
  .flash.go{animation:flashgo .52s ease-out}
  @keyframes flashgo{0%{opacity:0}14%{opacity:.95}100%{opacity:0}}
  .cut-in{display:flex; align-items:center; justify-content:center; gap:16px}
  .cut-face{position:relative; flex:0 0 72px; width:72px; height:72px; border-radius:50%; overflow:hidden;

  .cut-face .ph-img{object-fit:cover; object-position:top center}

  .bu.hit-glow{animation:glowhit .62s ease-out}
  @keyframes glowhit{0%{box-shadow:0 0 0 2px #fff, 0 0 42px rgba(255,233,168,.95); filter:brightness(1.7)}100%{box-shadow:none; filter:none}}
  @media (max-width:640px){

  /* 캠페인 필터 탭 */

  .bfil b{font-family:var(--serif); font-weight:600; margin-left:3px; color:var(--gold-hi); opacity:.8}
  .bmap{grid-template-columns:repeat(5,minmax(0,1fr))}

  @media (max-width:820px){ .bmap{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:560px){ .bmap{grid-template-columns:repeat(2,minmax(0,1fr))} }


  /* ───── 카드 수동 진화 ───── */

    background:rgba(255,255,255,.03);
  }
  .arc-card .evo-mini.ready{
    color:#1a1206; font-weight:700; border-color:transparent;
    background:linear-gradient(100deg,#f6e6bd,#c8a86a 50%,#f6e6bd);
    animation:evoPulse 1.9s ease-in-out infinite;
  }
  .evolve-box{border:1px solid var(--line2); border-radius:12px; padding:14px 15px; background:rgba(255,255,255,.02)}

  .evo-btn{
    margin-top:12px; width:100%; border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:11px;

  /* ═════════ 전투 점령 지도 (전투 화면 맨 위 · 가로 전체) ═════════ */
  .field{padding:14px 14px 18px}
  .b-tmap{
    position:relative; width:100%; height:124px; margin:2px 0 12px;
    border-radius:14px; overflow:hidden; background:#0a1f2b;
    border:1px solid rgba(246,230,189,.42);
    box-shadow:0 16px 30px -26px #000, 0 0 0 1px rgba(46,224,148,.14) inset;
    contain:layout paint;
  }
  .b-tmap .fmap{
    position:absolute; inset:0; left:0; right:0; top:0; bottom:0; width:auto; height:auto;
    border:0; border-radius:0; box-shadow:none; z-index:1; background:#0a1f2b;
  }
  .b-tmap .fmap .wmsvg{width:100%; height:100%; display:block}
  /* 지도 위를 훑고 지나가는 점령 스캔 광선 (GPU transform 만 사용) */
  .b-tmap .btm-sweep{
    position:absolute; top:0; bottom:0; left:0; width:34%; z-index:3; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(46,224,148,.10) 38%, rgba(205,255,232,.22) 50%, rgba(46,224,148,.10) 62%, transparent);
    animation:btSweep 5.6s linear infinite;
  }
  @keyframes btSweep{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
  .btm-head{
    position:absolute; left:0; right:0; top:0; z-index:6; display:flex; align-items:center; gap:7px;
    padding:5px 10px 15px; pointer-events:none;
    background:linear-gradient(180deg, rgba(4,12,16,.95), rgba(4,12,16,.55) 58%, rgba(4,12,16,0));
    font-size:8.5px; letter-spacing:.12em; color:#8fe6bb;
  }
  .btm-head .btm-k{white-space:nowrap; color:#8fe6bb}
  .btm-head .btm-goal{
    font-family:var(--serif); font-size:12px; letter-spacing:0; color:#ffe9b0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:48%;
  }
  .btm-head .btm-rank{margin-left:auto; white-space:nowrap; color:#9fe8c2; letter-spacing:.1em}
  .btm-head .btm-pct{
    min-width:44px; text-align:right; font-family:var(--serif); font-size:16px; line-height:1;
    letter-spacing:0; color:#c9ffe0; font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(46,224,148,.55);
  }
  .btm-pct.pop{animation:pctPop .5s ease-out}
  @keyframes pctPop{0%{transform:scale(1)}32%{transform:scale(1.2); color:#fff}100%{transform:scale(1)}}
  .btm-foot{
    position:absolute; left:0; right:0; bottom:0; z-index:6; display:flex; align-items:center; gap:8px;
    padding:12px 10px 6px; pointer-events:none;
    background:linear-gradient(0deg, rgba(4,12,16,.94), rgba(4,12,16,.5) 55%, rgba(4,12,16,0));
  }
  .btm-foot .btm-lab{font-size:8px; letter-spacing:.14em; color:#8fe6bb; white-space:nowrap}
  .btm-foot .btm-bar{
    position:relative; flex:1 1 auto; height:6px; border-radius:3px; overflow:hidden;
    background:rgba(255,255,255,.16); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .btm-foot .btm-bar i{
    display:block; height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#1fc47c,#2ee094 46%,#c7ffdf 76%,#ffe9b0);
    box-shadow:0 0 12px rgba(46,224,148,.8); transition:width .4s ease-out;
  }
  .btm-foot .btm-num{font-size:9px; color:#c9ffe0; letter-spacing:.04em; white-space:nowrap; font-variant-numeric:tabular-nums}
  /* 전장 배경용 흐린 지도 (점령 지도가 위로 올라간 자리) */
  .fghost{position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.15}
  .fghost svg{width:100%; height:100%; display:block}
  .fghost .wm-c{fill:rgba(74,112,132,.95); stroke:rgba(158,208,228,.5); stroke-width:.4; vector-effect:non-scaling-stroke}
  .fghost .wm-tgtlayer .wm-c.tgt{fill:rgba(255,198,78,.55); stroke:#ffe9b0; stroke-width:1.6; vector-effect:non-scaling-stroke}
  .fghost .wm-ownlayer .wm-c.own{fill:rgba(46,224,148,.5); stroke:#cfffe6; stroke-width:1.2; vector-effect:non-scaling-stroke}
  /* 점령 영토: 이미 먹은 땅은 늘 에메랄드, 이번 전선은 물결 따라 채워진다 */
  .wm-cap .wm-c.cap{fill:rgba(46,224,148,.66); stroke:rgba(198,255,228,.55); stroke-width:1; vector-effect:non-scaling-stroke}
  .terr-front text{
    font-size:12px; text-anchor:middle; dominant-baseline:middle;
    paint-order:stroke; stroke:rgba(2,12,8,.9); stroke-width:2.2px; stroke-linejoin:round;
    animation:frontBob 2.2s ease-in-out infinite;
  }
  .terr-front text:nth-child(2){animation-delay:.5s}
  .terr-front text:nth-child(3){animation-delay:1s}
  @keyframes frontBob{0%,100%{opacity:.82; transform:translateY(0)}50%{opacity:1; transform:translateY(-1px)}}
  @media (max-width:640px){
    .b-tmap{height:106px; margin:0 0 9px; border-radius:12px}
    .btm-head{padding:4px 8px 13px; font-size:7.5px; gap:5px}
    .btm-head .btm-goal{font-size:10.5px; max-width:42%}
    .btm-head .btm-pct{font-size:14px; min-width:38px}
    .btm-head .btm-rank{font-size:7px}
    .btm-foot{padding:10px 8px 5px; gap:6px}
    .btm-foot .btm-lab{font-size:7px}
    .btm-foot .btm-num{font-size:8px}

  /* 전투 스킬 4개(3스킬+궁극기) */
  .sk-btns.four{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* ═════════ 초월 소환 연출 · 3막 (암전 → 마법진 → 강림) ═════════
     모든 연출은 transform / opacity 기반(GPU 가속)으로만 움직인다. */
  .summon{position:fixed; inset:0; z-index:120; display:grid; place-items:center; background:#010103;
    opacity:0; pointer-events:none; transition:opacity .26s ease; overflow:hidden; cursor:pointer; will-change:opacity; contain:layout paint}
  .summon.on{opacity:1; pointer-events:auto}
  .summon[hidden]{display:none}

  /* ── 1막 (0 ~ 1.0s) : 암전 · 섬광 맥동 · 균열 · 12방향 빛줄기 ── */
  .sm-dark{position:absolute; inset:0; z-index:0; opacity:0;
    background:radial-gradient(circle at 50% 46%, #15151c 0%, #06060a 40%, #000 76%);
    animation:smDark 4.7s linear both}
  @keyframes smDark{0%{opacity:0}7%{opacity:1}52%{opacity:1}62%{opacity:.5}100%{opacity:.38}}
  .sm-pulse{position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 46%, #fff 0%, rgba(255,255,255,.6) 24%, rgba(255,255,255,.06) 56%, transparent 76%)}
  .sm-pulse.p1{animation:smPulse .34s .04s ease-out both}
  .sm-pulse.p2{animation:smPulse .36s .40s ease-out both}
  @keyframes smPulse{0%{opacity:0; transform:scale(.94)}38%{opacity:.95; transform:scale(1)}100%{opacity:0; transform:scale(1.03)}}
  .sm-rays{position:absolute; left:50%; top:50%; width:0; height:0; z-index:1; pointer-events:none;
    animation:smRays 3s cubic-bezier(.16,.82,.24,1) both}
  .sm-rays i{position:absolute; left:0; top:0; width:1.6px; height:78vmax; margin-left:-.8px; transform-origin:0 0;
    transform:rotate(calc(var(--i) * 30deg)); opacity:0;
    background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 26%, rgba(255,255,255,.08) 58%, transparent 88%);
    box-shadow:0 0 14px rgba(255,255,255,.45);
    animation:smRayOn .5s cubic-bezier(.2,.8,.3,1) both; animation-delay:calc(.12s + var(--i) * .035s)}
  @keyframes smRayOn{from{opacity:0}to{opacity:.85}}
  @keyframes smRays{0%{transform:rotate(-10deg) scale(.12); opacity:0}
    10%{opacity:.95}38%{opacity:.6}62%{transform:rotate(16deg) scale(.94); opacity:.32}
    100%{transform:rotate(30deg) scale(1.1); opacity:0}}
  .sm-crack{position:absolute; left:50%; top:50%; width:2px; z-index:2; pointer-events:none;
    background:linear-gradient(180deg,transparent, #fff 6%, #fff 94%, transparent);
    box-shadow:0 0 26px rgba(255,255,255,.95), 0 0 72px rgba(255,255,255,.5);

  .rarity-chip.im-fill{

  .immortal-text{
    background:linear-gradient(100deg,#ff2d55,#ffb020 38%,#fff7cc 50%,#ffd60a 62%,#ff2d55);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent!important; -webkit-text-fill-color:transparent;

     성능: transform / opacity / background-position 만 애니메이션 (60fps, blur 없음) */
  @keyframes imBorderFlow{0%{background-position:0 0,0% 50%}100%{background-position:0 0,100% 50%}}
  @keyframes imShine{0%{transform:translateX(-98%)}58%{transform:translateX(98%)}100%{transform:translateX(98%)}}
  @keyframes imTwinkle{0%,100%{opacity:.25; transform:translate3d(0,0,0)}50%{opacity:.95; transform:translate3d(0,-1.5px,0)}}

      linear-gradient(112deg,#ffd60a 0%,#ff2d55 18%,#fff7cc 36%,#ffd60a 52%,#ff2d55 72%,#fff7cc 88%,#ffd60a 100%);
    background-origin:border-box; background-clip:padding-box,border-box;

    animation:imBorderFlow 6s linear infinite;
    box-shadow:0 0 0 1px rgba(255,214,10,.3), 0 0 22px -4px rgba(255,45,85,.8), 0 0 48px -14px rgba(255,214,10,.95), 0 18px 34px -22px #000;

  /* ⚡ 합성 성공 확률 5% 경고 — 실패하면 재료가 사라진다 */
  .fu-risk{

  }

  /* ═════════════════════════════════════════════
     💥 합성 실패 연출 (3초 · 탭 스킵)
     ═════════════════════════════════════════════ */
  .fusefail{position:fixed; inset:0; z-index:131; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(circle at 50% 52%, #1a1114 0%, #0a0709 52%, #040304 100%);
    opacity:0; transition:opacity .3s}
  .fusefail[hidden]{display:none}
  .fusefail.on{opacity:1}
  .fusefail>*{position:absolute}
  .fx-flash{inset:0; background:#fff3e0; opacity:0}
  .fusefail.on .fx-flash{animation:fxFlash 1.1s ease-out both}
  @keyframes fxFlash{0%{opacity:0}8%{opacity:.85}100%{opacity:0}}
  .fx-core{left:50%; top:44%; transform:translate(-50%,-50%); font-size:64px; opacity:0;
    filter:drop-shadow(0 0 26px rgba(255,140,20,.9))}
  .fusefail.on .fx-core{animation:fxCore 1.5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes fxCore{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.18)}
    55%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-58%) scale(1.06)}}
  .fx-smoke{left:50%; top:46%; width:0; height:0}
  .fx-smoke i{position:absolute; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%;
    background:radial-gradient(circle, rgba(190,190,200,.5), rgba(120,120,135,.14) 58%, transparent 72%);
    opacity:0; filter:blur(4px)}
  .fusefail.on .fx-smoke i{animation:fxSmoke 2.4s ease-out both}
  .fusefail.on .fx-smoke i:nth-child(1){--tx:-90px; --ty:-40px; animation-delay:.06s}
  .fusefail.on .fx-smoke i:nth-child(2){--tx:80px; --ty:-70px; animation-delay:.12s}
  .fusefail.on .fx-smoke i:nth-child(3){--tx:-40px; --ty:-120px; animation-delay:.02s}
  .fusefail.on .fx-smoke i:nth-child(4){--tx:120px; --ty:-20px; animation-delay:.18s}
  .fusefail.on .fx-smoke i:nth-child(5){--tx:20px; --ty:-140px; animation-delay:.09s}
  .fusefail.on .fx-smoke i:nth-child(6){--tx:-130px; --ty:-90px; animation-delay:.2s}
  .fusefail.on .fx-smoke i:nth-child(7){--tx:60px; --ty:-150px; animation-delay:.14s}
  .fusefail.on .fx-smoke i:nth-child(8){--tx:-70px; --ty:-160px; animation-delay:.24s}
  .fusefail.on .fx-smoke i:nth-child(9){--tx:150px; --ty:-100px; animation-delay:.26s}
  .fusefail.on .fx-smoke i:nth-child(10){--tx:0px; --ty:-190px; animation-delay:.3s}
  @keyframes fxSmoke{0%{opacity:0; transform:translate(0,0) scale(.5)}
    22%{opacity:.85; transform:translate(calc(var(--tx) * .35), calc(var(--ty) * .35)) scale(1.1)}
    100%{opacity:0; transform:translate(var(--tx), var(--ty)) scale(1.9)}}
  .fx-shards{left:50%; top:44%; width:0; height:0}
  .fx-shards i{position:absolute; width:9px; height:9px; margin:-4px 0 0 -4px; background:#a855f7;
    box-shadow:0 0 12px rgba(168,85,247,.9); opacity:0}
  .fusefail.on .fx-shards i{animation:fxShard 1.9s ease-out both}
  .fusefail.on .fx-shards i:nth-child(1){--sx:-120px; --sy:70px; animation-delay:.1s; background:#ef4444}
  .fusefail.on .fx-shards i:nth-child(2){--sx:110px; --sy:50px; animation-delay:.16s}
  .fusefail.on .fx-shards i:nth-child(3){--sx:-60px; --sy:-90px; animation-delay:.08s; background:#22c55e}
  .fusefail.on .fx-shards i:nth-child(4){--sx:70px; --sy:-80px; animation-delay:.2s}
  .fusefail.on .fx-shards i:nth-child(5){--sx:-150px; --sy:-10px; animation-delay:.24s}
  .fusefail.on .fx-shards i:nth-child(6){--sx:140px; --sy:100px; animation-delay:.14s; background:#ef4444}
  @keyframes fxShard{0%{opacity:0; transform:translate(0,0) rotate(0)}
    16%{opacity:1}100%{opacity:0; transform:translate(var(--sx), var(--sy)) rotate(220deg)}}
  .fx-msg{left:0; right:0; top:calc(58% + 40px); text-align:center; padding:0 22px; opacity:0}
  .fusefail.on .fx-msg{animation:fxMsg .8s ease-out .35s both}
  @keyframes fxMsg{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
  .fx-msg b{display:block; font-family:var(--serif); font-size:clamp(20px,5.4vw,30px); color:#ffb4a8;
    text-shadow:0 0 20px rgba(239,68,68,.8)}
  .fx-msg em{display:block; margin-top:7px; font-style:normal; font-size:12px; letter-spacing:.04em; color:#c9a3ff}
  .fx-msg span{display:block; margin-top:9px; font-size:12.5px; line-height:1.6; color:#e7dcc9; word-break:keep-all}
  .fx-tip{left:0; right:0; bottom:calc(12% + env(safe-area-inset-bottom, 0px)); text-align:center;
    font-size:10px; letter-spacing:.14em; color:rgba(255,240,205,.4)}
  @media (prefers-reduced-motion: reduce){
    .fu-risk{animation:none}
    .fusefail.on .fx-flash,.fusefail.on .fx-core,.fusefail.on .fx-smoke i,.fusefail.on .fx-shards i{animation-duration:.3s}
  }

  /* ═════════════════════════════════════════════
     🔥 불멸 강림 연출 (5초 · 탭 스킵)
     ═════════════════════════════════════════════ */
  .fusefx{position:fixed; inset:0; z-index:130; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(circle at 50% 52%, #2a0704 0%, #140302 46%, #050202 100%); opacity:0; transition:opacity .35s}
  .fusefx[hidden]{display:none}
  .fusefx.on{opacity:1}
  .fusefx>*{position:absolute}
  .ff-void{inset:0; background:radial-gradient(circle at 50% 50%, rgba(255,120,20,.16), transparent 62%)}
  .ff-aura{left:50%; top:50%; translate:-50% -50%; width:78vmin; height:78vmin; border-radius:50%; filter:blur(26px); opacity:0}
  .ff-aura.a1{background:radial-gradient(circle, rgba(255,59,48,.75), transparent 66%); animation:ffAura 5s ease-in-out infinite}
  .ff-aura.a2{background:radial-gradient(circle, rgba(255,214,10,.55), transparent 64%); animation:ffAura 5s ease-in-out .7s infinite}
  @keyframes ffAura{0%,100%{opacity:.25; transform:scale(.86)}50%{opacity:.85; transform:scale(1.08)}}
  .ff-ring{left:50%; top:50%; translate:-50% -50%; border-radius:50%; border:2px solid rgba(255,214,10,.65); opacity:0; transform:scale(.2)}
  .ff-ring.r1{width:52vmin; height:52vmin; animation:ffRing 5s ease-out .2s infinite}
  .ff-ring.r2{width:66vmin; height:66vmin; border-color:rgba(255,59,48,.6); animation:ffRing 5s ease-out 1s infinite}
  .ff-ring.r3{width:80vmin; height:80vmin; border-style:dashed; animation:ffRing 5s ease-out 1.9s infinite}
  @keyframes ffRing{0%{opacity:0; transform:scale(.2) rotate(0)}18%{opacity:.9}100%{opacity:0; transform:scale(1.15) rotate(140deg)}}
  .ff-flames{inset:0; display:block}
  .ff-flames i{position:absolute; bottom:-12vmin; width:16vmin; height:34vmin; border-radius:50% 50% 42% 42%;
    background:linear-gradient(180deg, rgba(255,214,10,.9), rgba(255,59,48,.75) 52%, transparent 92%);
    filter:blur(7px); opacity:0; animation:ffFlame 5s ease-in-out infinite}
  .ff-flames i:nth-child(1){left:6%; animation-delay:.1s}
  .ff-flames i:nth-child(2){left:19%; animation-delay:.5s; height:26vmin}
  .ff-flames i:nth-child(3){left:32%; animation-delay:.9s}
  .ff-flames i:nth-child(4){left:45%; animation-delay:.3s; height:40vmin}
  .ff-flames i:nth-child(5){left:58%; animation-delay:.8s}
  .ff-flames i:nth-child(6){left:70%; animation-delay:.2s; height:28vmin}
  .ff-flames i:nth-child(7){left:82%; animation-delay:.6s}
  .ff-flames i:nth-child(8){left:92%; animation-delay:1.1s; height:24vmin}
  @keyframes ffFlame{0%{opacity:0; transform:translateY(4vmin) scale(.8)}25%{opacity:.85}60%{opacity:.5}100%{opacity:0; transform:translateY(-16vmin) scale(1.1)}}
  .ff-sparks{inset:0}
  .ff-sparks i{position:absolute; left:50%; top:50%; width:5px; height:5px; border-radius:50%;
    background:#ffe9a8; box-shadow:0 0 10px 3px rgba(255,180,40,.9); opacity:0; animation:ffSpark 5s linear infinite}
  .ff-sparks i:nth-child(1){--dx:-38vmin; --dy:-24vmin; animation-delay:.2s}
  .ff-sparks i:nth-child(2){--dx:34vmin; --dy:-30vmin; animation-delay:.5s}
  .ff-sparks i:nth-child(3){--dx:-26vmin; --dy:30vmin; animation-delay:.8s}
  .ff-sparks i:nth-child(4){--dx:42vmin; --dy:22vmin; animation-delay:1.1s}
  .ff-sparks i:nth-child(5){--dx:-48vmin; --dy:4vmin; animation-delay:1.4s}
  .ff-sparks i:nth-child(6){--dx:48vmin; --dy:-6vmin; animation-delay:1.7s}
  .ff-sparks i:nth-child(7){--dx:-14vmin; --dy:-40vmin; animation-delay:2s}
  .ff-sparks i:nth-child(8){--dx:16vmin; --dy:40vmin; animation-delay:2.3s}
  .ff-sparks i:nth-child(9){--dx:-34vmin; --dy:26vmin; animation-delay:2.6s}
  .ff-sparks i:nth-child(10){--dx:30vmin; --dy:32vmin; animation-delay:2.9s}
  .ff-sparks i:nth-child(11){--dx:0vmin; --dy:-34vmin; animation-delay:3.2s}
  .ff-sparks i:nth-child(12){--dx:-20vmin; --dy:-10vmin; animation-delay:3.4s}
  @keyframes ffSpark{0%{opacity:0; transform:translate(0,0) scale(.4)}12%{opacity:1}60%{opacity:.8}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  .ff-beam{left:50%; top:50%; translate:-50% -50%; width:2px; height:0; background:linear-gradient(180deg,transparent,#fff3c4,#ffb020,transparent);
    box-shadow:0 0 26px 10px rgba(255,180,40,.75); animation:ffBeam 5s ease-out}
  @keyframes ffBeam{0%{height:0; opacity:0}18%{height:86vmin; opacity:1}62%{height:86vmin; opacity:.85}100%{height:86vmin; opacity:0}}
  .ff-core{left:50%; top:50%; translate:-50% -50%; width:16vmin; height:16vmin; border-radius:50%;
    background:radial-gradient(circle, #fff8d8 0%, #ffd60a 38%, #ff3b30 72%, transparent 82%);
    filter:blur(3px); animation:ffCore 5s ease-in-out}
  @keyframes ffCore{0%{transform:scale(0); opacity:0}22%{transform:scale(.5); opacity:.9}55%{transform:scale(1); opacity:1}100%{transform:scale(2.4); opacity:0}}
  .ff-boom{left:50%; top:44%; translate:-50% -50%; width:10vmin; height:10vmin; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,214,10,.8) 36%, rgba(255,59,48,.5) 62%, transparent 76%);
    opacity:0; animation:ffBoom 5s ease-out}
  @keyframes ffBoom{0%,40%{opacity:0; transform:scale(.2)}46%{opacity:1; transform:scale(4.2)}60%{opacity:0; transform:scale(6.4)}100%{opacity:0}}
  .ff-portrait{
    left:50%; top:41%; translate:-50% -50%;
    width:min(46vmin,340px); aspect-ratio:3/4; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,214,10,.8); background:#0a0403;
    box-shadow:0 0 60px -10px rgba(255,120,20,1), 0 0 0 1px rgba(255,59,48,.5);
    opacity:0; transform:translateY(6vmin) scale(.92); animation:ffPortrait 5s cubic-bezier(.2,.9,.2,1)
  }
  .ff-portrait .ph-svg,.ff-portrait .ph-img{width:100%; height:100%; object-fit:cover; display:block}
  @keyframes ffPortrait{0%,34%{opacity:0; transform:translateY(6vmin) scale(.92)}52%{opacity:1; transform:translateY(0) scale(1)}100%{opacity:1; transform:translateY(0) scale(1.02)}}
  .ff-name{left:50%; top:74%; translate:-50% -50%; width:min(86vmin,560px); display:flex; flex-direction:column; align-items:center; gap:6px;
    opacity:0; animation:ffName 5s ease-out; text-align:center}
  @keyframes ffName{0%,50%{opacity:0; transform:translateY(10px)}64%{opacity:1; transform:translateY(0)}100%{opacity:1}}

  .ff-badge{left:50%; translate:-50% 0; top:8%; font-size:11px; letter-spacing:.24em; padding:7px 16px; border-radius:999px;

    box-shadow:0 0 22px -6px rgba(255,120,20,1); opacity:0; animation:ffName 5s ease-out}
  .ff-tip{bottom:5%; font-size:10px; letter-spacing:.14em; color:rgba(255,230,180,.55)}

  /* ═════════════════════════════════════════════
     🗼 무한의 탑 · 📋 덱 프리셋
     ═════════════════════════════════════════════ */
  .bch.tower{border-color:rgba(255,154,42,.55); background:linear-gradient(150deg,rgba(255,59,48,.16),rgba(255,214,10,.05))}

  .bpre.on{border-color:rgba(200,168,106,.75); color:#ffe0a8; background:rgba(200,168,106,.16)}
  .bpre.on em{color:#e2c276}

  /* ── ⚔️ 전용 아이템 뽑기(유물 소환) ── */
  .relic-entry{

  .relic-entry .re-tx i{display:block; font-style:normal; font-size:10px; color:#cfc3aa; margin-top:2px}

  .rl-sheet{width:min(920px,100%)}
  .rl-wrap{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr); gap:20px; align-items:start}
  .rl-bal{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:14px}
  .rl-bal div{text-align:center; min-width:76px}
  .rl-bal span{display:block; font-size:8.5px; letter-spacing:.14em; color:var(--muted2)}
  .rl-bal b{display:block; font-family:var(--serif); font-size:17px; color:var(--gold-hi); margin-top:3px}
  .rl-btns{display:grid; gap:9px}
  .rl-btns .btn-pack{width:100%; text-align:center}
  .rl-rates{font-size:10px; color:var(--muted2); line-height:1.75; margin:12px 0 0; text-align:center}
  .rl-rates b{color:var(--gold-hi); font-weight:600}
  .rl-reveal{margin-top:16px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:9px}
  .rl-card{
    position:relative; display:flex; flex-direction:column; gap:3px; padding:11px 11px 12px;
    border-radius:12px; overflow:hidden; text-align:left;

    background:linear-gradient(170deg, rgba(20,26,36,.96), rgba(9,12,17,.99));
    box-shadow:0 12px 26px -18px var(--rc,#000);
    animation:pop .5s cubic-bezier(.2,.9,.2,1) backwards;
  }

    background:radial-gradient(circle at 50% 0%, var(--rc,#9ca3af), transparent 62%)}
  .rl-card.new{box-shadow:0 0 0 1px var(--rc,#9ca3af), 0 0 26px -8px var(--rc,#9ca3af)}
  .rl-card .rc-tag{position:relative; z-index:1; align-self:flex-start; font-size:7.5px; letter-spacing:.1em;
    padding:2px 6px; border-radius:999px; border:1px solid var(--rc,#9ca3af); color:var(--rc,#9ca3af);
    background:rgba(6,8,12,.72)}
  .rl-card .rc-nm{position:relative; z-index:1; font-family:var(--serif); font-size:13px; color:#f4ecdd; line-height:1.32; margin-top:3px}
  .rl-card .rc-head{position:relative; z-index:1; display:flex; align-items:center; gap:8px; margin-top:5px}
  .rl-card .rc-ph{
    flex:0 0 36px; width:36px; height:36px; border-radius:50%; overflow:hidden; position:relative;
    border:1px solid var(--rc,#9ca3af); background:#0b0e13; box-shadow:0 0 12px -4px var(--rc,#9ca3af);
  }
  .rl-card .rc-ph .ph-svg,.rl-card .rc-ph .ph-img{position:absolute; inset:0; width:100%; height:100%}
  .rl-card .rc-ph .ph-img{object-fit:cover}

  .rl-card .rc-b{position:relative; z-index:1; font-size:9.5px; color:#7fe0a3; font-variant-numeric:tabular-nums; margin-top:2px}

  .rl-right{display:flex; flex-direction:column; gap:12px}
  .rl-show{position:relative; min-height:206px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; padding:18px; text-align:center; border-radius:16px; overflow:hidden;

    background:radial-gradient(circle at 50% 20%, rgba(200,168,106,.15), rgba(10,13,18,.98) 64%)}
  .rl-show .rs-tag{font-size:8.5px; letter-spacing:.22em; color:var(--gold-dim)}
  .rl-show .rs-nm{font-family:var(--serif); font-size:17px; color:#f7eedb; line-height:1.35}

  /* 유물 상자 오픈 연출 — 쿵! 번쩍! */
  .relicfx{position:fixed; inset:0; z-index:225; display:block; cursor:pointer; overflow:hidden;
    -webkit-tap-highlight-color:transparent; --rc:#ecd9a8}
  .relicfx[hidden]{display:none}
  .rf-bg{position:absolute; inset:0; opacity:0; transition:opacity .16s;
    background:radial-gradient(circle at 50% 48%, #241a0d 0%, #0e0b07 44%, #040406 80%)}
  .relicfx.on .rf-bg{opacity:1}
  .rf-aura{position:absolute; inset:0; pointer-events:none; opacity:0; mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 48%, var(--rc) 0%, rgba(0,0,0,0) 54%); transition:opacity .3s}
  .relicfx.on .rf-aura{opacity:.42}
  .relicfx.open .rf-aura{opacity:.92; transition:opacity .2s}
  .rf-stage{position:absolute; inset:0}
  .rf-chest{position:absolute; left:50%; top:50%; width:min(46vmin,210px); height:min(40vmin,186px);
    margin-left:calc(min(46vmin,210px) / -2); margin-top:calc(min(40vmin,186px) / -2);
    perspective:820px; transform-style:preserve-3d;
    animation:rfDrop .46s cubic-bezier(.2,1.3,.4,1) both; filter:drop-shadow(0 18px 34px rgba(0,0,0,.7))}
  /* 상자가 열리면 입구에서 빛이 솟는다 */
  .rf-chest::after{content:""; position:absolute; left:4%; right:4%; top:33%; height:30%; border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,248,220,.98), rgba(255,214,120,.42) 46%, rgba(0,0,0,0) 74%);
    opacity:0; transition:opacity .22s; filter:blur(2px); pointer-events:none}
  .relicfx.open .rf-chest::after{opacity:1}
  .rf-chest .rf-lid{position:absolute; left:0; right:0; top:0; height:44%; border-radius:14px 14px 4px 4px;
    background:linear-gradient(180deg,#9a6a2c,#6b4315 62%,#4a2c0b);
    border:1px solid rgba(255,226,160,.45); transform-origin:50% 100%;
    box-shadow:inset 0 6px 12px -6px rgba(255,238,190,.7)}
  .rf-chest .rf-box{position:absolute; left:0; right:0; bottom:0; height:60%; border-radius:6px 6px 12px 12px;
    background:linear-gradient(180deg,#7d5220,#5a3510 58%,#3a220a);
    border:1px solid rgba(255,226,160,.4);
    box-shadow:inset 0 10px 18px -12px rgba(255,238,190,.55), inset 0 -14px 22px -14px rgba(0,0,0,.9)}
  .rf-chest .rf-band{position:absolute; left:44%; right:44%; top:0; bottom:0;
    background:linear-gradient(180deg,#f4e0b0,#c9a35e); opacity:.9}
  .rf-chest .rf-lock{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:15px; font-style:normal;
    filter:drop-shadow(0 0 8px rgba(255,236,180,.9))}
  .rf-chest .rf-ring{position:absolute; left:50%; top:58%; width:150%; height:64%; margin-left:-75%; margin-top:-32%;
    border-radius:50%; border:2px solid var(--rc); opacity:0}
  .relicfx.charge .rf-chest{animation:rfShake .09s linear infinite alternate}
  .relicfx.open .rf-chest{animation:rfOpen .5s ease-out both}
  .relicfx.open .rf-lid{transform:rotateX(-118deg) translateY(-6%); transition:transform .34s cubic-bezier(.2,.9,.2,1);
    box-shadow:0 0 26px var(--rc)}
  .relicfx.open .rf-ring{opacity:1; animation:rfRing .6s ease-out both}
  .rf-rays{position:absolute; left:50%; top:50%; width:min(130vmin,780px); height:min(130vmin,780px);
    margin-left:calc(min(130vmin,780px) / -2); margin-top:calc(min(130vmin,780px) / -2); opacity:0; pointer-events:none}
  .rf-rays i{position:absolute; left:50%; top:50%; width:6px; height:50%; margin-left:-3px; transform-origin:50% 0;
    background:linear-gradient(180deg, rgba(255,255,255,0), var(--rc)); filter:blur(.7px)}
  .rf-rays i:nth-child(2){transform:rotate(45deg)}
  .rf-rays i:nth-child(3){transform:rotate(90deg)}
  .rf-rays i:nth-child(4){transform:rotate(135deg)}
  .rf-rays i:nth-child(5){transform:rotate(180deg)}
  .rf-rays i:nth-child(6){transform:rotate(225deg)}
  .rf-rays i:nth-child(7){transform:rotate(270deg)}
  .rf-rays i:nth-child(8){transform:rotate(315deg)}
  .relicfx.open .rf-rays{opacity:.85; animation:rfSpin 12s linear infinite}
  .rf-spark{position:absolute; left:50%; top:50%; width:min(70vmin,420px); height:min(70vmin,420px);
    margin-left:calc(min(70vmin,420px) / -2); margin-top:calc(min(70vmin,420px) / -2); border-radius:50%;
    background:radial-gradient(circle,#fff 0%, var(--rc) 32%, rgba(0,0,0,0) 70%); transform:scale(.05); opacity:0}
  .relicfx.open .rf-spark{animation:rfSpark .5s ease-out both}
  .rf-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
  .relicfx.open .rf-flash{animation:rfFlash .34s ease-out both}
  .rf-cap{position:absolute; left:0; right:0; top:calc(11% + env(safe-area-inset-top,0px)); text-align:center; opacity:0; transition:opacity .2s}
  .relicfx.open .rf-cap{opacity:1}
  .rf-cap .rf-k{display:block; font-size:9px; letter-spacing:.34em; color:#ffe9b6;
    text-shadow:0 1px 14px rgba(0,0,0,.9), 0 0 22px rgba(255,220,150,.6)}
  .rf-cap .rf-ph{
    display:block; width:92px; height:92px; margin:0 auto 10px; border-radius:50%; overflow:hidden;
    position:relative; border:1px solid var(--rc,#ecd9a8); background:#0b0e13;
    box-shadow:0 0 34px -10px var(--rc,#ecd9a8), 0 0 0 3px rgba(7,9,13,.55);
  }
  .rf-cap .rf-ph:empty{display:none}
  .rf-cap .rf-ph .ph-svg,.rf-cap .rf-ph .ph-img{position:absolute; inset:0; width:100%; height:100%}
  .rf-cap .rf-ph .ph-img{object-fit:cover}
  .rf-cap .rf-n{display:block; font-family:var(--serif); font-size:20px; color:#fffdf6; margin-top:6px;
    text-shadow:0 2px 16px rgba(0,0,0,.9), 0 0 26px var(--rc)}
  .rf-tip{position:absolute; left:0; right:0; bottom:calc(9% + env(safe-area-inset-bottom,0px)); text-align:center;
    font-size:10px; letter-spacing:.12em; color:rgba(255,255,255,.72);
    text-shadow:0 1px 12px rgba(0,0,0,.9)}
  @keyframes rfDrop{0%{opacity:0; transform:translateY(-26%) scale(.86)}55%{opacity:1; transform:translateY(2%) scale(1.04)}100%{opacity:1; transform:none}}
  @keyframes rfShake{from{transform:translate(-2px,1px) rotate(-.7deg)}to{transform:translate(2px,-1px) rotate(.7deg)}}
  @keyframes rfOpen{0%{transform:none}30%{transform:scale(1.1) rotate(-1deg)}100%{transform:scale(1.2)}}
  @keyframes rfRing{0%{transform:scale(.3); opacity:.9}100%{transform:scale(1.35); opacity:0}}
  @keyframes rfSpin{to{transform:rotate(360deg)}}
  @keyframes rfSpark{0%{transform:scale(.1); opacity:0}35%{opacity:1}100%{transform:scale(1); opacity:0}}
  @keyframes rfFlash{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}

  @media (max-width:820px){
    .rl-wrap{grid-template-columns:1fr; gap:16px}
    .rl-right{order:-1}
    .rl-show{min-height:150px}
    .rl-reveal{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  }

  /* ───── ⚡ 사이드 퀵 독 (운빨존많겜 스타일) ───── */
  .side-dock{
    position:fixed; z-index:45;
    right:calc(10px + env(safe-area-inset-right,0px)); top:50%;
    transform:translateY(-50%);
    display:flex; flex-direction:column; gap:7px;
    padding:8px 7px; border-radius:16px;
    background:rgba(12,16,24,.85);
    border:1px solid rgba(200,168,106,.26);
    box-shadow:0 20px 44px -20px #000, 0 0 0 1px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(12px) saturate(1.3); backdrop-filter:blur(12px) saturate(1.3);
    transition:opacity .22s ease, transform .26s cubic-bezier(.2,.8,.2,1), visibility .22s;
    touch-action:manipulation;
  }
  .side-dock::before{
    content:""; position:absolute; left:-1px; top:14%; bottom:14%; width:2px; border-radius:2px;
    background:linear-gradient(180deg,transparent,rgba(236,217,168,.72),transparent);
    box-shadow:0 0 10px rgba(236,217,168,.45);
  }
  .sd-btn{
    --c:#c8a86a;
    position:relative; width:48px; height:48px; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border-radius:13px; cursor:pointer; color:#efe6d6;
    border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
    background:
      radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%),
      linear-gradient(165deg, rgba(24,30,41,.94), rgba(10,13,19,.96));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -6px 10px -8px rgba(0,0,0,.9);
    transition:transform .13s cubic-bezier(.2,1.6,.4,1), box-shadow .2s, border-color .2s;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .sd-btn[data-sd="battle"]{--c:#ff7a5c}
  .sd-btn[data-sd="pack"]{--c:#f5c451}
  .sd-btn[data-sd="relic"]{--c:#b98cff}
  .sd-btn[data-sd="shop"]{--c:#4fd1a5}
  .sd-btn[data-sd="archive"]{--c:#7aa8ff}
  .sd-btn[data-sd="figures"]{--c:#e8b45c}
  .sd-ic{font-size:19px; line-height:1; filter:drop-shadow(0 1px 3px rgba(0,0,0,.65)); transition:transform .13s cubic-bezier(.2,1.6,.4,1)}
  .sd-lb{font-size:8.5px; font-weight:700; letter-spacing:.01em; color:#c2cad6; line-height:1.1}
  .sd-btn:hover{
    border-color:color-mix(in srgb, var(--c) 60%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 8px 22px -12px var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 20%, transparent);
  }
  .sd-btn:hover .sd-lb{color:#f0e7d6}
  .sd-btn:active{
    transform:scale(.9);
    box-shadow:inset 0 3px 10px -2px rgba(0,0,0,.75), 0 0 22px -8px var(--c);
  }
  .sd-btn:active .sd-ic{transform:scale(.88)}
  .sd-btn:focus-visible{outline:2px solid var(--gold-hi); outline-offset:2px}
  .sd-btn[data-hot="1"]::after{
    content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
    animation:sdPulse 2.4s ease-out infinite;
  }
  @keyframes sdPulse{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent)}
    70%{box-shadow:0 0 0 7px rgba(0,0,0,0)}
    100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
  }
  .sd-badge{
    position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:linear-gradient(180deg,#ff7a5c,#d92f2f); color:#fff;
    font-size:9.5px; font-weight:800; line-height:16px; text-align:center; letter-spacing:-.02em;
    box-shadow:0 0 0 1.5px rgba(10,13,19,.92), 0 2px 6px rgba(0,0,0,.6);
  }
  .sd-badge.inf{background:linear-gradient(180deg,#ffe08a,#c8a86a); color:#1a1206; font-size:11px}
  /* 창이 열려 있는 동안에는 독을 감춰 전투·뽑기 화면을 가리지 않는다 */
  body.dock-off .side-dock{
    opacity:0; visibility:hidden; pointer-events:none;
    transform:translateY(-50%) translateX(20px) scale(.94);
  }
  @supports selector(body:has(> *)){
    body:has(.modal.open) .side-dock{
      opacity:0; visibility:hidden; pointer-events:none;
      transform:translateY(-50%) translateX(20px) scale(.94);
    }
  }
  @media (max-width:1240px){
    main{padding-right:64px}
  }
  @media (max-width:640px){
    .side-dock{right:calc(8px + env(safe-area-inset-right,0px)); gap:6px; padding:7px 6px; border-radius:14px}
    .sd-btn{width:42px; height:42px; border-radius:11px}
    .sd-ic{font-size:17px}
    .sd-lb{font-size:8px}
    main{padding-right:66px}
  }
  @media (orientation: landscape) and (max-height: 560px){
    .side-dock{right:calc(6px + env(safe-area-inset-right,0px)); gap:3px; padding:3px; border-radius:12px;
      max-height:calc(100dvh - 12px)}
    .sd-btn{width:32px; height:32px; border-radius:8px; gap:0}
    .sd-ic{font-size:13px}
    .sd-lb{font-size:6.5px; letter-spacing:0}
    .sd-badge{top:-4px; right:-4px; min-width:14px; height:14px; line-height:14px; font-size:8px; padding:0 3px}
    main{padding-right:48px}
  }
  @media (prefers-reduced-motion: reduce){
    .side-dock, .sd-btn, .sd-ic{transition:none}
    .sd-btn[data-hot="1"]::after{animation:none}
  }

  .fdmg.weakpop{

  }

  .fdmg.weak{ color:#ffe066; font-weight:900; text-shadow:0 0 10px rgba(255,214,10,.7) }
  .cut-boss-art{ display:block; width:100%; height:100% }

  /* ── 🐉 보스 레이드 ── */
  .braid-head{
    display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
    padding:16px 0 10px; flex-wrap:wrap;
  }
  .braid-txt{ min-width:240px; flex:1 }
  .braid-txt h3{ margin:4px 0 6px; font-family:var(--serif); font-size:23px; color:#f5eddd; font-weight:600 }
  .braid-txt p{ margin:0; font-size:12.5px; color:#9aa1ad; line-height:1.75; max-width:720px }
  .braid-txt p b{ color:var(--gold-hi) }
  .braid-info{ display:flex; gap:8px; flex:0 0 auto }
  .braid-info>div{
    min-width:82px; padding:9px 12px; border-radius:12px; text-align:center;
    border:1px solid var(--line); background:rgba(200,168,106,.06);
  }
  .braid-info span{ display:block; font-size:9.5px; color:#8b93a1; letter-spacing:.06em }
  .braid-info b{ font-family:var(--serif); font-size:15px; color:var(--gold-hi) }
  .braid-bar{ height:7px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; margin:4px 0 10px }
  .braid-bar i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#c8a86a,#ffe9a8) }
  .braid-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:#8b93a1; margin-bottom:14px }
  .braid-legend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px }
  .braid-legend .lg-weak{ background:#ffd60a }
  .braid-legend .lg-clear{ background:#6fd39a }
  .braid-legend .braid-tip{ margin-left:auto; color:#6b7280 }

  .braid-grid{
    display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
    padding-bottom:26px;
  }
  .braid-card{
    position:relative; text-align:left; cursor:pointer; overflow:hidden;
    border:1px solid var(--line2); border-radius:16px; padding:12px 13px 13px;
    background:
      radial-gradient(120% 90% at 86% 0%, color-mix(in srgb, var(--bc) 22%, transparent), transparent 62%),
      linear-gradient(165deg, rgba(20,25,34,.96), rgba(10,13,18,.98));
    display:flex; flex-direction:column; gap:3px; transition:.16s;

  .braid-card.done{ border-color:rgba(111,211,154,.5) }
  .braid-card.hit{ box-shadow:inset 0 0 0 1px rgba(255,214,10,.45) }
  .brc-no{

    background:linear-gradient(180deg,#9ff0bf,#4fbf86); padding:2px 7px; border-radius:999px;

  .brc-myth{ text-align:center; font-size:10px; color:#7f8798; line-height:1.5; margin-bottom:5px }
  .brc-weak{
    font-size:11px; color:#ffe066; background:rgba(255,214,10,.09);

  .brc-weak b{ color:#fff3b0 }
  .brc-figs{ font-size:10.5px; color:#b8c0cc; line-height:1.5; padding:3px 1px 0 }

  .brhero{

      radial-gradient(120% 120% at 8% 0%, color-mix(in srgb, var(--bc) 18%, transparent), transparent 58%),
