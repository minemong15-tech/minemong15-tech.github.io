<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LEGACY 3레인 QA</title>
<style>
  html,body{margin:0;background:#0b0d11;font:11px/1.4 system-ui,sans-serif;color:#98a0ac}
  .wrap{display:flex;gap:14px;padding:12px;align-items:flex-start}
  .box{display:flex;flex-direction:column;gap:4px}
  .ph{border:1px dashed #2a2f3a;background:#0e1117;border-radius:6px;display:grid;place-items:center;color:#4b5361}
  iframe{border:1px solid #333;background:#000;border-radius:6px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="box"><span>mobile 390×844</span><div class="ph" id="bp" style="width:390px;height:844px">loading…</div></div>
  <div class="box"><span>landscape 844×390</span><div class="ph" id="bl" style="width:844px;height:390px">loading…</div></div>
</div>
<script>
function mk(id, w, h){
  var box = document.getElementById(id);
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.textContent = '';
  var f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.setAttribute('scrolling', 'no');
  f.src = './?vip=hs2026&v=qa3';
  box.appendChild(f);
  return f;
}
function boot(f){
  var n = 0;
  var t = setInterval(function () {
    n++;
    try {
      var w = f.contentWindow, d = f.contentDocument;
      if (w && w.LegacyBattle && d && d.querySelector('#mBattle')) {
        clearInterval(t);
        w.LegacyBattle.open();
        setTimeout(function () {
          try {
            var s = d.querySelector('[data-stage]');
            if (s) s.click();
            setTimeout(function () {
              try { var b = d.querySelector('[data-start]'); if (b) b.click(); } catch (e) {}
            }, 700);
          } catch (e) {}
        }, 500);
      }
    } catch (e) {}
    if (n > 80) clearInterval(t);
  }, 250);
}
setTimeout(function () {
  var a = mk('bp', 390, 844);
  var c = mk('bl', 844, 390);
  setTimeout(function () { boot(a); boot(c); }, 2600);
}, 900);
</script>
</body>
</html>
