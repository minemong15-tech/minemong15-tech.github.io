<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LEGACY 3레인 QA</title>
<style>
  html,body{margin:0;background:#0b0d11;font:11px/1.4 system-ui,sans-serif;color:#98a0ac}
  .wrap{display:flex;gap:14px;padding:12px;align-items:flex-start}
  .box{display:flex;flex-direction:column;gap:4px}
  .ph{border:1px dashed #2a2f3a;background:#0e1117;border-radius:6px;display:grid;place-items:center;color:#4b5361}
  iframe{border:1px solid #333;background:#000;border-radius:6px;display:block}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="box"><span id="lbm">mobile 390×844</span><div class="ph" id="bp"></div></div>
  <div class="box" id="boxl"><span>landscape 844×390</span><div class="ph" id="bl"></div></div>
</div>
<script>
var Q = new URLSearchParams(location.search);
var MODE = Q.get('m') || '0';
var LAST = (Q.get('st') || 'first') === 'last';

function mk(id, w, h){
  var box = document.getElementById(id);
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.textContent = '';
  var f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.setAttribute('scrolling', 'no');
  f.src = './?vip=hs2026&v=qa' + (Q.get('v') || '4');
  box.appendChild(f);
  return f;
}
function boot(f){
  var tries = 0;
  var t = setInterval(function () {
    tries++;
    try {
      var w = f.contentWindow, d = f.contentDocument;
      var m = d && d.querySelector('#mBattle');
      if (w && m) {
        if (!m.classList.contains('open')) {
          if (w.LegacyBattle) w.LegacyBattle.open();
        } else if (!d.querySelector('#arena')) {
          if (!f.__staged) {
            var list = d.querySelectorAll('[data-stage]');
            var s = list.length ? list[LAST ? list.length - 1 : 0] : null;
            if (s) { s.click(); f.__staged = 1; }
          } else {
            var b = d.querySelector('[data-start]');
            if (b) { b.click(); clearInterval(t); }
          }
        } else { clearInterval(t); }
      }
    } catch (e) { try { document.title = 'QA ERR ' + e.message; } catch (e2) {} }
    if (tries > 70) clearInterval(t);
  }, 260);
}
function go(){
  var a, c;
  if (MODE === '1') { a = mk('bp', 390, 844); boot(a); }
  else if (MODE === '2') { a = mk('bp', 844, 390); document.getElementById('lbm').textContent = 'landscape 844×390'; document.getElementById('boxl').style.display = 'none'; boot(a); }
  else if (MODE === '3') { a = mk('bp', 1180, 920); document.getElementById('lbm').textContent = 'desktop 1180×920'; document.getElementById('boxl').style.display = 'none'; boot(a); }
  else { a = mk('bp', 390, 844); c = mk('bl', 844, 390); boot(a); boot(c); }
}
setTimeout(go, 5200);
</script>
</body>
</html>
