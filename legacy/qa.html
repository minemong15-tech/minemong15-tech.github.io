<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA LEGACY BATTLE</title>
<style>
  html,body{margin:0;background:#05070b;color:#dfe6ee;font:12px/1.5 system-ui,sans-serif}
  #bar{padding:6px 10px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #bar b{color:#ffd166}
  #log{padding:6px 10px;white-space:pre-wrap;font:11px/1.45 ui-monospace,monospace;max-height:22vh;overflow:auto}
  #wrap{margin:0;display:flex;justify-content:center;background:#000}
  iframe{display:block;border:0;background:#000}
  .ok{color:#7ee0a4}.bad{color:#ff8a8a}.warn{color:#ffd166}
</style>
</head>
<body>
<div id="bar"><b>LEGACY BATTLE QA</b><span id="phase">boot</span><span id="sz"></span></div>
<div id="wrap"><iframe id="fr" src="about:blank"></iframe></div>
<div id="log"></div>
<script>
var P = new URLSearchParams(location.search);
var VW = parseInt(P.get('w') || '0', 10), VH = parseInt(P.get('h') || '0', 10);
var QA = window.QA = { log: [], results: {}, errs: [], phase: 'boot', done: false, fps: 0, jank: 0, frames: 0, shots: [] };
var fr = document.getElementById('fr');
var LOG = document.getElementById('log');
if (VW && VH) { fr.style.width = VW + 'px'; fr.style.height = VH + 'px'; }
document.getElementById('sz').textContent = (VW || 'auto') + 'x' + (VH || 'auto');
function out(s, cls) {
  QA.log.push(s);
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = s;
  LOG.appendChild(d);
  LOG.scrollTop = LOG.scrollHeight;
}
function setPhase(p) { QA.phase = p; document.getElementById('phase').textContent = p; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function W() { return fr.contentWindow; }
function D() { return fr.contentDocument; }
function q(sel) { var d = D(); return d ? d.querySelector(sel) : null; }
function qa(sel) { var d = D(); return d ? d.querySelectorAll(sel) : []; }
function click(sel, label) {
  var el = typeof sel === 'string' ? q(sel) : sel;
  if (!el) { out('✗ 없음: ' + label, 'bad'); return false; }
  el.click();
  out('→ 클릭: ' + label, 'ok');
  return true;
}
async function waitFor(fn, ms, label) {
  var t0 = Date.now();
  while (Date.now() - t0 < ms) {
    var v = null;
    try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await sleep(120);
  }
  if (label) out('✗ 시간 초과: ' + label, 'bad');
  return null;
}
function installHooks(w) {
  w.addEventListener('error', function (e) {
    QA.errs.push('error: ' + (e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
  });
  w.addEventListener('unhandledrejection', function (e) { QA.errs.push('rejection: ' + e.reason); });
  ['error', 'warn'].forEach(function (k) {
    var orig = w.console[k];
    w.console[k] = function () {
      QA.errs.push('console.' + k + ': ' + Array.prototype.join.call(arguments, ' '));
      try { orig.apply(w.console, arguments); } catch (x) {}
    };
  });
}
function fpsProbe(w, ms) {
  return new Promise(function (resolve) {
    var n = 0, jank = 0, last = performance.now(), t0 = last;
    function f(t) {
      n++; var d = t - last; last = t;
      if (d > 48) jank++;
      if (t - t0 < ms) w.requestAnimationFrame(f);
      else resolve({ fps: Math.round(n / ((t - t0) / 1000)), jank: jank, frames: n });
    }
    w.requestAnimationFrame(f);
  });
}
function arenaInfo() {
  var a = q('#arena'), c = q('#bCanvas');
  var r = a ? a.getBoundingClientRect() : null;
  var st = q('#bField'), sr = st ? st.getBoundingClientRect() : null;
  return {
    arena: !!a, cv4: !!(a && a.classList.contains('cv4')),
    canvas: !!c, store: c ? [c.width, c.height] : 0,
    css: c ? [Math.round(c.getBoundingClientRect().width), Math.round(c.getBoundingClientRect().height)] : 0,
    stage: sr ? [Math.round(sr.width), Math.round(sr.height)] : 0,
    dock: qa('.cvsc').length, boss: !!(q('#bBossBar') && q('#bBossBar').classList.contains('on')),
    terr: q('#bTerrPct') ? q('#bTerrPct').textContent : '',
    wave: q('#bWaveTxt') ? q('#bWaveTxt').textContent : '',
    res: qa('.bres').length
  };
}
function shot(tag) { QA.shots.push({ tag: tag, t: Date.now() }); QA.shotWanted = tag; }
async function pollUlt() {
  /* AUTO 를 끄고 게이지 100% 카드가 뜨면 직접 터치 발동 */
  var off = q('#bAuto');
  if (off) { off.click(); out('→ AUTO 끄기(수동)', 'ok'); }
  var ready = await waitFor(function () { return q('.cvsc.ready'); }, 100000, '궁극기 READY 카드');
  if (!ready) return;
  out('READY 카드: ' + ready.textContent.replace(/\s+/g, ' ').slice(0, 40), 'ok');
  QA.results.ultReady = true;
  await sleep(300);
  ready.click();
  setPhase('ult-cut');
  var cut = await waitFor(function () { var c = q('#bCut'); return c && c.classList.contains('go') ? c : null; }, 4000, '컷인');
  QA.results.ultCut = !!cut;
  if (cut) {
    var ci = cut.querySelector('.ci-s'), cn = cut.querySelector('.ci-n'), cf = cut.querySelector('#bCutFace img');
    QA.results.ultName = ci ? ci.textContent : '';
    out('컷인: ' + (ci ? ci.textContent : '?') + ' / ' + (cn ? cn.textContent : '?') + ' / 초상화 ' + (cf ? 'O' : 'X'), 'ok');
    shot('ult');
    await sleep(2500);
  }
  var on = q('#bAuto');
  if (on) { on.click(); out('→ AUTO 다시 켜기', 'ok'); }
}

async function go() {
  var w = W(), d = D();
  if (!w || !d) { out('iframe 없음', 'bad'); return; }
  installHooks(w);
  await sleep(1600);
  out('앱: ' + d.title + ' · viewport ' + w.innerWidth + 'x' + w.innerHeight);

  /* 1) 진입 */
  setPhase('open');
  click('#warEnter', '전투 열기');
  await waitFor(function () { return q('[data-stage]'); }, 8000, '캠페인 지도');
  await sleep(400);
  var cards = qa('[data-stage]');
  out('스테이지 카드 ' + cards.length);
  var idx = Math.min(cards.length - 1, 11);
  if (cards.length) { cards[idx].click(); out('→ STAGE 카드 ' + (idx + 1), 'ok'); }
  await waitFor(function () { return q('[data-start]'); }, 8000, '덱 화면');
  await sleep(300);
  var easy = q('[data-diff="easy"]');
  if (easy) { easy.click(); out('→ 난이도 쉬움', 'ok'); await sleep(320); }
  out('출격 덱 ' + qa('[data-unpick]').length + '명');

  /* 2) 전투 */
  setPhase('battle');
  click('[data-start]', '전투 시작');
  var a1 = await waitFor(function () { var i = arenaInfo(); return i.arena ? i : null; }, 9000, '아레나');
  if (!a1) { QA.done = true; return; }
  await sleep(1000);
  QA.results.arena = arenaInfo();
  out('아레나 ' + JSON.stringify(QA.results.arena));
  shot('battle');

  var ultJob = pollUlt();

  var fp = await fpsProbe(w, 2600);
  QA.fps = fp.fps; QA.jank = fp.jank; QA.frames = fp.frames;
  out('FPS ' + fp.fps + ' · >48ms ' + fp.jank + '/' + fp.frames, fp.fps < 40 ? 'warn' : 'ok');

  /* 웨이브 진행 확인 */
  var wv = await waitFor(function () {
    var t = q('#bWaveTxt');
    return t && /WAVE 2|WAVE 3/.test(t.textContent) ? t.textContent : null;
  }, 60000, '웨이브 2 진입');
  QA.results.wave2 = wv || '';
  out('웨이브 진행: ' + (wv || 'X'), wv ? 'ok' : 'warn');

  setPhase('finish');
  var ov = await waitFor(function () { var b = qa('.bres'); return b.length ? b[b.length - 1] : null; }, 150000, '결과 리포트');
  if (ov) {
    await sleep(1400);
    var kind = ov.classList.contains('win') ? 'VICTORY' : 'DEFEAT';
    QA.results.result = kind;
    QA.results.mvpRows = ov.querySelectorAll('.mvp-row').length;
    QA.results.acts = ov.querySelectorAll('.br-acts button').length;
    out('결과 ' + kind + ' · MVP 행 ' + QA.results.mvpRows + ' · 버튼 ' + QA.results.acts, 'ok');
    out('리포트: ' + ov.textContent.replace(/\s+/g, ' ').slice(0, 180));
    await ultJob;
    shot('report');
    await sleep(1500);
  }
  await ultJob;

  /* 3) 다음 스테이지 재진입 */
  setPhase('next');
  var nb = q('.bres [data-next-stage]') || q('.bres [data-retry]');
  if (nb) {
    nb.click(); out('→ ' + (nb.getAttribute('data-next-stage') ? '다음 시대' : '다시 도전'), 'ok');
    await sleep(800);
    var st = q('[data-start]');
    if (st) st.click();
    var a2 = await waitFor(function () { var i = arenaInfo(); return i.arena && !i.res ? i : null; }, 9000, '2차 아레나');
    QA.results.reentry = !!a2;
    out('2차 아레나 ' + (a2 ? 'O ' + JSON.stringify(a2) : 'X'), a2 ? 'ok' : 'bad');
    await sleep(1200);
  }

  /* 4) 무한의 탑 */
  setPhase('tower');
  click('#bRetreat', '나가기');
  await sleep(800);
  click('[data-bmode="tower"]', '무한의 탑');
  var tf = await waitFor(function () { return q('[data-tower-start]'); }, 8000, '탑 화면');
  if (tf) {
    tf.click(); out('→ 탑 도전', 'ok');
    var a3 = await waitFor(function () { var i = arenaInfo(); return i.arena ? i : null; }, 9000, '탑 아레나');
    QA.results.tower = !!a3;
    await sleep(3000);
    out('탑 ' + (a3 ? 'O · ' + JSON.stringify(arenaInfo()) : 'X'), a3 ? 'ok' : 'bad');
    shot('tower');
    await sleep(2500);
  }

  /* 5) 보스 레이드 */
  setPhase('bossraid');
  click('#bRetreat', '나가기');
  await sleep(800);
  click('[data-bmode="boss"]', '보스 레이드');
  var bs = await waitFor(function () { return q('[data-boss-start]'); }, 8000, '보스 목록');
  if (bs) {
    bs.click(); out('→ 보스 레이드 시작', 'ok');
    var a4 = await waitFor(function () { var i = arenaInfo(); return i.arena ? i : null; }, 9000, '보스 아레나');
    QA.results.bossRaid = !!a4;
    var wn = await waitFor(function () { var x = q('#bWarn'); return x && x.classList.contains('go') ? x : null; }, 16000, 'WARNING');
    QA.results.warning = !!wn;
    out('보스 ' + (a4 ? 'O' : 'X') + ' · WARNING ' + (wn ? 'O' : 'X'), a4 ? 'ok' : 'bad');
    await sleep(2000);
    out('보스 HUD ' + (q('#bBossBar') && q('#bBossBar').classList.contains('on') ? 'O' : 'X') + ' ' + (q('#bBossNum') ? q('#bBossNum').textContent : ''));
    shot('boss');
    await sleep(1500);
  }

  /* 6) 일시정지 */
  setPhase('pause');
  var pb = q('#bPause');
  if (pb) {
    pb.click(); await sleep(500);
    QA.results.pause = !!(q('#cvPause') && q('#cvPause').classList.contains('on'));
    out('일시정지 ' + (QA.results.pause ? 'O' : 'X'), QA.results.pause ? 'ok' : 'bad');
    var rb = q('.cvp-go');
    if (rb) { rb.click(); await sleep(400); }
    QA.results.resume = !(q('#cvPause') && q('#cvPause').classList.contains('on'));
    out('재개 ' + (QA.results.resume ? 'O' : 'X'), QA.results.resume ? 'ok' : 'bad');
  }

  setPhase('done');
  QA.done = true;
  out('=== 완료 · 오류 ' + QA.errs.length + '건 ===', QA.errs.length ? 'bad' : 'ok');
  QA.errs.forEach(function (e) { out('  ' + e, 'bad'); });
}

fr.addEventListener('load', function () {
  if (QA.started) return;
  QA.started = true;
  setTimeout(function () {
    go().catch(function (e) { out('QA 예외: ' + (e && e.stack ? e.stack.split('\n')[0] : e), 'bad'); QA.done = true; });
  }, 900);
});
fr.src = './index.html?vip=hs2026&qab=' + Date.now();
</script>
</body>
</html>
