<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>FIG QA</title>
<style>
html,body{margin:0;background:radial-gradient(circle at 50% 30%, #1b2c52 0%, #0a1224 55%, #05080f 100%);height:100%;overflow:hidden;font-family:sans-serif;color:#cfe6ff}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:12px;top:10px;font-size:13px;opacity:.75}
</style></head>
<body>
<div id="hud"></div>
<canvas id="cv"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const D3 = { THREE: THREE, tex: {}, mat: {} };
function d3col(c) { return new THREE.Color(c || '#ffffff'); }
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), bl = Math.round(ab + (bb - ab) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
function lighten(h, t) { return mixHex(h, '#ffffff', t); }
function darken(h, t) { return mixHex(h, '#000000', t); }
/* ---------- brawler 3D models : Brawl-Stars-style cartoon figures ---------- */
/* forward = +X, up = +Y, left/right = ±Z.
   SD 체형(약 3등신) + MeshToonMaterial 툰 셰이딩 + 검은 inverted-hull 외곽선.
   관절 리그 계약: parts.legL/legR/shinL/shinR/armL/armR/foreL/foreR/torso/head/wpn. */

const FGS = { grad: null, outMat: null, skin: 0 };

/* 3~5단계 DataTexture 그라디언트 맵 → 셀 셰이딩 */
function fgGradTex() {
  if (FGS.grad) return FGS.grad;
  const T = D3.THREE;
  const arr = new Uint8Array([58, 104, 158, 208, 245]);
  const tex = new T.DataTexture(arr, arr.length, 1, T.RedFormat);
  tex.minFilter = T.NearestFilter;
  tex.magFilter = T.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  FGS.grad = tex;
  return tex;
}

function fgToon(color, o) {
  o = o || {};
  const key = 'F' + color + '|' + (o.emissive || '') + '|' + (o.ei == null ? '' : o.ei) +
    '|' + (o.op == null ? '' : o.op) + '|' + (o.side || 0) + '|' + (o.dw === false ? 'n' : 'y');
  if (D3.mat[key]) return D3.mat[key];
  const T = D3.THREE;
  const m = new T.MeshToonMaterial({
    color: d3col(color),
    gradientMap: fgGradTex(),
    transparent: o.op != null && o.op < 1,
    opacity: o.op == null ? 1 : o.op,
    side: o.side || T.FrontSide,
    emissive: d3col(o.emissive || '#000000'),
    emissiveIntensity: o.ei == null ? 1 : o.ei,
    depthWrite: o.dw === false ? false : true
  });
  D3.mat[key] = m;
  return m;
}

function fgOutMat() {
  if (FGS.outMat) return FGS.outMat;
  const T = D3.THREE;
  FGS.outMat = new T.MeshBasicMaterial({ color: d3col('#070a12'), side: T.BackSide });
  return FGS.outMat;
}

/* 검은 외곽선(inverted hull): 같은 지오메트리를 살짝 키워 뒷면만 그린다. */
function fgOl(mesh, k) {
  if (!mesh || !mesh.geometry || !mesh.parent) return null;
  const T = D3.THREE;
  const m = new T.Mesh(mesh.geometry, fgOutMat());
  m.position.copy(mesh.position);
  m.rotation.copy(mesh.rotation);
  m.scale.copy(mesh.scale).multiplyScalar(k == null ? 1.1 : k);
  m.castShadow = false;
  m.receiveShadow = false;
  m.userData.outline = 1;
  m.renderOrder = mesh.renderOrder;
  mesh.parent.add(m);
  return m;
}

function fgPart(parent, geo, mat, x, y, z, o) {
  const T = D3.THREE;
  o = o || {};
  const m = new T.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  const s = o.s == null ? 1 : o.s;
  m.scale.set(o.sx == null ? s : o.sx, o.sy == null ? s : o.sy, o.sz == null ? s : o.sz);
  m.rotation.set(o.rx || 0, o.ry || 0, o.rz || 0);
  if (o.name) m.name = o.name;
  m.castShadow = !!o.shadow;
  m.receiveShadow = false;
  parent.add(m);
  if (o.ol) fgOl(m, o.ol === true ? 1.1 : o.ol);
  return m;
}

function fgSph(parent, r, mat, x, y, z, o) {
  o = o || {};
  return fgPart(parent, new D3.THREE.SphereGeometry(r, o.seg || 18, o.seg2 || 14), mat, x, y, z, o);
}
function fgBox(parent, w, h, d, mat, x, y, z, o) {
  return fgPart(parent, new D3.THREE.BoxGeometry(w, h, d), mat, x, y, z, o);
}
function fgCap(parent, r, len, mat, x, y, z, o) {
  o = o || {};
  return fgPart(parent, new D3.THREE.CapsuleGeometry(r, len, 5, o.seg || 16), mat, x, y, z, o);
}
function fgCyl(parent, rt, rb, h, mat, x, y, z, o) {
  o = o || {};
  return fgPart(parent, new D3.THREE.CylinderGeometry(rt, rb, h, o.seg || 18), mat, x, y, z, o);
}
function fgCone(parent, r, h, mat, x, y, z, o) {
  o = o || {};
  return fgPart(parent, new D3.THREE.ConeGeometry(r, h, o.seg || 10), mat, x, y, z, o);
}
function fgTor(parent, r, tube, mat, x, y, z, o) {
  o = o || {};
  return fgPart(parent, new D3.THREE.TorusGeometry(r, tube, 10, o.seg || 26), mat, x, y, z, o);
}
function fgLathe(parent, pts, mat, x, y, z, o) {
  o = o || {};
  const pp = pts.slice();
  if (pp.length > 1 && pp[0][1] > pp[pp.length - 1][1]) pp.reverse();
  const v = [];
  for (let i = 0; i < pp.length; i++) v.push(new D3.THREE.Vector2(pp[i][0], pp[i][1]));
  return fgPart(parent, new D3.THREE.LatheGeometry(v, o.seg || 22), mat, x, y, z, o);
}
function fgStarGeo(r, depth, inner) {
  const T = D3.THREE;
  const s = new T.Shape();
  const k = inner == null ? 0.45 : inner;
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? k : 1;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = Math.cos(a) * rr * r, py = Math.sin(a) * rr * r;
    if (i === 0) s.moveTo(px, py); else s.lineTo(px, py);
  }
  s.closePath();
  return new T.ExtrudeGeometry(s, { depth: depth == null ? 3 : depth, bevelEnabled: false, curveSegments: 1 });
}

/* 브롤스타즈식 큰 얼굴: 두꺼운 눈 테두리 + 흰자 + 홍채 + 반짝임 + 굵은 눈썹 + 입 */
function fgEye(head, sd, o) {
  const r = o.eyeR, ex = o.fx, ey = o.eyeY, ez = sd * o.eyeZ;
  const tilt = o.eyeTilt || 0;
  if (o.style === 'closed') {
    const arc = fgBox(head, 1.5, 1.9, r * 1.9, fgToon(o.lineCol || '#141a2c'), ex + 0.9, ey, ez, { rx: -sd * 0.42, ol: 1.22 });
    void arc;
    return;
  }
  if (o.style === 'happy') {
    fgTor(head, r * 0.8, r * 0.2, fgToon(o.lineCol || '#141a2c'), ex + 0.6, ey - r * 0.2, ez, { ry: Math.PI / 2, rx: Math.PI, ol: 1.2 });
    return;
  }
  // 눈 테두리(검은 테)
  fgSph(head, r * 1.07, fgToon('#0e1220'), ex - 0.45, ey, ez, { sx: 0.42, sy: 1.02, sz: 0.99, seg: 14, rx: tilt });
  // 흰자
  fgSph(head, r, fgToon(o.white || '#ffffff'), ex, ey, ez, { sx: 0.45, sy: 1.0, sz: 0.95, seg: 14, rx: tilt });
  // 홍채(+동공)
  if (o.iris !== false) {
    fgSph(head, r * 0.64, fgToon(o.iris || '#1b2b4a', o.irisGlow ? { emissive: o.iris || '#1b2b4a', ei: 0.9 } : null),
      ex + r * 0.22, ey - r * 0.06, ez + sd * r * 0.06, { sx: 0.4, sy: 1.0, sz: 0.9, seg: 12 });
    fgSph(head, r * 0.25, fgToon(o.pupil || '#0a0f1c'), ex + r * 0.42, ey - r * 0.07, ez, { sx: 0.34, sy: 1.0, sz: 0.9, seg: 10 });
  }
  // 반짝임 하이라이트 2개
  if (o.shine !== false) {
    fgPart(head, new D3.THREE.SphereGeometry(r * 0.2, 8, 6), fgToon('#ffffff'),
      ex + r * 0.48, ey + r * 0.36, ez + sd * r * 0.24, { sx: 0.7, sy: 1.1, sz: 1.0 });
    fgPart(head, new D3.THREE.SphereGeometry(r * 0.1, 6, 5), fgToon('#ffffff'),
      ex + r * 0.46, ey - r * 0.3, ez - sd * r * 0.3, {});
  }
}

function fgMouth(head, o) {
  const fx = o.fx, y = o.mouthY, style = o.style || 'grin';
  const dark = fgToon(o.col || '#22182a');
  if (style === 'grin') {
    fgSph(head, 5.2, dark, fx - 0.2, y, 0, { sx: 0.32, sy: 0.5, sz: 1.02, ol: 1.12 });
    fgBox(head, 1.0, 1.3, 7.4, fgToon('#ffffff'), fx + 1.15, y + 1.1, 0, {});
  } else if (style === 'open') {
    fgSph(head, 5.5, dark, fx - 0.2, y, 0, { sx: 0.38, sy: 0.86, sz: 0.92, ol: 1.1 });
    fgSph(head, 2.8, fgToon('#ff6f92'), fx + 1.0, y - 2.0, 0, { sx: 0.32, sy: 0.6, sz: 0.78 });
    fgBox(head, 1.0, 1.5, 8.4, fgToon('#ffffff'), fx + 1.4, y + 4.2, 0, {});
  } else if (style === 'smirk') {
    fgSph(head, 4.6, dark, fx - 0.2, y + 0.6, 2.2, { sx: 0.32, sy: 0.4, sz: 0.9, ol: 1.12 });
    fgBox(head, 1.0, 1.2, 5.4, fgToon('#ffffff'), fx + 1.2, y + 1.7, 2.4, {});
  } else if (style === 'flat') {
    fgBox(head, 1.6, 1.5, 8.2, dark, fx + 0.6, y, 0, { ol: 1.16 });
  } else if (style === 'fangs') {
    fgSph(head, 5.0, dark, fx - 0.2, y, 0, { sx: 0.32, sy: 0.48, sz: 1.0, ol: 1.1 });
    [-1, 1].forEach(function (sd) {
      fgCone(head, 1.4, 3.2, fgToon('#ffffff'), fx + 1.2, y + 1.5, sd * 3.2, { rx: Math.PI, seg: 6 });
    });
  } else if (style === 'zigzag') {
    for (let i = 0; i < 5; i++) {
      fgBox(head, 1.3, 1.3, 3.0, fgToon(o.col || '#8bfff0'), fx + 0.6, y + (i % 2 ? 1.2 : -1.2), -6.0 + i * 3.0, { rx: i % 2 ? 0.7 : -0.7 });
    }
  } else if (style === 'none') {
    /* 입 없음 */
  }
}

function fgFace(head, o) {
  o = o || {};
  const fx = o.fx == null ? 16.9 : o.fx;
  const eyeY = o.eyeY == null ? 1.8 : o.eyeY;
  const eyeZ = o.eyeZ == null ? 6.2 : o.eyeZ;
  const eyeR = o.eyeR == null ? 4.9 : o.eyeR;
  // 코
  if (o.nose !== false) {
    fgSph(head, 1.8, fgToon(o.noseCol || o.skin || '#f0b98e'), fx + 1.6, eyeY - 4.6, 0, { sx: 0.8, sy: 0.8, sz: 0.9 });
  }
  // 귀
  if (o.ears !== false) {
    [-1, 1].forEach(function (sd) {
      fgSph(head, 3.1, fgToon(o.skin || '#f0b98e'), -1.6, -0.8, sd * 18.7, { sx: 0.55, sy: 1.0, sz: 0.45, ol: 1.16 });
    });
  }
  [-1, 1].forEach(function (sd) {
    const one = o.eyesOne && sd < 0;
    fgEye(head, sd, {
      fx: fx, eyeY: eyeY, eyeZ: eyeZ, eyeR: one ? eyeR * 0.8 : eyeR,
      iris: o.iris, irisGlow: o.irisGlow, white: o.white, shine: o.shine,
      style: one && o.oneClosed ? 'closed' : o.eyeStyle, eyeTilt: o.eyeTilt,
      lineCol: o.lineCol, pupil: o.pupil
    });
    // 굵은 눈썹
    if (o.brow) {
      const bh = o.browH || 1.8;
      const b = fgBox(head, 1.6, bh, eyeR * 1.36, fgToon(o.browCol || '#1b2036'), fx + 0.6,
        eyeY + (o.browY == null ? 6.4 : o.browY), sd * eyeZ, { ol: 1.13 });
      b.rotation.x = -sd * (o.browTilt == null ? 0.22 : o.browTilt);
      b.rotation.z = o.browZ || 0;
    }
  });
  if (o.mouth) fgMouth(head, { fx: fx + 0.4, mouthY: o.mouthY == null ? -8.4 : o.mouthY, style: o.mouth, col: o.mouthCol });
}


/* ---------- 팔레트 · 공통 체형 ---------- */
function fgMats(cfg, body, accent, glow) {
  const hair = cfg.hair || darken(body, 0.28);
  return {
    skin: fgToon(cfg.skin || '#ffd6b0'),
    body: fgToon(body),
    bodyL: fgToon(lighten(body, 0.34)),
    bodyM: fgToon(lighten(body, 0.14)),
    bodyD: fgToon(darken(body, 0.42)),
    accent: fgToon(accent),
    accentD: fgToon(darken(accent, 0.34)),
    glow: fgToon(glow, { emissive: glow, ei: 0.55 }),
    glowB: fgToon(glow, { emissive: glow, ei: 1.35 }),
    hair: fgToon(hair),
    hairD: fgToon(darken(hair, 0.35)),
    hairL: fgToon(lighten(hair, 0.3)),
    pants: fgToon(cfg.pants || darken(body, 0.66)),
    boot: fgToon(cfg.boot || '#3b2b2e'),
    glove: fgToon(cfg.glove || '#f7faff'),
    metal: fgToon(cfg.metal || '#c8d6e8'),
    metalD: fgToon(darken(cfg.metal || '#c8d6e8', 0.45)),
    dark: fgToon('#1b2234'),
    line: fgToon('#0d1120'),
    white: fgToon('#ffffff')
  };
}

function fgLegs(g, P, M, cfg) {
  const T = D3.THREE;
  const S = cfg.build || {};
  const hipY = S.hipY == null ? 32 : S.hipY;
  const legZ = S.legZ == null ? 11.2 : S.legZ;
  const thighR = S.thighR || 7.1, thighL = S.thighL || 7.5;
  const shinR = S.shinR || 5.5;
  const bootW = S.bootW || 15, bootH = S.bootH || 9.4, bootD = S.bootD || 13;
  [-1, 1].forEach(function (sd) {
    const leg = new T.Group();
    leg.position.set(0, hipY, sd * legZ);
    g.add(leg);
    P[sd < 0 ? 'legL' : 'legR'] = leg;
    if (cfg.hideLegs) {
      const stub = fgCap(leg, 5.2, 4, M.bodyD, 0, -5, 0, { ol: 1.1 });
      stub.visible = false;
      return;
    }
    fgCap(leg, thighR, thighL, cfg.pantsMat === 'body' ? M.body : M.pants, 0, -7.4, 0, { ol: 1.09, shadow: true });
    const kneeY = -13.2;
    fgSph(leg, thighR * 0.93, cfg.pantsMat === 'body' ? M.body : M.pants, 0, kneeY, 0, { sy: 0.88, ol: 1.1 });
    const shin = new T.Group();
    shin.position.set(0, kneeY, 0);
    leg.add(shin);
    P[sd < 0 ? 'shinL' : 'shinR'] = shin;
    fgCap(shin, shinR, 5.2, M.boot, 0, -4.4, 0, { ol: 1.11 });
    fgBox(shin, bootW, bootH, bootD, M.boot, 2.2, -11.7, 0, { ol: 1.06, shadow: true });
    fgSph(shin, bootD * 0.4, M.boot, bootW * 0.44, -13.2, 0, { sx: 0.95, sy: 0.66, sz: 0.94, ol: 1.06 });
    fgBox(shin, bootW + 1.8, 2.6, bootD + 1.4, M.dark, 2.2, -16.0, 0, { ol: 1.05 });
    if (cfg.bootTrim !== false) fgBox(shin, S.trimW || 7.5, S.trimH || 3.0, bootD * 0.52, M.accent, 2.2, -7.6, 0, { ol: 1.1 });
  });
}

function fgTorso(torso, M, cfg, P) {
  const S = cfg.build || {};
  const w = S.wide || 1.07;
  const pts = [
    [0, -2.6], [9.4 * w, -2.6], [12.6 * w, 0.8], [14.0 * w, 5.2], [15.2 * w, 11.2],
    [15.0 * w, 16.2], [13.2 * w, 20.6], [9.6 * w, 23.8], [0, 24.8]
  ];
  const chestMat = cfg.torsoMat === 'accent' ? M.accent : (cfg.torsoMat === 'dark' ? M.bodyD : M.body);
  fgLathe(torso, pts, chestMat, 0, 0, 0, { ol: 1.045, shadow: true, seg: 24 });
  // 벨트 + 버클
  fgCyl(torso, 13.8 * w, 13.8 * w, 4.6, M.bodyD, 0, 1.0, 0, { ol: 1.06, seg: 22 });
  fgBox(torso, 2.8, 5.2, 7.2, M.accent, 13.4 * w, 1.0, 0, { ol: 1.1 });
  // 옷깃(카라)
  if (cfg.collar !== false) {
    fgTor(torso, 8.6 * w, 2.5, M.bodyD, 0, 22.8, 0, { rx: Math.PI / 2, ol: 1.1, seg: 20 });
  }
  // 어깨끈 / 재킷 라펠
  if (cfg.lapel) {
    [-1, 1].forEach(function (sd) {
      const l = fgBox(torso, 2.6, 12.5, 4.6, M.bodyL, 12.6 * w, 16, sd * 4.6, { ol: 1.12 });
      l.rotation.x = -sd * 0.22;
      l.rotation.z = 0.18;
    });
  }
  if (P) P.torsoMesh = chestMat;
}

function fgArms(torso, P, M, cfg) {
  const T = D3.THREE;
  const S = cfg.build || {};
  const shoY = S.shoY == null ? 22 : S.shoY;
  const shoZ = S.shoZ == null ? 16.6 : S.shoZ;
  const upR = S.upR || 5.5, upL = S.upL || 6.2;
  const foR = S.foR || 4.9;
  const padR = S.padR || 7.8;
  const padMat = cfg.pad === 'body' ? M.body : (cfg.pad === 'metal' ? M.metal : (cfg.pad === 'dark' ? M.dark : M.accent));
  const sleeveMat = cfg.sleeve === 'accent' ? M.accent : (cfg.sleeve === 'skin' ? M.skin : M.body);
  [-1, 1].forEach(function (sd) {
    const arm = new T.Group();
    arm.position.set(0, shoY, sd * shoZ);
    torso.add(arm);
    P[sd < 0 ? 'armL' : 'armR'] = arm;
    fgSph(arm, padR, padMat, 0, 1.4, sd * 1.1, { sx: 1.0, sy: 0.84, sz: 1.06, ol: 1.09, shadow: true });
    fgCap(arm, upR, upL, sleeveMat, 0, -6.4, 0, { ol: 1.1 });
    const elbowY = -12.6;
    const fore = new T.Group();
    fore.position.set(0, elbowY, 0);
    arm.add(fore);
    P[sd < 0 ? 'foreL' : 'foreR'] = fore;
    fgSph(fore, foR * 1.12, sleeveMat, 0, 0, 0, { ol: 1.1 });
    fgCap(fore, foR, 4.6, sleeveMat, 0, -4.6, 0, { ol: 1.11 });
    fgCyl(fore, foR * 1.24, foR * 1.24, 2.6, M.accent, 0, -7.6, 0, { ol: 1.1, seg: 16 });
    // 큼직한 장갑 손
    const hand = fgSph(fore, 5.9, M.glove, 0.9, -11.2, 0, { sx: 1.02, sy: 1.0, sz: 1.0, ol: 1.09, shadow: true });
    hand.name = sd < 0 ? 'handL' : 'handR';
    fgSph(fore, 2.4, M.glove, 2.2, -13.2, sd * 4.8, { sx: 1.1, sy: 1.4, sz: 0.9, ol: 1.12 });
    fgBox(fore, 2.6, 2.0, 7.6, M.accent, 3.2, -11.6, 0, { ol: 1.14 });
  });
}


/* ---------- 캐릭터별 설정 ---------- */
const FG_CFG = {
  hyeon: { skin: '#ffd6b0', hair: '#19c9bf', pants: '#25406b', boot: '#2f4f86', glove: '#eef7ff', pad: 'accent', lapel: true },
  blaze: { skin: '#ffcfae', hair: '#ff3a2c', pants: '#2a1a24', boot: '#3d211c', glove: '#2b1a1f', pad: 'dark', build: { upR: 6.0, padR: 9.4 } },
  spark: { skin: '#ffe9a8', hair: '#ffd93d', pants: '#3a3320', boot: '#5a4a1c', glove: '#fff8d0', pad: 'accent', metal: '#fff3b0' },
  tankers: { skin: '#f2c49c', hair: '#3ddc97', pants: '#1d4a3a', boot: '#2b5a46', glove: '#dfe9e4', pad: 'metal', metal: '#dfeaf2', build: { wide: 1.16, padR: 11.2, shoZ: 18.2, upR: 6.4, thighR: 7.4, bootW: 16.5, legZ: 11 } },
  sniper: { skin: '#f8cfae', hair: '#5a3b2a', pants: '#2b2340', boot: '#3a2f52', glove: '#efe6ff', pad: 'body', build: { thighR: 6.2 } },
  frost: { skin: '#eaf7ff', hair: '#dff6ff', pants: '#2a5573', boot: '#3d7ea8', glove: '#eafaff', pad: 'accent', metal: '#dff4ff' },

/* 톱니 머리카락 */
function fgSpikes(head, mat, o) {
  o = o || {};
  const n = o.n || 7;
  const ringY = o.ringY == null ? 10 : o.ringY;
  const ringR = o.ringR == null ? 13 : o.ringR;
  const len = o.len || 17;
  const rad = o.rad || 5.6;
  const from = o.from == null ? -2.6 : o.from;
  const to = o.to == null ? 2.6 : o.to;
  const tilt = o.tilt == null ? 0.85 : o.tilt;
  for (let i = 0; i < n; i++) {
    const a = from + (to - from) * (n === 1 ? 0.5 : i / (n - 1));
    const x = Math.cos(a) * ringR, z = Math.sin(a) * ringR;
    const k = o.var == false ? 1 : (0.82 + 0.34 * Math.abs(Math.sin(a * 2.1 + 0.7)));
    const c = fgCone(head, rad * k, len * (o.lenVar ? k : 1), mat, x, ringY, z, { ol: 1.09, seg: 7 });
    c.rotation.z = -Math.cos(a) * tilt;
    c.rotation.x = Math.sin(a) * tilt;
  }
}

/* 반구 캡(모자·헬멧) */
function fgDome(parent, r, mat, x, y, z, o) {
  o = o || {};
  const T = D3.THREE;
  const geo = new T.SphereGeometry(r, o.seg || 20, 12, 0, Math.PI * 2, 0, (o.theta || 0.56) * Math.PI);
  const m = fgPart(parent, geo, mat, x, y, z, { sy: o.sy, sz: o.sz, sx: o.sx, ol: o.ol || 1.05, shadow: o.shadow });
  return m;
}

/* 투사체용 별 지오메트리(풀에서 공유) */
function d3StarGeo(inner) {
  const T = D3.THREE;
  const s = new T.Shape();
  const k = inner == null ? 0.44 : inner;
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? k : 1;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  return new T.ExtrudeGeometry(s, { depth: 0.32, bevelEnabled: false, curveSegments: 1 });
}

/* ---------- 브롤러 3D 피규어 ---------- */
function d3BrawlerModel(charId, col) {
  const T = D3.THREE;
  const cfg = FG_CFG[charId] || FG_CFG.hyeon;
  const body = col.body || '#3fa9ff';
  const accent = col.accent || lighten(body, 0.55);
  const glow = col.glow || body;
  const M = fgMats(cfg, body, accent, glow);

  const g = new T.Group();
  const P = {};
  g.userData.parts = P;

  fgLegs(g, P, M, cfg);

  const torso = new T.Group();
  torso.position.set(0, 32, 0);
  g.add(torso);
  P.torso = torso;
  fgTorso(torso, M, cfg, P);
  fgArms(torso, P, M, cfg);

  const head = new T.Group();
  head.position.set(0, 44, 0);
  torso.add(head);
  P.head = head;
  fgHeadBuild(charId, head, torso, g, P, M, cfg);

  // ---- 무기 마운트(오른손 앞)
  const wpn = new T.Group();
  wpn.position.set(10, 0, 13);
  torso.add(wpn);
  P.wpn = wpn;
  P.wpnBase = { x: 10, y: 0, z: 13 };
  const tip = fgWeapon(wpn, charId, M);
  // 오른팔 팔꿈치를 굽혀 손을 총에 얹는다
  if (P.foreR) P.foreR.rotation.z = charId === 'bouncer' ? -0.4 : -0.56;

  // ---- 총구 화염
  const muzzle = fgPart(wpn, new T.ConeGeometry(7.2, 17, 9), new T.MeshBasicMaterial({
    color: d3col(accent), transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false
  }), tip - 2, 0, 0, { rz: -Math.PI / 2 });
  muzzle.name = 'muzzle';
  P.muzzle = muzzle;

  // ---- 림 글로우 실루엣 (스킨 안쪽에서 은은하게)
  const rim = fgPart(g, new T.SphereGeometry(1, 16, 12), new T.MeshBasicMaterial({
    color: d3col(glow), transparent: true, opacity: 0.1, blending: T.AdditiveBlending,
    depthWrite: false, side: T.BackSide
  }), 0, 50, 0, { sx: 22, sy: 34, sz: 20 });
  rim.name = 'rimGlow';
  rim.visible = false;
  P.rim = rim;

  // ---- 발밑 팀 링
  const baseRing = fgPart(g, new T.RingGeometry(26, 33, 30), new T.MeshBasicMaterial({
    color: d3col(glow), transparent: true, opacity: 0.5,
    blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide
  }), 0, 1.2, 0, { rx: -Math.PI / 2 });
  baseRing.name = 'baseRing';
  P.baseRing = baseRing;

  return g;
}

  cam.updateProjectionMatrix();
  // 로비 스튜디오와 동일한 무대
  const disc = new THREE.Mesh(new THREE.CircleGeometry(150, 48), new THREE.MeshBasicMaterial({ color: 0x123055, transparent: true, opacity: 0.75, side: THREE.DoubleSide }));
  disc.rotation.x = -Math.PI / 2; disc.position.set(0, 0.4, 30);
  scene.add(disc);
  const rg = new THREE.Mesh(new THREE.RingGeometry(140, 152, 64), new THREE.MeshBasicMaterial({ color: 0x3ee0ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  rg.rotation.x = -Math.PI / 2; rg.position.set(0, 1.0, 30);
  scene.add(rg);
} else {
  const list = only ? only.split(',') : ORDER;
  const cols = list.length > 5 ? 5 : list.length;
  const rows = Math.ceil(list.length / cols);
  list.forEach(function (id, i) {
    const g = d3BrawlerModel(id, COL[id]);
    const cx = (i % cols) - (cols - 1) / 2;
    const cz = Math.floor(i / cols) - (rows - 1) / 2;
    g.position.set(cx * 126, 0, cz * 155);
    g.rotation.y = -1.05;
    scene.add(g); groups.push(g);
  });
  cam.position.set(0, 250, 700);
  cam.lookAt(0, 50, 0);
  cam.fov = 30;
  cam.updateProjectionMatrix();
}
const base = [];
groups.forEach(function (g) { base.push(g.position.y); });
let t0 = 0;
function frame(ts) {
  const t = ts / 1000;
  if (!t0) t0 = t;
  groups.forEach(function (g, i) {
    g.position.y = Math.sin(t * 1.5 + i) * 1.4;
    const P = g.userData.parts;
    if (P) {
      if (P.armL) P.armL.rotation.z = Math.sin(t * 1.5 + i) * 0.08;
      if (P.armR) P.armR.rotation.z = -Math.sin(t * 1.5 + i) * 0.08;
      if (P.baseRing) P.baseRing.material.opacity = 0.4 + Math.sin(t * 2) * 0.1;
    }
  });
  r.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
