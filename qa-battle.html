<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA · battle view</title>
<style>
html,body{margin:0;padding:0;background:#0b0d10;font:11px/1.3 -apple-system,sans-serif;color:#8a8f98}
.wrap{display:flex;gap:8px;align-items:flex-start}
iframe{border:0;background:#07080a;display:block}
.lab{padding:3px 6px;font-size:10px;letter-spacing:.1em;color:#7d838d}
</style></head>
<body>
<div class="wrap">
  <div><div class="lab">DESKTOP 820</div><iframe id="d" width="820" height="700" src="/legacy/?vip=hs2026&qa=d"></iframe></div>
  <div><div class="lab">MOBILE 390</div><iframe id="m" width="390" height="700" src="/legacy/?vip=hs2026&qa=m"></iframe></div>
</div>
<script>
(function () {
  function drive(id) {
    var fr = document.getElementById(id), step = 0, n = 0;
    var iv = setInterval(function () {
      var d = null;
      try { d = fr.contentDocument; } catch (e) { return; }
      if (!d || !d.querySelector) return;
      if (++n > 160) { clearInterval(iv); return; }
      if (step === 0) {
        if (d.querySelector('#arena')) { step = 2; return; }
        var we = d.querySelector('#warEnter');
        if (we && !d.querySelector('#mBattle.open')) { we.click(); step = 1; }
      } else if (step === 1) {
        var st = d.querySelector('[data-stage]');
        if (st) { st.click(); step = 1.5; }
      } else if (step === 1.5) {
        var sd = d.querySelector('[data-start]');
        if (sd) { sd.click(); step = 2; }
      } else if (step === 2) {
        var b = d.querySelector('#bAuto');
        if (b && b.textContent.indexOf('AUTO') >= 0) { b.click(); step = 3; clearInterval(iv); }
      }
    }, 220);
  }
  drive('d'); drive('m');
})();
</script>
</body></html>
